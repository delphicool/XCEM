<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>星驰赛事管理系统 XCEM — 无人机足球资格赛 + 淘汰赛</title>
<style>
/* ===========================================================
   XCEM - 星驰赛事管理系统
   单文件 HTML / 离线运行 / 业务算法与 UI 严格分离
   =========================================================== */
:root{
  --bg:#f4f6fb; --panel:#ffffff; --ink:#1f2937; --ink-soft:#4b5563; --muted:#9ca3af;
  --line:#e5e7eb; --line-strong:#d1d5db;
  --primary:#1e40af; --primary-2:#2563eb; --primary-soft:#dbeafe;
  --success:#15803d; --success-soft:#dcfce7;
  --warn:#b45309; --warn-soft:#fef3c7;
  --danger:#b91c1c; --danger-soft:#fee2e2;
  --gold:#ca8a04; --gold-soft:#fef9c3;
  --red-team:#dc2626; --blue-team:#2563eb;
  --shadow:0 1px 2px rgba(15,23,42,.06), 0 4px 16px rgba(15,23,42,.06);
  --radius:8px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;line-height:1.55}
button{font-family:inherit;font-size:13px;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:13px}
table{border-collapse:collapse;width:100%}

/* ===== 顶部导航 ===== */
.app-header{display:flex;align-items:center;justify-content:space-between;background:#0b1a2e;color:#fff;padding:10px 18px;box-shadow:var(--shadow);position:sticky;top:0;z-index:50}
.app-header .brand{font-weight:700;font-size:16px;letter-spacing:.5px}
.app-header .brand .v{color:#fbbf24;font-weight:500;margin-left:6px;font-size:12px}
.app-header .right-actions{display:flex;gap:8px;align-items:center}
.app-header .pill{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);color:#fff;padding:4px 10px;border-radius:999px;font-size:12px}
.app-header button.btn-lock{background:#fbbf24;color:#0b1a2e;border:none;padding:6px 12px;border-radius:6px;font-weight:600}

/* ===== 主布局 ===== */
.layout{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 50px)}
.sidebar{background:#0f1f3a;color:#cbd5e1;padding:18px 0;border-right:1px solid rgba(255,255,255,.06);position:relative;display:flex;flex-direction:column}
.side-version{margin-top:auto;padding:12px 16px;font-size:11px;color:#64748b;text-align:center;border-top:1px solid rgba(255,255,255,.06)}
.sidebar .nav{display:flex;flex-direction:column;gap:2px;padding:0 10px}
.sidebar .nav a{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:6px;color:#cbd5e1;text-decoration:none;font-size:13.5px}
.sidebar .nav a:hover{background:rgba(255,255,255,.06);color:#fff}
.sidebar .nav a.active{background:#1e40af;color:#fff;font-weight:600}
.sidebar .nav .group-title{margin:14px 12px 6px;font-size:11px;color:#64748b;text-transform:uppercase;letter-spacing:1px}
.sidebar .nav .badge{background:#fbbf24;color:#0b1a2e;border-radius:999px;padding:1px 6px;font-size:10px;margin-left:auto;font-weight:700}

.main{padding:20px 24px;overflow-x:auto}
.main h1{font-size:20px;margin:0 0 4px}
.main .sub{color:var(--ink-soft);font-size:13px;margin-bottom:18px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:18px}
.panel h2{margin:0 0 12px;font-size:16px;display:flex;align-items:center;gap:8px}
.panel h2 .meta{font-size:12px;color:var(--muted);font-weight:400}
.panel-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.panel-section{margin-bottom:14px}

/* ===== 表单 ===== */
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.field label{font-size:12px;color:var(--ink-soft);font-weight:500}
.field input,.field select,.field textarea{padding:7px 9px;border:1px solid var(--line-strong);border-radius:6px;background:#fff;outline:none;transition:border-color .15s,box-shadow .15s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--primary-2);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.field-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.entry-row{grid-template-columns:1fr 1fr 4fr}
.round-sub{font-size:12px;font-weight:600;color:var(--ink-soft);margin:10px 0 4px;text-align:center}

/* ===== 比赛选择模糊搜索下拉 ===== */
.e-suggest-wrap{position:relative}
.e-suggest{position:absolute;left:0;right:0;top:100%;z-index:50;background:#fff;border:1px solid var(--line-strong);border-radius:6px;box-shadow:0 8px 24px rgba(15,23,42,.15);max-height:280px;overflow:auto;display:none;margin-top:2px}
.e-suggest-item{padding:8px 12px;cursor:pointer;font-size:13px;border-bottom:1px solid #f1f5f9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.e-suggest-item:last-child{border-bottom:none}
.e-suggest-item:hover,.e-suggest-item.active{background:#eff6ff;color:#1d4ed8}
.e-suggest-empty{padding:8px 12px;color:#94a3b8;font-size:13px}
.match-loc{font-size:18px;font-weight:700;color:var(--primary);margin:2px 0 14px}
.field-inline{display:flex;align-items:center;gap:6px}
.field-inline input[type=checkbox]{width:16px;height:16px}

/* ===== 按钮 ===== */
.btn{padding:7px 14px;border-radius:6px;border:1px solid var(--line-strong);background:#fff;color:var(--ink);font-weight:500;transition:all .15s}
.btn:hover{background:#f3f4f6}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{background:var(--primary-2);border-color:var(--primary-2);color:#fff}
.btn-primary:hover{background:var(--primary);border-color:var(--primary)}
.btn-danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn-danger:hover{background:#991b1b}
.btn-warn{background:var(--warn);border-color:var(--warn);color:#fff}
.btn-warn:hover{background:#92400e}
.btn-success{background:var(--success);border-color:var(--success);color:#fff}
.btn-success:hover{background:#166534}
.btn-ghost{background:transparent;border-color:transparent;color:var(--primary-2)}
.btn-ghost:hover{background:var(--primary-soft)}
.btn-sm{padding:4px 8px;font-size:12px}
.btn-xs{padding:2px 6px;font-size:11px}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}

/* ===== 表格 ===== */
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:#fff}
table.tbl th,table.tbl td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}
table.tbl th{background:#f9fafb;font-weight:600;color:var(--ink-soft);font-size:12px;text-transform:uppercase;letter-spacing:.4px}
table.tbl tr:hover td{background:#f9fafb}
table.tbl tr.locked td{background:#fef9c3}
table.tbl tr.cancelled td{background:#fee2e2;color:#9ca3af;text-decoration:line-through}
table.tbl td.center,table.tbl th.center{text-align:center}
table.tbl td.right,table.tbl th.right{text-align:right}
table.tbl td .pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11px;font-weight:600}
table.tbl td .pill.red{background:#fee2e2;color:#b91c1c}
table.tbl td .pill.blue{background:#dbeafe;color:#1e40af}
table.tbl td .pill.gray{background:#f3f4f6;color:#4b5563}
table.tbl td .pill.gold{background:var(--gold-soft);color:var(--gold)}
table.tbl td .pill.green{background:var(--success-soft);color:var(--success)}
table.tbl td .pill.warn{background:var(--warn-soft);color:var(--warn)}
table.tbl td .pill.danger{background:var(--danger-soft);color:var(--danger)}

/* ===== 大屏/录入页 ===== */
.score-input{width:64px;font-size:24px;font-weight:700;text-align:center;border:2px solid var(--line-strong);border-radius:8px;padding:6px 0}
.score-input:focus{border-color:var(--primary-2);outline:none}
.score-card{display:grid;grid-template-columns:1fr auto 1fr;gap:18px;align-items:center;padding:16px;border:1px solid var(--line);border-radius:10px;background:#fff}
.score-side{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px;border-radius:8px}
.score-side.red{background:#fef2f2;border:1px solid #fecaca}
.score-side.blue{background:#eff6ff;border:1px solid #bfdbfe}
.score-side .name{font-weight:600;font-size:15px}
.score-side .score{font-size:38px;font-weight:800;line-height:1}
.score-side.red .score{color:var(--red-team)}
.score-side.blue .score{color:var(--blue-team)}
.score-side .ctrl{display:flex;gap:6px}
.score-side .ctrl button{width:34px;height:34px;border-radius:6px;border:1px solid var(--line-strong);background:#fff;font-size:18px;font-weight:700}
.score-side.red .ctrl button:hover{background:#fee2e2;color:#b91c1c}
.score-side.blue .ctrl button:hover{background:#dbeafe;color:#1e40af}
.score-vs{font-weight:700;color:var(--muted);font-size:14px}

/* ===== 状态徽章 ===== */
.status-pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:600;background:#f3f4f6;color:#4b5563}
.status-pill.pending{background:#f3f4f6;color:#4b5563}
.status-pill.playing{background:#dbeafe;color:#1e40af}
.status-pill.confirming{background:var(--warn-soft);color:var(--warn)}
.status-pill.locked{background:#dcfce7;color:#15803d}
.status-pill.modified{background:#fee2e2;color:#b91c1c}
.status-pill.cancelled{background:#f3f4f6;color:#9ca3af;text-decoration:line-through}

/* ===== 淘汰赛对阵 ===== */
.bracket{display:flex;gap:14px;overflow-x:auto;padding:8px 0}
.bracket .round{min-width:200px;display:flex;flex-direction:column;justify-content:space-around;gap:10px}
.bracket .round-title{font-size:12px;font-weight:600;color:var(--ink-soft);text-transform:uppercase;text-align:center;margin-bottom:4px}
.bracket .match{border:1px solid var(--line);border-radius:8px;background:#fff;padding:8px;font-size:12.5px;position:relative}
.bracket .match .seed{font-size:10px;color:var(--muted);margin-bottom:3px}
.bracket .match .slot{display:flex;justify-content:space-between;padding:3px 5px;border-radius:4px}
.bracket .match .slot.red{background:#fef2f2;color:var(--red-team)}
.bracket .match .slot.blue{background:#eff6ff;color:var(--blue-team)}
.bracket .match .slot.winner{font-weight:700}
.bracket .match .slot.winner::after{content:" ✓";color:var(--success)}
.bracket .match .slot.loser{color:var(--muted);text-decoration:line-through}
.bracket .match .vs{font-size:10px;color:var(--muted);text-align:center;margin:3px 0}

/* ===== Modal / Toast ===== */
.modal-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.5);display:flex;align-items:center;justify-content:center;z-index:200}
.modal{background:#fff;border-radius:10px;max-width:560px;width:90%;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.3);padding:22px}
.modal h3{margin:0 0 14px;font-size:17px}
.modal .body{margin-bottom:16px}
.modal .footer{display:flex;gap:8px;justify-content:flex-end;border-top:1px solid var(--line);padding-top:12px}
.toast-container{position:fixed;top:60px;right:16px;display:flex;flex-direction:column;gap:6px;z-index:300;pointer-events:none}
.toast{background:#1f2937;color:#fff;padding:9px 14px;border-radius:6px;font-size:13px;min-width:220px;box-shadow:var(--shadow);animation:slideIn .25s}
.toast.success{background:var(--success)}
.toast.error{background:var(--danger)}
.toast.warn{background:var(--warn)}
@keyframes slideIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}

/* ===== 锁屏 ===== */
.lock-overlay{position:fixed;inset:0;background:linear-gradient(135deg,#0b1a2e,#1e3a8a);color:#fff;display:flex;align-items:center;justify-content:center;flex-direction:column;z-index:500}
.lock-overlay h1{margin:0 0 6px;font-size:26px}
.lock-overlay .lock-form{margin-top:18px;display:flex;flex-direction:column;gap:10px;align-items:center}
.lock-overlay input{padding:10px 14px;font-size:16px;border-radius:8px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.1);color:#fff;width:240px;text-align:center;letter-spacing:4px}
.lock-overlay input::placeholder{color:rgba(255,255,255,.5);letter-spacing:1px}
.lock-overlay button{padding:10px 22px;background:#fbbf24;color:#0b1a2e;border:none;border-radius:8px;font-weight:700;font-size:14px}
.lock-overlay .lock-icon{font-size:56px;margin-bottom:12px}

/* ===== 仪表盘 ===== */
.dash-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.stat-card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:14px}
.stat-card .label{font-size:12px;color:var(--ink-soft);text-transform:uppercase}
.stat-card .value{font-size:28px;font-weight:700;margin-top:4px}
.stat-card .sub{font-size:12px;color:var(--muted);margin-top:2px}

/* ===== 抽签转盘动画 ===== */
.draw-anim{display:flex;justify-content:center;align-items:center;height:200px;font-size:22px;font-weight:700;color:var(--primary)}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.spin{animation:spin .8s linear infinite}

/* ===== 大屏 ===== */
.bigscreen{padding:0;background:#0b1a2e;color:#fff;min-height:calc(100vh - 50px)}
.bigscreen .bs-row{display:grid;grid-template-columns:2fr 1fr;gap:0;min-height:calc(100vh - 50px)}
.bigscreen .bs-main{padding:30px;display:flex;flex-direction:column;gap:20px}
.bigscreen .bs-side{background:#061226;padding:30px;border-left:1px solid rgba(255,255,255,.1)}
.bigscreen .bs-now{background:linear-gradient(135deg,#1e3a8a,#3b82f6);border-radius:12px;padding:30px}
.bigscreen .bs-now .label{font-size:14px;color:#cbd5e1;letter-spacing:1px}
.bigscreen .bs-now .teams{display:flex;justify-content:space-around;align-items:center;margin-top:20px;font-size:36px;font-weight:700}
.bigscreen .bs-now .score{font-size:80px;font-weight:800;line-height:1;margin-top:18px;display:flex;justify-content:space-around}
.bigscreen .bs-now .red{color:#fca5a5}
.bigscreen .bs-now .blue{color:#93c5fd}
.bigscreen .bs-next{background:rgba(255,255,255,.05);border-radius:12px;padding:20px}
.bigscreen .bs-next .label{color:#fbbf24;font-size:12px;letter-spacing:1px}
.bigscreen .bs-rank{background:rgba(255,255,255,.05);border-radius:12px;padding:16px;margin-top:14px;font-size:13px}
.bigscreen .bs-rank table{color:#fff}
.bigscreen .bs-rank th{color:#94a3b8;border-bottom:1px solid rgba(255,255,255,.1)}
.bigscreen .bs-rank td{border-bottom:1px solid rgba(255,255,255,.05)}
/* 9.1 大屏 12 列完整排名 */
.bigscreen .bs-header{display:flex;justify-content:space-between;align-items:center;padding:14px 24px;background:rgba(0,0,0,.3);border-bottom:1px solid rgba(255,255,255,.1);gap:16px;flex-wrap:wrap}
.bigscreen .bs-header-left,.bigscreen .bs-header-right{display:flex;align-items:center;gap:8px}
.bigscreen .bs-rot-config{display:flex;align-items:center;flex-wrap:wrap}
.bigscreen .bs-rank-panel{padding:20px;flex:1}
.bigscreen .bs-rank-title{font-size:24px;font-weight:700;color:#fbbf24;margin-bottom:14px;padding-bottom:10px;border-bottom:2px solid rgba(251,191,36,.3)}
/* 6.9.1 大屏分屏(1=资格赛 2=淘汰赛) + 自动向上滚动 */
.bigscreen .bs-tab-btn{border-radius:6px;background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.3);padding:8px 18px;font-size:15px;cursor:pointer}
.bigscreen .bs-tab-btn.active{background:#fbbf24;color:#111;border-color:#fbbf24;font-weight:700}
/* 6.9.2 大屏容器覆盖 table-wrap 白底，修复白底白字看不清 */
.bigscreen .bs-scroll-area{max-height:calc(100vh - 250px);overflow:hidden;background:transparent;border:none}
/* 6.9.2 屏2 淘汰赛对阵树：轮次列布局，一屏展示 */
.bigscreen .bs-ko-tree{display:flex;gap:20px;align-items:flex-start;padding:6px 0}
.bigscreen .bs-ko-col{flex:1;min-width:0;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:14px}
.bigscreen .bs-ko-col-title{font-size:20px;font-weight:700;color:#fbbf24;text-align:center;margin-bottom:10px;padding-bottom:8px;border-bottom:2px solid rgba(251,191,36,.3)}
.bigscreen .bs-ko-sub{font-size:15px;font-weight:700;color:#fbbf24;margin:10px 0 6px;text-align:center}
.bigscreen .bs-ko-card{display:flex;align-items:center;gap:8px;padding:7px 10px;margin-bottom:7px;background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.08);border-radius:8px}
.bigscreen .bs-ko-card .tname{flex:1;font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bigscreen .bs-ko-card .red-name{color:#f87171;text-align:left}
.bigscreen .bs-ko-card .blue-name{color:#60a5fa;text-align:right}
.bigscreen .bs-ko-card .sc{font-size:22px;font-weight:800;color:#fff;padding:0 6px;white-space:nowrap}
.bigscreen .bs-rank-table-wrap{max-height:calc(100vh - 280px);overflow:auto;border-radius:8px;background:rgba(255,255,255,.02)}
.bigscreen .bs-rank-table{width:100%;border-collapse:collapse;font-size:20px}
.bigscreen .bs-rank-table thead{position:sticky;top:0;background:#0f2547;z-index:2}
.bigscreen .bs-rank-table th{padding:14px 8px;color:#fbbf24;font-weight:600;text-align:center;border-bottom:2px solid rgba(251,191,36,.3);white-space:nowrap;font-size:22px}
.bigscreen .bs-rank-table td{padding:12px 8px;border-bottom:1px solid rgba(255,255,255,.06);color:#fff;font-size:20px}
.bigscreen .bs-rank-table tr:hover{background:rgba(251,191,36,.1)}
.bigscreen .bs-rank-table .bs-rank-num{font-size:24px;color:#fbbf24}
.bigscreen .bs-rank-table .bs-team-name{font-weight:700;font-size:20px;color:#ffe066}
.bigscreen .bs-rank-table .bs-team-org{color:#e2e8f0;font-size:15px}
/* 6.9.4 屏2 侧边栏冠亚季军：没结果只显示表头（队名为空），出结果后显示队名 */
.bigscreen .bs-medal{margin-bottom:6px}
.bigscreen .bs-medal-label{font-size:16px;font-weight:700}
.bigscreen .bs-medal-name{font-size:22px;font-weight:700;color:#fff;padding:2px 0 4px;min-height:32px;border-bottom:1px dashed rgba(255,255,255,.15)}
.bigscreen .bs-rank-table .bs-pts{color:#fbbf24;font-size:20px;font-weight:700}
.bigscreen .bs-rank-table .bs-gd{color:#fff;font-weight:600}
.bigscreen .bs-rank-table .bs-w{color:#86efac}
.bigscreen .bs-rank-table .bs-d{color:#fbbf24}
.bigscreen .bs-rank-table .bs-l{color:#fca5a5}
.bigscreen .bs-rank-table .lot-row{background:rgba(251,191,36,.08)}
.bigscreen .bs-progress-bar{position:fixed;bottom:0;left:0;right:0;height:3px;background:rgba(255,255,255,.1);z-index:10}
.bigscreen .bs-progress-fill{height:100%;background:linear-gradient(90deg,#fbbf24,#f59e0b);transition:width 1s linear}

/* ===== 场地编排页 ===== */
.vp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px}
.vp-card h3{display:flex;justify-content:space-between;align-items:center}
.vp-total{font-size:12px;font-weight:600;color:var(--primary);background:var(--primary-soft);padding:2px 10px;border-radius:999px}
.vp-segs{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.vp-seg{display:flex;align-items:center;gap:8px;background:var(--bg-soft, #f8fafc);border:1px solid var(--border, #e2e8f0);border-radius:8px;padding:6px 10px}
.vp-seg-name{font-weight:600;font-size:13px;flex:1}
.vp-seg-meta{font-size:12px;color:var(--muted, #64748b);white-space:nowrap}
.vp-add{display:flex;gap:6px;align-items:center;flex-wrap:wrap;border-top:1px dashed var(--border, #e2e8f0);padding-top:10px}
.vp-add select{padding:4px 6px;border:1px solid var(--border, #e2e8f0);border-radius:6px;font-size:12px;background:var(--bg, #fff);color:var(--text, #0f172a)}
.vp-add input{padding:4px 6px;border:1px solid var(--border, #e2e8f0);border-radius:6px;font-size:12px;background:var(--bg, #fff);color:var(--text, #0f172a)}

/* ===== 打印 ===== */
@media print{
  .app-header,.sidebar,.btn-row,.no-print{display:none !important}
  .layout{display:block}
  .main{padding:0}
  .panel{box-shadow:none;border:1px solid #000;page-break-inside:avoid}
  body{background:#fff}
}

/* ===== 辅助 ===== */
.text-muted{color:var(--muted)}
.text-soft{color:var(--ink-soft)}
.text-danger{color:var(--danger)}
.text-success{color:var(--success)}
.text-warn{color:var(--warn)}
.text-right{text-align:right}

<body>

<!-- ====== 顶栏 ====== -->
<header class="app-header">
  <div class="brand">⚽ 星驰赛事管理系统 <span class="v">XCEM v1.0 · 单机本地版</span></div>
  <div class="right-actions">
    <span class="pill" id="event-name-pill">未命名赛事</span>
    <span class="pill" id="lock-state-pill">🔓 未锁定</span>
    <button class="btn-lock" id="btn-lock-now">🔒 锁定系统</button>
  </div>
</header>

<!-- ====== 锁屏遮罩 ====== -->

    <button id="btn-unlock">解锁</button>
