<!-- ====== 主布局 ====== -->
<div class="layout">
  <aside class="sidebar">
    <nav class="nav" id="side-nav"></nav>
    <div class="side-version" id="side-version"></div>
  </aside>
  <main class="main" id="main-content"></main>
</div>

<!-- ====== Modal / Toast 容器 ====== -->
<div id="modal-root"></div>
<div class="toast-container" id="toast-container"></div>

<script>
/* ============================================================
   XCEM 星驰赛事管理系统 — 主程序入口
   命名空间：window.XCEM
   结构：
       XCEM.Storage          - 持久化
       XCEM.Crypto           - 简单密码哈希
       XCEM.Log              - 操作日志
       XCEM.Model            - 默认数据
       XCEM.Algorithm        - 纯业务算法（不依赖 DOM）
       XCEM.Engine           - 业务服务层（封装算法 + 状态变更 + 日志）
       XCEM.UI               - 视图层
       XCEM.App              - 路由 / 启动 / 锁屏
   ============================================================ */
window.XCEM = window.XCEM || {};
// 版本管理 X.Y.Z：X=大版本；Y=问题顺序号（同一问题的多次修改 Y 不变，未说明是下一个问题时归入同一问题）；Z=每次修改的顺序号
// 6.1.1 场地编排算法改进 → 6.1.2 场地编排算法修改2(V2.0) → 6.1.3 排程与对阵修正 → 6.2.1 报表xlsx与版本管理 → 6.2.2 场地/组别/编排导出全部xlsx → 6.3.1 资格赛页按第几场显示/全部组别视图 → 6.4.1 录入页模糊搜索框生效 → 6.4.2 删除红蓝互换+修复解锁修改后丢失新比分 → 6.4.3 模糊搜索框逐字符更新结果 → 6.4.4 搜索字段扩展为组别/场地名称/场次/队名/校名 → 6.4.5 搜索框默认留空+显示顺序为场地在前场次在后 → 6.4.6 增加组别下拉选择框且搜索条件去掉组别 → 6.4.7 当前比赛显著显示组别/阶段/场地/场次 → 6.5.1 排名页快照改导出xlsx+破同分抽签号录入 → 6.5.2 淘汰赛详细列表增加输出Excel(格式同场地排程) → 6.5.3 生成淘汰对阵前指定场地+场次接续+N强赛命名 → 6.5.4 阶段统一命名+录入页阶段下拉 → 6.6.1 修复阶段下拉仅显示全部(NaN拼接bug)+录入页宽度调整(组别1/3 阶段减半) → 6.6.2 组别列改1/6+录入页排除已归档比赛修复重复 → 6.7.1 淘汰赛场次按阶段·场地局部从1编号 → 6.8.1 对阵树布局+确认后胜者自动填入下一轮+详细列表阶段排序 → 6.8.2 淘汰赛页删除进入比赛录入按钮 → 6.8.3 淘汰赛页安排场地场次按钮 → 6.8.4 录入页淘汰赛场次按阶段局部编号+冠亚军决赛BO3系列 → 6.8.5 导出加阶段列+BO3红蓝不互换 → 6.8.6 录入页淘汰赛未排场地也可搜场地场次 → 6.8.7 分数0-999+16强对阵预创建8强4强占位场 → 6.8.8 决赛赛制设置同步组别+赛事大屏排名显示修复 → 6.9.1 大屏分屏(资格赛/淘汰赛)+自动向上滚动+滚动速度 → 6.9.2 全屏ESC才退出+去抽签号/破同分列+白底颜色修复+全部队伍滚完才切组+淘汰赛对阵树 → 6.9.3 换组别停10秒+淘汰赛指定场地强制重排+大屏组别下拉黑字 → 6.9.4 屏2冠亚季军侧边栏+切换时间替代滚动速度+自适应滚速+5秒刷新结果 → 6.10.1 报表中心重构(组别+报表类型双下拉/选择后显示/下载当前报表) → 6.10.2 报表修复(报表3局部场次编号/检录表阶段下拉/去场地编排表/排程表过滤归档/抽签模板xlsx导入导出) → 6.11.1 操作日志(组别对象ID翻译为名称/详情展开前后对比/落库补全extra) → 6.11.2 操作日志兼容历史非字符串target防御 → 6.12.1 仪表盘重置赛事数据加操作密码校验(与锁屏密码一致,confirm弹窗needPassword) → 6.13.1 修复测试报告3项缺陷(改分后重算result/非数字比分拒绝/upsertGroup不存在id走新建) → 6.14.1 修复Playwright测试报告2项缺陷(确认锁定/改分补save持久化,reload同步刷新顶栏赛事名称) → v1.0 正式发布版(GitHub开源,单机本地版)
XCEM.APP_VERSION = '1.0';

/* ====== 简易哈希 (FNV-1a 32-bit + salt) ======
   说明：仅用于本地密码哈希，规避明文保存；非安全加密。*/
XCEM.Crypto = {
  // 【6.15.1】品牌更名后 salt 保留历史值：修改会导致旧密码哈希失效、历史数据无法解锁
SALT:'xcct-salt-2026',
  hash:function(s){
    if(s===undefined||s===null) s='';
    var str = this.SALT + ':' + String(s);
    var h = 2166136261 >>> 0;
    for(var i=0;i<str.length;i++){
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 16777619) >>> 0;
    }
    // 加一轮扰动
    h ^= h>>>13; h = Math.imul(h,0x5bd1e995)>>>0;
    h ^= h>>>15;
    return ('00000000' + h.toString(16)).slice(-8);
  },
  verify:function(input, hash){ return this.hash(input) === hash; }
};

/* ====== 数据模型默认值 ====== */
XCEM.Model = {
  defaults: function(){
    var now = new Date().toISOString();
    return {
      schema: 6,
      createdAt: now,
      updatedAt: now,
      event: {
        id: 'evt-' + Date.now(),
        name: '2026 东盟无人机足球邀请赛',
        startDate: '',
        endDate: '',
        venue: '',
        timezone: 'Asia/Shanghai',
        note: '',
        passwordHash: XCEM.Crypto.hash('admin123') // 默认密码 admin123
      },
      settings: {
        scoreWin: 3,
        scoreDraw: 1,
        scoreLoss: 0,
        restGap: 1,           // 最小休息场次间隔（默认1场）
        venuesCount: 2,
        autoLockMinutes: 0,   // 0=关闭自动锁屏
        goldenGoalMinutes: 3,
        defaultFinalFormat: 'BO1',
        abandonScore: 9       // 弃权默认比分
      },
      groups: [],            // [{id,name,enabled,qualifyingMatchesPerTeam,knockoutSize,invitedQuota,venueAssign,finalFormat}]
      teams: [],             // [{id,groupId,name,organization,drawNumber,isInvited,status,note}]
      draws: {},             // {groupId:{order:[teamId...],randomSeed,createdAt,redrawCount}}
      matches: [],           // 主赛事表，包含资格赛与淘汰赛
      venuePlan: { segments: [], applied:false }, // 场地编排：{segments:[{venueId,segs:[{groupId,start,end}]}], applied, appliedAt}
      audit: [],              // [{id,ts,action,groupId,target,before,after,reason,note}]
      snapshots: [],         // [{id,ts,kind,data,note}] 排名/晋级快照
      lock: { locked:false, lockedAt:null, lastPage:'dashboard', lastContext:null },
      counters: { teamSeq:0, matchSeq:0, auditSeq:0, snapshotSeq:0 }
    };
  }
};

/* ====== 存储 ====== */
XCEM.Storage = {
  KEY:'xcem_db_v1',
  load: function(){
    try{
      var raw = localStorage.getItem(this.KEY);
      if(!raw) return XCEM.Model.defaults();
      var data = JSON.parse(raw);
      // 简单迁移：保证核心字段存在
      var def = XCEM.Model.defaults();
      for(var k in def){
        if(data[k]===undefined) data[k] = def[k];
      }
      if(!data.counters) data.counters = def.counters;
      // 计数器迁移：max(id)+1
      var maxTeam = 0, maxMatch=0, maxAudit=0, maxSnap=0;
      (data.teams||[]).forEach(function(t){var n=parseInt(String(t.id||'').replace(/\D/g,''),10); if(n>maxTeam) maxTeam=n;});
      (data.matches||[]).forEach(function(m){var n=parseInt(String(m.id||'').replace(/\D/g,''),10); if(n>maxMatch) maxMatch=n;});
      (data.audit||[]).forEach(function(a){var n=parseInt(String(a.id||'').replace(/\D/g,''),10); if(n>maxAudit) maxAudit=n;});
      (data.snapshots||[]).forEach(function(s){var n=parseInt(String(s.id||'').replace(/\D/g,''),10); if(n>maxSnap) maxSnap=n;});
      data.counters.teamSeq = Math.max(data.counters.teamSeq||0, maxTeam);
      data.counters.matchSeq = Math.max(data.counters.matchSeq||0, maxMatch);
      data.counters.auditSeq = Math.max(data.counters.auditSeq||0, maxAudit);
      data.counters.snapshotSeq = Math.max(data.counters.snapshotSeq||0, maxSnap);
      return data;
    }catch(e){
      console.error('Storage load failed, reset to defaults', e);
      return XCEM.Model.defaults();
    }
  },
  save: function(data){
    try{
      data.updatedAt = new Date().toISOString();
      localStorage.setItem(this.KEY, JSON.stringify(data));
      return true;
    }catch(e){
      console.error('Storage save failed', e);
      XCEM.UI && XCEM.UI.toast('保存失败：' + e.message, 'error');
      return false;
    }
  },
  reset: function(){
    localStorage.removeItem(this.KEY);
  },
  exportJSON: function(data){
    return JSON.stringify(data, null, 2);
  },
  importJSON: function(str){
    var data = JSON.parse(str);
    if(typeof data !== 'object' || !data.schema) throw new Error('文件格式错误');
    return data;
  }
};

/* =============================================================
   XCEM.Log  — 操作日志（统一入口）
   ============================================================= */
XCEM.Log = {
  add: function(db, action, payload){
    var cid = (db.counters.auditSeq||0) + 1;
    db.counters.auditSeq = cid;
    payload = payload || {};
    // 6.11.1 除固定字段外，其余 payload 字段（如操作员/随机种子/队数）保留到 extra，便于详情查看
    var known = { groupId:1, target:1, before:1, after:1, reason:1, note:1 };
    var extra = {};
    Object.keys(payload).forEach(function(k){ if(!known[k]) extra[k] = payload[k]; });
    var entry = {
      id: 'aud-' + cid,
      ts: new Date().toISOString(),
      action: action,
      groupId: payload.groupId || null,
      target: payload.target || null,
      before: payload.before || null,
      after: payload.after || null,
      reason: payload.reason || null,
      note: payload.note || null,
      extra: extra
    };
    db.audit.push(entry);
    return entry;
  },
  list: function(db, opts){
    opts = opts || {};
    var arr = db.audit.slice().reverse();
    if(opts.groupId) arr = arr.filter(function(a){return a.groupId===opts.groupId;});
    if(opts.action) arr = arr.filter(function(a){return a.action===opts.action || (a.action||'').indexOf(opts.action)>=0;});
    if(opts.limit) arr = arr.slice(0, opts.limit);
    return arr;
  }
};

/* =============================================================
   XCEM.Algorithm — 纯业务算法 (无 DOM 依赖, 纯函数风格)
   ============================================================= */
XCEM.Algorithm = (function(){

  /** 取组内有效队伍（排除已"取消资格/赛中弃权"但保留赛前弃权？实际需求：赛中弃权移除，赛前弃权记录为0:9）；
      排序用抽签号 */
  function activeTeams(db, groupId){
    return (db.teams||[])
      .filter(function(t){return t.groupId===groupId && t.status!=='disqualified_after_play';})
      .sort(function(a,b){ return (a.drawNumber||0) - (b.drawNumber||0); });
  }

  /** 计算所有队伍的胜平负、进失球、积分等基础统计 */
  function computeBaseStats(db, groupId){
    var teams = activeTeams(db, groupId);
    var stats = {};
    teams.forEach(function(t){
      stats[t.id] = {
        teamId:t.id, played:0, won:0, drawn:0, lost:0,
        gf:0, ga:0, gd:0, pts:0,
        abandonedOut: t.status==='abandoned_pre' ? 1 : 0
      };
    });
    var matches = (db.matches||[])
      .filter(function(m){
        return m.groupId===groupId
          && m.stage==='qualifying'
          && (m.status==='confirmed' || m.status==='locked' || m.status==='modified');
      });
    var cfg = (db.groups.find(function(g){return g.id===groupId;})||{}).settings || db.settings;
    var pWin = cfg.scoreWin || db.settings.scoreWin || 3;
    var pDraw = cfg.scoreDraw || db.settings.scoreDraw || 1;
    var pLoss = cfg.scoreLoss || db.settings.scoreLoss || 0;
    matches.forEach(function(m){
      var a = stats[m.redTeamId], b = stats[m.blueTeamId];
      if(!a||!b) return;
      var s = m.score || {red:0, blue:0};
      var r = s.red||0, bl = s.blue||0;
      // 弃权特殊处理
      if(m.result === 'red_abstain'){ // 红队弃权 = 0:9（蓝胜）
        a.played++; b.played++;
        b.won++; a.lost++;
        a.gf += 0; a.ga += db.settings.abandonScore;
        b.gf += db.settings.abandonScore; b.ga += 0;
        a.pts += pLoss; b.pts += pWin;
        return;
      }
      if(m.result === 'blue_abstain'){
        a.played++; b.played++;
        a.won++; b.lost++;
        a.gf += db.settings.abandonScore; a.ga += 0;
        b.gf += 0; b.ga += db.settings.abandonScore;
        a.pts += pWin; b.pts += pLoss;
        return;
      }
      // 正常或金球/死亡点球（result 表示赢家）
      a.played++; b.played++;
      a.gf += r; a.ga += bl;
      b.gf += bl; b.ga += r;
      if(m.result === 'red_win' || m.result === 'red_golden' || m.result === 'red_penalty'){
        if(m.result === 'red_win'){ a.won++; b.lost++; a.pts += pWin; b.pts += pLoss; }
        else { /* 金球/点球胜也算胜，加入 won 计入积分 */ a.won++; b.lost++; a.pts += pWin; b.pts += pLoss; }
      } else if(m.result === 'blue_win' || m.result === 'blue_golden' || m.result === 'blue_penalty'){
        b.won++; a.lost++; b.pts += pWin; a.pts += pLoss;
      } else if(m.result === 'draw'){
        a.drawn++; b.drawn++; a.pts += pDraw; b.pts += pDraw;
      } else {
        // 兜底：根据原始比分推算
        if(r > bl){ a.won++; b.lost++; a.pts += pWin; b.pts += pLoss; }
        else if(r < bl){ b.won++; a.lost++; b.pts += pWin; a.pts += pLoss; }
        else { a.drawn++; b.drawn++; a.pts += pDraw; b.pts += pDraw; }
      }
    });
    Object.keys(stats).forEach(function(k){
      stats[k].gd = stats[k].gf - stats[k].ga;
    });
    return stats;
  }

  /** 给定一组 teams + stats + matches (资格赛)，按 8 级规则排序
      关键：当某个标准打破部分并列时，对剩余并列队重新应用后续标准。
      tieFinalLot：用于"全部数字标准都无法区分"的抽签结果缓存 {teamId:'lot-N'}
  */
  function sortByCascade(teamIds, base, matches, drawLot){
    var ids = teamIds.slice();
    // 第 1 级：积分 —— 严格按积分分组，积分不同的队伍绝不混排，后续标准只在其内部细分
    var byPts = sortByKey(ids, base, function(s){return -s.pts;});
    var result = [];
    groupByValue(byPts, function(id){ return base[id] ? (base[id].pts||0) : 0; }).forEach(function(group){
      if(group.length === 1){ result.push(group[0]); return; }
      result = result.concat(sortTieBreak(group, base, matches, [
        {key:function(s){return -s.gd;}, label:'净胜球'},
        {key:function(s){return -s.gf;}, label:'总进球'},
        {key:'head_to_head_pts', label:'相互比赛积分'},
        {key:'head_to_head_gd', label:'相互比赛净胜球'},
        {key:'head_to_head_gf', label:'相互比赛进球数'},
        {key:function(s){return s.ga;}, label:'总失球(低)'}
      ], drawLot));
    });
    return result;
  }

  /** 用单一 keyFn 把当前团队排序，但只对 ties 进行细分 */
  function sortByKey(teamIds, base, keyFn){
    if(typeof keyFn === 'string'){
      var k = keyFn;
      keyFn = function(s){return s[k] || 0;};
    }
    return teamIds.slice().sort(function(a,b){
      var va = keyFn(base[a]||{}) ;
      var vb = keyFn(base[b]||{});
      if(va < vb) return -1;
      if(va > vb) return 1;
      return 0;
    });
  }

  /** 在上一级仍并列的组内：用当前标准排序 → 按当前标准值分组 → 仍并列者递归应用后续标准
      修复：分组严格基于当前标准值，任何一级都不能推翻上一级的顺序 */
  function sortTieBreak(group, base, matches, criteria, drawLot){
    if(criteria.length === 0 || group.length === 1) return group.slice();
    var c = criteria[0];
    var sorted = (typeof c.key === 'string')
      ? sortByTiedBySpecialKey(group, base, matches, c.key)
      : sortByKey(group, base, c.key);
    var result = [];
    groupByValue(sorted, function(id){ return getTieValue(id, group, base, matches, c); }).forEach(function(sub){
      if(sub.length === 1){ result.push(sub[0]); }
      else { result = result.concat(sortTieBreak(sub, base, matches, criteria.slice(1), drawLot)); }
    });
    return result;
  }

  /** 取某队在"并列组内部"的当前标准值（h2h 三项只统计并列组内的相互比赛，不再恒为 0） */
  function getTieValue(id, tiedIds, base, matches, criterion){
    if(typeof criterion.key === 'string'){
      if(criterion.key === 'head_to_head_pts') return headToHeadValue(id, tiedIds, matches, 'pts');
      if(criterion.key === 'head_to_head_gd') return headToHeadValue(id, tiedIds, matches, 'gd');
      if(criterion.key === 'head_to_head_gf') return headToHeadValue(id, tiedIds, matches, 'gf');
      return (base[id]||{})[criterion.key] || 0;
    }
    return criterion.key(base[id]||{});
  }

  /** 计算 teamId 在 tiedIds 组内部的相互比赛统计值（与 orderByHeadToHead 口径一致） */
  function headToHeadValue(teamId, tiedIds, matches, metric){
    var setIds = {}; tiedIds.forEach(function(id){ setIds[id] = 1; });
    var acc = { pts:0, gd:0, gf:0 };
    matches.forEach(function(m){
      var a = m.redTeamId, b = m.blueTeamId;
      if(!setIds[a] || !setIds[b]) return;
      if(a !== teamId && b !== teamId) return;
      var s = m.score||{red:0,blue:0};
      var r = s.red||0, bl = s.blue||0;
      var ptsA, ptsB;
      if(m.result === 'red_win' || m.result === 'red_golden' || m.result === 'red_penalty'){ ptsA = 3; ptsB = 0; }
      else if(m.result === 'blue_win' || m.result === 'blue_golden' || m.result === 'blue_penalty'){ ptsA = 0; ptsB = 3; }
      else if(m.result === 'draw'){ ptsA = 1; ptsB = 1; }
      else { if(r>bl){ptsA=3;ptsB=0;} else if(r<bl){ptsA=0;ptsB=3;} else {ptsA=1;ptsB=1;} }
      if(a === teamId){ acc.pts += ptsA; acc.gd += (r-bl); acc.gf += r; }
      else { acc.pts += ptsB; acc.gd += (bl-r); acc.gf += bl; }
    });
    return acc[metric] || 0;
  }

  /** 按 keyFn 值对已排序数组顺序分组（值相同 → 同一组） */
  function groupByValue(ordered, keyFn){
    var groups = [];
    var cur = null, curKey = null;
    ordered.forEach(function(id){
      var v = keyFn(id);
      if(cur && curKey === v){ cur.push(id); }
      else { cur = [id]; curKey = v; groups.push(cur); }
    });
    return groups;
  }

  /** 把 tied 组按 special key 排序（相互比赛统计）；返回排序后的 ids；
      备注：tied 内部必须互有比赛记录，否则相互比赛统计=0，无法区分；这种情况会一路推到抽签  */
  function sortByTiedBySpecialKey(tiedIds, base, matches, kind){
    // 在 tiedIds 内部相互比赛
    if(kind === 'head_to_head_pts') return orderByHeadToHead(tiedIds, base, matches, 'pts');
    if(kind === 'head_to_head_gd')   return orderByHeadToHead(tiedIds, base, matches, 'gd');
    if(kind === 'head_to_head_gf')   return orderByHeadToHead(tiedIds, base, matches, 'gf');
    return tiedIds.slice();
  }

  function orderByHeadToHead(tiedIds, base, matches, metric){
    var setIds = {}; tiedIds.forEach(function(id){setIds[id]=1;});
    var h2h = {};
    tiedIds.forEach(function(id){ h2h[id] = { pts:0, gd:0, gf:0, count:0 }; });
    matches.forEach(function(m){
      var a = m.redTeamId, b = m.blueTeamId;
      if(!setIds[a] || !setIds[b]) return;
      var s = m.score||{red:0,blue:0};
      var r = s.red||0, bl = s.blue||0;
      var ptsA, ptsB, gdA, gdB;
      if(m.result === 'red_win' || m.result === 'red_golden' || m.result === 'red_penalty'){
        ptsA = 3; ptsB = 0;
      } else if(m.result === 'blue_win' || m.result === 'blue_golden' || m.result === 'blue_penalty'){
        ptsA = 0; ptsB = 3;
      } else if(m.result === 'draw'){
        ptsA = 1; ptsB = 1;
      } else {
        if(r>bl){ptsA=3;ptsB=0;}
        else if(r<bl){ptsA=0;ptsB=3;}
        else {ptsA=1;ptsB=1;}
      }
      gdA = r - bl; gdB = -gdA;
      h2h[a].pts += ptsA; h2h[a].gd += gdA; h2h[a].gf += r; h2h[a].count++;
      h2h[b].pts += ptsB; h2h[b].gd += gdB; h2h[b].gf += bl; h2h[b].count++;
    });
    return tiedIds.slice().sort(function(a,b){
      var ha = h2h[a], hb = h2h[b];
      if(metric === 'pts'){
        if(ha.pts !== hb.pts) return hb.pts - ha.pts;
      } else if(metric === 'gd'){
        if(ha.gd !== hb.gd) return hb.gd - ha.gd;
      } else if(metric === 'gf'){
        if(ha.gf !== hb.gf) return hb.gf - ha.gf;
      }
      // 平手 → 按基础指标细化
      return 0;
    });
  }

  // 注：旧版 applyCascade / sameCmpValue / getSpecialKey / tiesByKeyValue / isIdenticalOrder / groupByCmpValue
  // 已由 sortTieBreak / getTieValue / headToHeadValue / groupByValue 替代（8级规则修复：积分优先 + h2h 三标准生效）

  /** 对资格赛做完整排名：返回数组（按名次顺序），每个元素含 teamId, stats, rank, source('qual'|'lot-N') */
  function computeRanking(db, groupId){
    var teams = activeTeams(db, groupId);
    if(teams.length === 0) return { order:[], stats:{}, hasLot:false };
    var base = computeBaseStats(db, groupId);
    var matches = (db.matches||[]).filter(function(m){return m.groupId===groupId && m.stage==='qualifying';});
    var ids = teams.map(function(t){return t.id;});
    var ordered = sortByCascade(ids, base, matches, null);
    // 检查是否还有 ties
    var result = [];
    var hasLot = false;
    var rank = 1;
    var i = 0;
    while(i < ordered.length){
      var j = i;
      // 用所有数字指标分组是否一致
      while(j+1 < ordered.length && stillTied(ordered[j], ordered[j+1], base, matches)){
        j++;
      }
      var group = ordered.slice(i, j+1);
      if(group.length === 1){
        result.push({rank:rank, teamId:group[0], source:'qual'});
      } else {
        // 抽签破同分：按原始抽签号升序
        var map = {};
        teams.forEach(function(t){map[t.id]=t.drawNumber||0;});
        group.sort(function(a,b){return map[a]-map[b];});
        group.forEach(function(id){
          result.push({rank:rank, teamId:id, source:'lot-drawNum'});
        });
        hasLot = true;
      }
      rank += group.length;
      i = j + 1;
    }
    // 把排名号填回 result
    return { order:result, stats:base, hasLot:hasLot };
  }

  function stillTied(a, b, base, matches){
    // 7 个数字标准仍全相等
    var sa = base[a]||{}, sb = base[b]||{};
    if(sa.pts !== sb.pts) return false;
    if(sa.gd !== sb.gd) return false;
    if(sa.gf !== sb.gf) return false;
    if(sa.ga !== sb.ga) return false;
    // 相互比赛指标（实际只有在他们是对头时才可比较，这里只对已被 ties 包围的两组做粗略检查）
    var h2hA = computeH2H(a, [b], base, matches);
    var h2hB = computeH2H(b, [a], base, matches);
    if(h2hA.pts !== h2hB.pts) return false;
    if(h2hA.gd !== h2hB.gd) return false;
    if(h2hA.gf !== h2hB.gf) return false;
    return true;
  }

  function computeH2H(selfId, oppIds, base, matches){
    var oppSet = {}; oppIds.forEach(function(id){oppSet[id]=1;});
    var out = {pts:0, gd:0, gf:0, count:0};
    matches.forEach(function(m){
      var a = m.redTeamId, b = m.blueTeamId;
      if((a===selfId && oppSet[b]) || (b===selfId && oppSet[a])){
        var s = m.score||{red:0,blue:0};
        var r = s.red||0, bl = s.blue||0;
        var isRed = a===selfId;
        var selfScore = isRed ? r : bl;
        var oppScore = isRed ? bl : r;
        if(m.result === (isRed?'red_win':'blue_win') || m.result === (isRed?'red_golden':'blue_golden') || m.result === (isRed?'red_penalty':'blue_penalty')){
          out.pts += 3;
        } else if(m.result === 'draw'){
          out.pts += 1;
        } else {
          if(selfScore > oppScore) out.pts += 3;
          else if(selfScore < oppScore) out.pts += 0;
          else out.pts += 1;
        }
        out.gd += (selfScore - oppScore);
        out.gf += selfScore;
        out.count++;
      }
    });
    return out;
  }

  /** 抽签：使用 Mulberry32 PRNG 可复现，持久化 randomSeed */
  function drawShuffle(teamIds, seed){
    var arr = teamIds.slice();
    var s = (seed == null ? (Math.random()*1e9|0) : seed) >>> 0;
    function rng(){
      s |= 0; s = s + 0x6D2B79F5 | 0;
      var t = Math.imul(s ^ s >>> 15, 1 | s);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    }
    for(var i = arr.length - 1; i > 0; i--){
      var j = Math.floor(rng() * (i+1));
      var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
    }
    return { order:arr, seed:s };
  }

  /** 生成资格赛对阵：环形相邻，每队恰好 playCount 场 (默认2) */
  function genQualifyingMatches(db, groupId){
    var draw = db.draws[groupId];
    if(!draw || !draw.order || draw.order.length < 2) return [];
    var teamCount = draw.order.length;
    var grp = db.groups.find(function(g){return g.id===groupId;}) || {};
    // 4.1 规范: playCount 仅允许 1 / 2
    var raw = grp.qualifyingMatchesPerTeam || 2;
    var playCount;
    if(teamCount % 2 === 0){
      playCount = (raw === 1) ? 1 : 2;
    }else{
      playCount = 2; // N 为奇数时只能用 2（避免轮空）
    }
    var matches = [];
    function addMatch(redId, blueId, matchIndex, round){
      if(!redId || !blueId || redId === blueId) return;
      matches.push({ redTeamId:redId, blueTeamId:blueId, matchIndex:matchIndex, round:round || 1 });
    }
    if(playCount === 1){
      // 相邻配对: A1-A2, A3-A4, …, A_{n-1}-A_n；N/2 场；每队恰好 1 场
      for(var i=0; i<teamCount; i+=2){
        addMatch(draw.order[i], draw.order[i+1], matches.length + 1, 1);
      }
    } else if(teamCount === 2){
      // 4.1: N=2 时退化为 1 场单回合
      addMatch(draw.order[0], draw.order[1], 1, 1);
    } else {
      // 两轮错位对阵：第一轮 A1-A2,A3-A4,… 全部队伍打一次；第二轮 A2-A3,A4-A5,…,A_n-A_1
      for(var j=0; j+1 < teamCount; j+=2) addMatch(draw.order[j], draw.order[j+1], matches.length + 1, 1);
      for(var j=1; j+1 < teamCount; j+=2) addMatch(draw.order[j], draw.order[j+1], matches.length + 1, 2);
      if(teamCount > 2) addMatch(draw.order[teamCount-1], draw.order[0], matches.length + 1, 2);
    }
    return matches;
  }

  /** 特邀名额释放算法 */
  function computeAdvancement(db, groupId){
    var grp = db.groups.find(function(g){return g.id===groupId;});
    if(!grp) return { ok:false, reason:'group_not_found' };
    var N = grp.knockoutSize;
    var M = grp.invitedQuota;
    var ranking = computeRanking(db, groupId).order;
    var R0 = N - M;
    if(R0 < 0) return { ok:false, reason:'invited_exceed_size' };
    // 排名晋级区间 [0, R0)
    var K = 0;
    for(var i=0; i<R0 && i<ranking.length; i++){
      var tid = ranking[i].teamId;
      var team = db.teams.find(function(t){return t.id===tid;});
      if(team && team.isInvited) K++;
    }
    var R = R0 + K;
    var E = M - K;
    if(R > ranking.length){
      return { ok:false, reason:'not_enough_teams', need:R, have:ranking.length };
    }
    // 取前 R 名
    var ranked = ranking.slice(0, R).map(function(r){return r.teamId;});
    // 特邀附加：从本组所有特邀队中，按资格赛排名顺序选 E 个尚未在 ranked 的
    var groupInvited = db.teams
      .filter(function(t){return t.groupId===groupId && t.isInvited && t.status!=='disqualified_after_play';})
      .sort(function(a,b){
        var ra = ranking.find(function(r){return r.teamId===a.id;});
        var rb = ranking.find(function(r){return r.teamId===b.id;});
        return (ra?ra.rank:9999) - (rb?rb.rank:9999);
      });
    var invitedExtra = [];
    groupInvited.forEach(function(t){
      if(invitedExtra.length >= E) return;
      if(ranked.indexOf(t.id) >= 0) return;
      invitedExtra.push(t.id);
    });
    if(ranked.length + invitedExtra.length !== N){
      // 若特邀不足，自动用普通队补足
      var shortage = N - (ranked.length + invitedExtra.length);
      var allRankedIds = ranking.slice(0).map(function(r){return r.teamId;});
      for(var j=0; j<allRankedIds.length && shortage>0; j++){
        var tid = allRankedIds[j];
        if(ranked.indexOf(tid) < 0 && invitedExtra.indexOf(tid) < 0){
          invitedExtra.push(tid);
          shortage--;
        }
      }
    }
    var total = ranked.concat(invitedExtra);
    if(total.length !== N){
      return { ok:false, reason:'final_count_mismatch', got:total.length, expected:N };
    }
    // 去重
    var seen = {};
    var unique = [];
    total.forEach(function(id){ if(!seen[id]) { seen[id]=1; unique.push(id); } });
    if(unique.length !== N){
      return { ok:false, reason:'duplicate', uniq:unique.length, expected:N };
    }
    // 按资格赛排名重排
    var rankById = {};
    ranking.forEach(function(r){ rankById[r.teamId] = r.rank; });
    unique.sort(function(a,b){
      var ra = rankById[a]||9999, rb = rankById[b]||9999;
      if(ra !== rb) return ra - rb;
      var ta = db.teams.find(function(t){return t.id===a;});
      var tb = db.teams.find(function(t){return t.id===b;});
      return (ta?ta.drawNumber:0) - (tb?tb.drawNumber:0);
    });
    return {
      ok:true, N:N, M:M, R0:R0, K:K, R:R, E:E,
      ranked:ranked, invitedExtra:invitedExtra,
      final:unique,
      seq:unique.map(function(id,idx){
        var r = rankById[id];
        var team = db.teams.find(function(t){return t.id===id;});
        return { seed:idx+1, teamId:id, rank:r, isInvited: !!(team && team.isInvited) };
      })
    };
  }

  /** 淘汰赛对阵生成：种子对位 (1 vs N, 2 vs N-1, ...) */
  function genKnockoutFirstRound(db, groupId, advancement){
    if(!advancement.ok) return [];
    var seq = advancement.seq; // [{seed, teamId, ...}]
    var N = seq.length;
    var matches = [];
    for(var i=0; i<N/2; i++){
      var a = seq[i];
      var b = seq[N - 1 - i];
      matches.push({
        redSeed: a.seed,
        blueSeed: b.seed,
        redTeamId: a.teamId,
        blueTeamId: b.teamId
      });
    }
    return matches;
  }

  /** 场地排程算法
      策略：
        - 初始阶段，为每个活跃组别分配一个"专属"场地
        - 当某组所有比赛都被排完时，回收其专属场地
        - 在每轮挑选比赛时：若有组尚未拥有专属场地 → 优先排该组的比赛
        - 若全部有专属场地 → 选最早可开赛的比赛（按队伍下次可赛时间）
        - 时间槽选择：场地当前最早空闲 + 队伍最小休息约束 */
  function autoSchedule(db, groupId){
    var venues = [];
    var vCount = db.settings.venuesCount || 2;
    for(var i=1; i<=vCount; i++){
      venues.push({id:'V'+i, name: i+'号场地', locked:false});
    }
    var unscheduled = (db.matches||[])
      .filter(function(m){
        if(groupId && m.groupId !== groupId) return false;
        if(m.status === 'cancelled') return false;
        if(m.manualLock) return false;
        if(m.scheduledTime) return false;
        return true;
      });
    if(unscheduled.length === 0) return [];
    // 排序：资格赛先，淘汰赛后；matchIndex 升序。
    // matchIndex 已按“段顺序 × 段内第一轮→第二轮”生成，保持此顺序即可实现：
    // ① 组别串行（一个组别全部排完再排下一个） ② 第一轮全部打完再打第二轮
    unscheduled.sort(function(a,b){
      var sa = stageOrder(a.stage), sb = stageOrder(b.stage);
      if(sa !== sb) return sa - sb;
      return (a.matchIndex||0)-(b.matchIndex||0);
    });
    var restGap = db.settings.restGap || 1;
    var teamLastSlot = {};
    var venueNextSlot = {};
    venues.forEach(function(v){ venueNextSlot[v.id] = 0; });
    // 【6.1 bug 修复】排程前扫描所有已排程的比赛（不限 groupId），把已占用的时间槽作为 venueNextSlot 初值，避免跨组时间冲突
    (db.matches||[]).forEach(function(m){
      if(m.status === 'cancelled') return;
      if(!m.venueId || !m.scheduledTime) return;
      var slot = parseSlotTime_(m.scheduledTime);
      if(isNaN(slot)) return;
      if(venues.some(function(v){return v.id===m.venueId;})){
        if((venueNextSlot[m.venueId]||0) <= slot) venueNextSlot[m.venueId] = slot + 1;
      }
    });
    // 6.1: 组专属场地 (venueAssign) 硬约束
    var groupVenueAssign = {};
    (db.groups||[]).forEach(function(g){
      groupVenueAssign[g.id] = Array.isArray(g.venueAssign) ? g.venueAssign.slice() : [];
    });
    var groupVenue = {}; // groupId -> 当前该组优先使用的场地
    var venueLoad = {}; // venueId -> 已排场数（用于跨区边界场的负载均衡选择）
    // 【分区亲和】将每组的队伍按抽签号均分到各场地（区内比赛固定场地，避免队伍跨场地奔波）
    // 例如 84 队 3 场地 → 1-28 号队用 1 号场地，29-56 用 2 号，57-84 用 3 号
    var teamPartition = {}; // teamId -> venue id
    // 【场地编排】优先使用用户编排的段（每段固定场地，可混组别）
    var vp = db.venuePlan;
    if(vp && Array.isArray(vp.segments)){
      vp.segments.forEach(function(vs){
        (vs.segs||[]).forEach(function(seg){
          db.teams.filter(function(t){ return t.groupId===seg.groupId && t.status!=='disqualified_after_play'; })
            .sort(function(a,b){ return (a.drawNumber||0)-(b.drawNumber||0); })
            .slice((seg.start||1)-1, seg.end||0)
            .forEach(function(t){ teamPartition[t.id] = vs.venueId; });
        });
      });
    }
    // 未编排的队伍/组：按抽签号均分兜底
    (db.groups||[]).forEach(function(g){
      var gAssigned = groupVenueAssign[g.id] || [];
      var usableIds = gAssigned.length > 0 ? gAssigned.slice() : venues.map(function(v){ return v.id; });
      var ts = db.teams.filter(function(t){ return t.groupId===g.id && t.status!=='disqualified_after_play' && !teamPartition[t.id]; })
        .sort(function(a,b){ return (a.drawNumber||0)-(b.drawNumber||0); });
      if(ts.length === 0 || usableIds.length === 0) return;
      var per = Math.ceil(ts.length / usableIds.length);
      ts.forEach(function(t, idx){
        var slotIdx = Math.min(Math.floor(idx / per), usableIds.length - 1);
        teamPartition[t.id] = usableIds[slotIdx];
      });
    });
    // 【边界场预分配】跨区对阵预先选定场地：按两侧区内队伍数（静态负载）小者优先、相同则交替，
    // 避免多组边界场扎堆同一侧导致场地负载不均
    var staticLoad = {};
    venues.forEach(function(v){ staticLoad[v.id] = 0; });
    (db.groups||[]).forEach(function(g){
      var gAssigned = groupVenueAssign[g.id] || [];
      var usableIds = gAssigned.length > 0 ? gAssigned.slice() : venues.map(function(v){ return v.id; });
      var ts2 = db.teams.filter(function(t){ return t.groupId===g.id && t.status!=='disqualified_after_play'; })
        .sort(function(a,b){ return (a.drawNumber||0)-(b.drawNumber||0); });
      var per2 = Math.ceil(ts2.length / usableIds.length);
      ts2.forEach(function(t, idx){
        var slotIdx = Math.min(Math.floor(idx / per2), usableIds.length - 1);
        staticLoad[usableIds[slotIdx]] = (staticLoad[usableIds[slotIdx]]||0) + 1;
      });
    });
    var boundaryFlip = {}; // 同一对场地间的边界场交替开关
    var boundaryAssign = {}; // matchId -> venue id
    unscheduled.forEach(function(m){
      var pr = teamPartition[m.redTeamId];
      var pb = teamPartition[m.blueTeamId];
      if(pr && pb && pr !== pb){
        var sa = staticLoad[pr]||0, sb = staticLoad[pb]||0;
        var pickFirst;
        if(sa !== sb){
          pickFirst = sa < sb;
        } else {
          var key = [pr, pb].sort().join('|');
          boundaryFlip[key] = !(boundaryFlip[key] === true);
          pickFirst = (boundaryFlip[key] === (pr < pb));
        }
        boundaryAssign[m.id] = pickFirst ? pr : pb;
      }
    });
    var plans = [];
    var SLOT = 1;
    while(unscheduled.length > 0){
      // 【组别串行】一个组别的比赛全部排完再排下一个组别，避免混编场地内不同组别交错“插队”
      // unscheduled 已按 stage→matchIndex 排序，第一个元素所在的组即当前优先组；
      // 组内按“最早可开赛时间”选择（考虑分区场地当前占用与队伍休息约束，同组多段跨场地并行推进）
      var priorityGroup = unscheduled[0].groupId;
      var pick = null;
      var bestStart = Infinity;
      unscheduled.forEach(function(m){
        if(m.groupId !== priorityGroup) return;
        var pr = teamPartition[m.redTeamId];
        var pb = teamPartition[m.blueTeamId];
        var venSlot = 0;
        if(pr && pb && pr !== pb){
          venSlot = Math.min(venueNextSlot[pr]||0, venueNextSlot[pb]||0);
        } else if(pr){
          venSlot = venueNextSlot[pr]||0;
        }
        var la = Math.max(teamLastSlot[m.redTeamId]||0, teamLastSlot[m.blueTeamId]||0);
        var start = Math.max(venSlot, la + 1 + restGap);
        if(start < bestStart){ pick = m; bestStart = start; }
      });
      // 选场地：1) 组专属场地（venueAssign 硬约束） 2) 无专属时 groupVenue 预留 3) 最早空闲
      // 【6.1 修复】跨组借用：专属场地明显更晚空闲时，允许临时借用其他组的专属场地
      var chosenVenue = null;
      var isBorrowed = false;
      var assignedVenues = groupVenueAssign[pick.groupId] || [];
      if(assignedVenues.length > 0){
        // 在专属场地中选最早空闲
        var earliestSlot = Infinity;
        assignedVenues.forEach(function(vid){
          var v = venues.find(function(x){return x.id===vid;});
          if(v) {
            if((venueNextSlot[vid]||0) < earliestSlot){ earliestSlot = venueNextSlot[vid]||0; chosenVenue = v; }
          }
        });
        // 借用判断：存在其他可用的非专属场地，且空闲时间明显更早（≥2 槽）→ 借用
        venues.forEach(function(v){
          if(v.locked) return;
          if(assignedVenues.indexOf(v.id) >= 0) return;
          if((venueNextSlot[v.id]||0) + 2 <= earliestSlot){ chosenVenue = v; isBorrowed = true; }
        });
      }
      if(!chosenVenue && !isBorrowed){
        // 【分区亲和】双方队伍分区场地一致 → 固定该场地；跨区边界场 → 选两区中更早空闲的
        var pRed = teamPartition[pick.redTeamId];
        var pBlue = teamPartition[pick.blueTeamId];
        if(pRed && pBlue){
          if(pRed === pBlue){
            var vv = venues.find(function(v){ return v.id===pRed && !v.locked; });
            if(vv) chosenVenue = vv;
          } else {
            var preset = boundaryAssign[pick.id];
            if(preset){
              var vp = venues.find(function(v){ return v.id===preset && !v.locked; });
              if(vp) chosenVenue = vp;
            }
            if(!chosenVenue){
              var vr = venues.find(function(v){ return v.id===pRed && !v.locked; });
              var vb = venues.find(function(v){ return v.id===pBlue && !v.locked; });
              if(vr && vb){
                // 跨区边界场：优先选已排场数更少的一侧（负载均衡），相同再选更早空闲的
                var lr = venueLoad[vr.id]||0, lb = venueLoad[vb.id]||0;
                chosenVenue = (lr !== lb) ? (lr < lb ? vr : vb)
                  : ((venueNextSlot[vr.id]||0) <= (venueNextSlot[vb.id]||0) ? vr : vb);
              } else {
                chosenVenue = vr || vb;
              }
            }
          }
          if(chosenVenue) groupVenue[pick.groupId] = chosenVenue;
        }
      }
      if(!chosenVenue && !isBorrowed){
        chosenVenue = groupVenue[pick.groupId];
        // 【负载均衡】绑定场地明显更忙（其他场地至少早 2 槽）时，改用最早空闲场地，
        // 避免单场地超负荷、其他场地闲置（例如某组打完比赛后其场地被闲置不用）
        if(chosenVenue){
          var boundSlot = venueNextSlot[chosenVenue.id]||0;
          var best = null, bestSlot = Infinity;
          venues.forEach(function(v){
            if(v.locked) return;
            if(v.id === chosenVenue.id) return;
            var s = venueNextSlot[v.id]||0;
            if(s + 2 <= boundSlot && s < bestSlot){ best = v; bestSlot = s; }
          });
          if(best) chosenVenue = best;
        }
      }
      if(!chosenVenue){
        chosenVenue = null;
        var minNext = Infinity;
        venues.forEach(function(v){
          if(v.locked) return;
          if(venueNextSlot[v.id] < minNext){ chosenVenue = v; minNext = venueNextSlot[v.id]; }
        });
        if(!chosenVenue){
          // 兜底：用第 1 个场地
          chosenVenue = venues[0];
        }
        groupVenue[pick.groupId] = chosenVenue;
      }
      // 计算时间槽：场地当前最早空闲 vs 队伍休息约束（至少空 restGap 场 → 下次至少 last + restGap + 1）
      var nextSlot = venueNextSlot[chosenVenue.id];
      var ra = teamLastSlot[pick.redTeamId]||0;
      var rb = teamLastSlot[pick.blueTeamId]||0;
      var minTeamSlot = Math.max(ra, rb) + 1 + restGap;
      if(minTeamSlot > nextSlot) nextSlot = minTeamSlot;
      pick.venueId = chosenVenue.id;
      pick.scheduledTime = 'T+' + nextSlot;
      if(isBorrowed){
        var ownerGrp2 = (db.groups||[]).find(function(g){
          return (Array.isArray(g.venueAssign) && g.venueAssign.indexOf(chosenVenue.id) >= 0);
        });
        pick.borrowedFromGroupId = ownerGrp2 ? ownerGrp2.name : '公共场地';
      }
      teamLastSlot[pick.redTeamId] = nextSlot;
      teamLastSlot[pick.blueTeamId] = nextSlot;
      venueNextSlot[chosenVenue.id] = nextSlot + SLOT;
      venueLoad[chosenVenue.id] = (venueLoad[chosenVenue.id]||0) + 1;
      plans.push({matchId:pick.id, venueId:pick.venueId, time:pick.scheduledTime});
      // 移除
      var idx = unscheduled.indexOf(pick);
      if(idx >= 0) unscheduled.splice(idx, 1);
      // 检查该组是否全部排完 → 释放场地
      var stillHas = unscheduled.some(function(m){return m.groupId===pick.groupId;});
      if(!stillHas){
        delete groupVenue[pick.groupId];
      }
    }
    return plans;
  }
  function stageOrder(stage){
    if(stage==='qualifying') return 1;
    if(stage==='knockout') return 2;
    if(stage==='third') return 3;
    if(stage==='final') return 4;
    return 9;
  }

  // 6.1 辅助：解析 'T+N' / ISO 时间字符串
  function parseSlotTime_(s){
    if(typeof s === 'number') return s;
    if(!s) return NaN;
    var m = String(s).match(/T\+(\d+)/);
    if(m) return parseInt(m[1], 10);
    var t = Date.parse(s);
    if(!isNaN(t)) return Math.floor(t/60000);
    return NaN;
  }

  /** 校验抽签流程：检查每队对阵是否符合"环 A[i]-A[(i+1)%N]" —— 仅在生成资格赛前调用 */
  function isRingDrawn(db, groupId){
    var d = db.draws[groupId];
    return !!(d && d.order && d.order.length >= 2);
  }

  /** 确认/取消资格赛阶段 */
  /** 按比赛结果自动判定淘汰赛胜者（普通比分在确认时才能定胜负） */
  function applyKnockoutWinner(m){
    if(m.stage === 'qualifying') return;
    if(m.result === 'red_win' || m.result === 'red_golden' || m.result === 'red_penalty' || m.result === 'blue_abstain') m.winnerTeamId = m.redTeamId;
    else if(m.result === 'blue_win' || m.result === 'blue_golden' || m.result === 'blue_penalty' || m.result === 'red_abstain') m.winnerTeamId = m.blueTeamId;
    else if(m.result === 'draw') m.winnerTeamId = null;
  }
  function confirmMatch(db, matchId, opts){
    opts = opts || {};
    var m = db.matches.find(function(x){return x.id===matchId;});
    if(!m) return { ok:false, reason:'not_found' };
    var before = JSON.parse(JSON.stringify(m));
    if(m.status === 'cancelled') return { ok:false, reason:'cancelled' };
    // 【6.8】淘汰赛确认时按比分自动判定胜者
    applyKnockoutWinner(m);
    m.status = 'locked';
    m.confirmedAt = new Date().toISOString();
    m.lockedAt = m.confirmedAt;
    if(opts.reason) m.confirmReason = opts.reason;
    XCEM.Log.add(db, 'match.confirm', {
      groupId:m.groupId, target:m.id, before:before, after:JSON.parse(JSON.stringify(m))
    });
    return { ok:true };
  }

  /** 修改已锁定比赛 */
  function updateMatchLocked(db, matchId, changes, reason){
    if(!reason || !reason.trim()) return { ok:false, reason:'reason_required' };
    var m = db.matches.find(function(x){return x.id===matchId;});
    if(!m) return { ok:false, reason:'not_found' };
    var before = JSON.parse(JSON.stringify(m));
    Object.keys(changes).forEach(function(k){
      if(k === 'id' || k === 'groupId') return;
      m[k] = changes[k];
    });
    // 【6.13.1】XCEM-BUG-01：改分后按新比分重算 result（原实现只改 score 不改 result，排名/晋级仍按旧 result 判定失真）
    if(changes.score && !changes.result){
      var sc = m.score || {};
      var newRed = (typeof sc.red === 'number' && !isNaN(sc.red)) ? sc.red : 0;
      var newBlue = (typeof sc.blue === 'number' && !isNaN(sc.blue)) ? sc.blue : 0;
      m.result = newRed > newBlue ? 'red_win' : (newRed < newBlue ? 'blue_win' : 'draw');
      // 改分回归普通比分判定，清除金球/点球特殊标志
      m.goldenGoal = false; m.deathPenalty = false;
    }
    m.modified = true;
    m.modifiedAt = new Date().toISOString();
    m.modifyReason = reason;
    // 【6.8】修改后按结果重新判定胜者
    applyKnockoutWinner(m);
    // 解锁（confirming）时保留"待确认"状态以便编辑比分；其它修改标记为 modified
    if(changes.status === 'confirming' || changes.status === 'modified'){
      m.status = changes.status;
    } else {
      m.status = 'modified';
    }
    XCEM.Log.add(db, 'match.modify', {
      groupId:m.groupId, target:m.id, before:before, after:JSON.parse(JSON.stringify(m)),
      reason:reason
    });
    return { ok:true };
  }

  return {
    activeTeams: activeTeams,
    computeBaseStats: computeBaseStats,
    computeRanking: computeRanking,
    drawShuffle: drawShuffle,
    genQualifyingMatches: genQualifyingMatches,
    computeAdvancement: computeAdvancement,
    genKnockoutFirstRound: genKnockoutFirstRound,
    autoSchedule: autoSchedule,
    confirmMatch: confirmMatch,
    updateMatchLocked: updateMatchLocked,
    isRingDrawn: isRingDrawn
  };
})();

/* =============================================================
   XCEM.Engine — 业务服务层（封装算法 + 状态变更 + 日志 + 持久化）
   所有写操作均调用 XCEM.Storage.save
   ============================================================= */
XCEM.Engine = (function(){
  var db = null;
  function setDb(d){ db = d; }
  function getDb(){ return db; }
  function save(){ XCEM.Storage.save(db); }

  /** 通用：取下一个 id */
  function nextId(kind){
    if(kind === 'team'){ db.counters.teamSeq = (db.counters.teamSeq||0)+1; return 'tm-'+db.counters.teamSeq; }
    if(kind === 'match'){ db.counters.matchSeq = (db.counters.matchSeq||0)+1; return 'm-'+db.counters.matchSeq; }
    if(kind === 'snap'){ db.counters.snapshotSeq = (db.counters.snapshotSeq||0)+1; return 'snap-'+db.counters.snapshotSeq; }
    return 'id-' + Date.now();
  }

  /** 事件 / 赛事信息 */
  function setEvent(info){
    var before = JSON.parse(JSON.stringify(db.event));
    Object.keys(info).forEach(function(k){ db.event[k] = info[k]; });
    if(info.password){ db.event.passwordHash = XCEM.Crypto.hash(info.password); delete db.event.password; }
    XCEM.Log.add(db, 'event.update', { before:before, after:JSON.parse(JSON.stringify(db.event)) });
    save();
  }
  function changePassword(oldP, newP){
    if(!XCEM.Crypto.verify(oldP, db.event.passwordHash)) return { ok:false, reason:'wrong_old' };
    if(!newP || newP.length < 4) return { ok:false, reason:'too_short' };
    db.event.passwordHash = XCEM.Crypto.hash(newP);
    XCEM.Log.add(db, 'event.passwordChange', {});
    save();
    return { ok:true };
  }

  /** 全局设置 */
  function setSettings(s){
    var before = JSON.parse(JSON.stringify(db.settings));
    // 【6.8.8】决赛默认赛制变更时，同步所有组别 finalFormat（重新生成对阵后生效）
    if(s.defaultFinalFormat && s.defaultFinalFormat !== before.defaultFinalFormat){
      db.groups.forEach(function(gr){
        if(gr.finalFormat !== s.defaultFinalFormat){
          var oldFmt = gr.finalFormat;
          gr.finalFormat = s.defaultFinalFormat;
          XCEM.Log.add(db, 'group.update', { groupId:gr.id, before:{finalFormat:oldFmt}, after:{finalFormat:s.defaultFinalFormat}, note:'决赛赛制随赛事设置同步' });
        }
      });
    }
    Object.keys(s).forEach(function(k){ db.settings[k] = s[k]; });
    XCEM.Log.add(db, 'settings.update', { before:before, after:JSON.parse(JSON.stringify(db.settings)) });
    save();
  }

  /** 组别 */
  function upsertGroup(g){
    if(!g.id){
      g.id = 'grp-' + Date.now() + '-' + Math.floor(Math.random()*1e6);
      g.enabled = g.enabled !== false;
      g.qualifyingMatchesPerTeam = g.qualifyingMatchesPerTeam || 2;
      g.knockoutSize = g.knockoutSize || 0;
      g.invitedQuota = g.invitedQuota || 0;
      g.venueAssign = Array.isArray(g.venueAssign) ? g.venueAssign : [];
      g.finalFormat = g.finalFormat || db.settings.defaultFinalFormat || 'BO1';
      db.groups.push(g);
      XCEM.Log.add(db, 'group.create', { groupId:g.id, after:g });
    } else {
      var exist = db.groups.find(function(x){return x.id===g.id;});
      if(!exist){
        // 【6.13.1】XCEM-BUG-03：传入不存在 id 时原实现 JSON.stringify(undefined) 抛异常崩溃；改为按新建处理（补齐默认字段）
        g.enabled = g.enabled !== false;
        g.qualifyingMatchesPerTeam = g.qualifyingMatchesPerTeam || 2;
        g.knockoutSize = g.knockoutSize || 0;
        g.invitedQuota = g.invitedQuota || 0;
        g.venueAssign = Array.isArray(g.venueAssign) ? g.venueAssign : [];
        g.finalFormat = g.finalFormat || db.settings.defaultFinalFormat || 'BO1';
        db.groups.push(g);
        XCEM.Log.add(db, 'group.create', { groupId:g.id, after:g });
      } else {
        var before = JSON.parse(JSON.stringify(exist));
        Object.keys(g).forEach(function(k){ exist[k] = g[k]; });
        XCEM.Log.add(db, 'group.update', { groupId:g.id, before:before, after:JSON.parse(JSON.stringify(exist)) });
      }
    }
    save();
    return g;
  }
  function deleteGroup(id){
    // 级联删除：队伍、抽签、比赛
    var groupTeams = db.teams.filter(function(t){return t.groupId===id;});
    if(groupTeams.length > 0){
      // 仅警告，不阻止
    }
    db.groups = db.groups.filter(function(x){return x.id!==id;});
    db.teams = db.teams.filter(function(t){return t.groupId!==id;});
    delete db.draws[id];
    db.matches = db.matches.filter(function(m){return m.groupId!==id;});
    XCEM.Log.add(db, 'group.delete', { groupId:id });
    save();
  }

  /** 队伍管理 */
  function addTeam(groupId, info){
    var t = {
      id: nextId('team'),
      groupId: groupId,
      name: (info.name||'').trim(),
      organization: info.organization || '',
      drawNumber: 0,
      isInvited: !!info.isInvited,
      status: 'normal',
      note: info.note || ''
    };
    if(!t.name) return { ok:false, reason:'name_required' };
    db.teams.push(t);
    XCEM.Log.add(db, 'team.create', { groupId:groupId, after:t });
    save();
    return { ok:true, team:t };
  }
  function updateTeam(teamId, patch){
    var t = db.teams.find(function(x){return x.id===teamId;});
    if(!t) return { ok:false, reason:'not_found' };
    var before = JSON.parse(JSON.stringify(t));
    Object.keys(patch).forEach(function(k){
      if(k==='id' || k==='groupId') return;
      t[k] = patch[k];
    });
    XCEM.Log.add(db, 'team.update', { groupId:t.groupId, before:before, after:JSON.parse(JSON.stringify(t)) });
    save();
    return { ok:true };
  }
  function deleteTeam(teamId){
    var t = db.teams.find(function(x){return x.id===teamId;});
    if(!t) return { ok:false };
    var hasMatch = db.matches.some(function(m){return m.redTeamId===teamId||m.blueTeamId===teamId;});
    if(hasMatch) return { ok:false, reason:'has_match' };
    db.teams = db.teams.filter(function(x){return x.id!==teamId;});
    XCEM.Log.add(db, 'team.delete', { groupId:t.groupId, target:teamId });
    save();
    return { ok:true };
  }
  function batchImportTeams(groupId, lines){
    var ok = 0, fail = 0;
    lines.forEach(function(line){
      var parts = String(line).split(/[,\t]/);
      if(parts.length >= 1 && parts[0].trim()){
        var r = addTeam(groupId, {
          name: parts[0].trim(),
          organization: (parts[1]||'').trim(),
          isInvited: /^(y|yes|true|1|特邀|是)$/i.test((parts[2]||'').trim())
        });
        if(r.ok) ok++; else fail++;
      }
    });
    return { ok:ok, fail:fail };
  }
  function autoNumberDraws(groupId){
    var ts = db.teams.filter(function(t){return t.groupId===groupId;});
    ts.sort(function(a,b){return a.name.localeCompare(b.name, 'zh');});
    ts.forEach(function(t,i){ t.drawNumber = i+1; });
    XCEM.Log.add(db, 'team.drawNumber', { groupId:groupId });
    save();
  }

  /**
   * 2.1 + 1.1 校验组别配置：返回 {ok, errors[], warnings[]}
   * 校验项：
   *  ① 特邀名额 M == 实际 isInvited=true 队数
   *  ② 每支队 name 不为空
   *  ③ 同组内 drawNumber 唯一
   *  ④ 无重名（同组内队名+组织完全一致）
   *  ⑤ 至少有 1 支队
   *  ⑥ enabled 组别有效（>=2 队）
   */
  function validateGroup(groupId){
    var grp = db.groups.find(function(g){return g.id===groupId;});
    if(!grp) return { ok:false, errors:['组别不存在'] };
    var teams = db.teams.filter(function(t){return t.groupId===groupId;});
    var errors = [];
    if(!grp.enabled) errors.push({code:'group_disabled', msg:'组别已禁用'});
    if(teams.length === 0) errors.push({code:'no_teams', msg:'本组还没有任何队伍'});
    if(teams.length < 2) errors.push({code:'min_2_teams', msg:'资格赛至少需要 2 支队'});
    var M = grp.invitedQuota || 0;
    var actualInvited = teams.filter(function(t){return t.isInvited;}).length;
    if(M !== actualInvited){
      errors.push({code:'invited_mismatch', msg:'特邀名额 M=' + M + ' 与实际特邀队数 ' + actualInvited + ' 不一致（请调整 M 或修改队伍特邀标记）'});
    }
    var nameMap = {};
    teams.forEach(function(t){
      if(!t.name || !t.name.trim()){
        errors.push({code:'empty_name', msg:'存在队名为空的队伍'});
      } else {
        var key = t.name + '|' + (t.organization||'');
        if(nameMap[key]) errors.push({code:'dup_team', msg:'"' + t.name + '/' + (t.organization||'') + '" 在本组重复'});
        nameMap[key] = true;
      }
    });
    var drawMap = {};
    teams.forEach(function(t){
      var dn = t.drawNumber||0;
      if(dn > 0){
        if(drawMap[dn]) errors.push({code:'dup_draw_num', msg:'抽签号 ' + dn + ' 在本组重复'});
        drawMap[dn] = true;
      }
    });
    return { ok:errors.length === 0, errors:errors, M:M, actualInvited:actualInvited, totalTeams:teams.length };
  }

  /** 抽签 */
  function doDraw(groupId, mode, manualOrder){
    // 【2.1】硬阻塞：组别校验未通过时禁止任何形式抽签（含现场导入）
    var v = validateGroup(groupId);
    if(!v.ok) return { ok:false, reason:'validation_failed', errors:v.errors };
    var teams = db.teams.filter(function(t){return t.groupId===groupId && t.status!=='disqualified_after_play';});
    if(teams.length < 2) return { ok:false, reason:'min_teams' };
    var order;
    var seed;
    if(mode === 'manual' && manualOrder && manualOrder.length === teams.length){
      order = manualOrder.slice();
      seed = 0;
    } else {
      var tids = teams.map(function(t){return t.id;});
      var r = XCEM.Algorithm.drawShuffle(tids);
      order = r.order; seed = r.seed;
    }
    // 写回 drawNumber
    order.forEach(function(id, idx){
      var t = db.teams.find(function(x){return x.id===id;});
      if(t) t.drawNumber = idx+1;
    });
    db.draws[groupId] = {
      order: order,
      randomSeed: seed,
      createdAt: new Date().toISOString(),
      redrawCount: (db.draws[groupId]?db.draws[groupId].redrawCount:0) + 1,
      source: (mode==='manual' ? '现场抽签' : '系统随机'),
      importedAt: (mode==='manual' ? new Date().toISOString() : null),
      importedBy: (mode==='manual' ? (manualOrder._by||'') : null),
      drawNote: (mode==='manual' ? (manualOrder._note||'') : null)
    };
    XCEM.Log.add(db, 'draw.run', { groupId:groupId, seed:seed, count:order.length });
    save();
    return { ok:true, order:order, seed:seed };
  }

  /**
   * 5.1 现场抽签结果导入
   * @param groupId 组别ID
   * @param pasteText 操作员从 Excel 复制粘贴的文本（竖线 | 分隔，兼容 tab / 逗号）
   * @param importedBy 操作员姓名（必填）
   * @param drawNote 备注（可选）
   * @returns {ok, order, errors?}
   */
  function importDrawResult(groupId, pasteText, importedBy, drawNote){
    var grp = db.groups.find(function(g){return g.id===groupId;});
    if(!grp) return { ok:false, reason:'group_not_found' };
    // 若本组已有已确认的资格赛，导入新抽签会破坏赛程 → 前置拒绝，避免半途写入
    var hasLockedQual = db.matches.some(function(m){return m.groupId===groupId && m.stage==='qualifying' && (m.status==='locked' || m.status==='confirmed' || m.status==='modified');});
    if(hasLockedQual){
      return { ok:false, reason:'qualifying_gen_failed', detail:'already_generated_with_results', errors:['本组已存在已确认的资格赛，无法重新导入抽签（请先删除已确认比赛或另建组别）'] };
    }
    var groupTeams = db.teams.filter(function(t){return t.groupId===groupId && t.status!=='disqualified_after_play';});
    if(groupTeams.length < 2) return { ok:false, reason:'min_teams' };

    // 1) 解析粘贴文本
    var lines = (pasteText||'').split(/\r?\n/).map(function(s){return s.trim();}).filter(function(s){return s.length;});
    if(lines.length === 0) return { ok:false, reason:'empty_paste' };

    var rows = [];
    var errors = [];
    var seenNumbers = {};
    lines.forEach(function(line, idx){
      var cols = line.split(/\t|,|\|/).map(function(c){return c.trim();});
      // 列顺序: 抽签号 | 队名 | 组织 | 组别 | 特邀
      var drawNum = parseInt(cols[0], 10);
      if(isNaN(drawNum) || drawNum < 1){
        // 如果第一行是 header（"抽签号/队名/..."）则跳过
        if(idx === 0 && isNaN(drawNum)) return;
        errors.push('第 '+(idx+1)+' 行：抽签号不是正整数（"'+esc(cols[0])+'"）');
        return;
      }
      if(seenNumbers[drawNum]){
        errors.push('第 '+(idx+1)+' 行：抽签号 '+drawNum+' 重复');
        return;
      }
      seenNumbers[drawNum] = true;
      rows.push({
        lineNo: idx+1,
        drawNum: drawNum,
        teamName: cols[1]||'',
        org: cols[2]||'',
        groupLabel: cols[3]||'',
        invited: /[★✓✔是]/.test(cols[4]||'')
      });
    });
    if(errors.length > 0) return { ok:false, reason:'parse_errors', errors:errors };

    // 2) 校验抽签号 1..N 不重不漏
    var N = groupTeams.length;
    var missing = [];
    for(var i=1; i<=N; i++){ if(!seenNumbers[i]) missing.push(i); }
    if(missing.length > 0) return { ok:false, reason:'missing_numbers', missing:missing, expected:N, got:rows.length };

    // 3) 三元匹配：每行按"组别+队名+组织"找唯一队
    var matchErrors = [];
    var order = new Array(N);
    rows.forEach(function(r){
      var candidates = groupTeams.filter(function(t){
        return t.name === r.teamName && (t.organization||'') === r.org;
      });
      if(candidates.length === 0){
        matchErrors.push('第 '+r.lineNo+' 行：组别 "'+esc(grp.name)+'" 中找不到队名为 "'+esc(r.teamName)+'"、单位 "'+esc(r.org)+'" 的队伍');
        return;
      }
      if(candidates.length > 1){
        matchErrors.push('第 '+r.lineNo+' 行：组别 "'+esc(grp.name)+'" 中匹配到 '+candidates.length+' 支队（请填写完整的"组织"字段用于消歧）');
        return;
      }
      if(order[r.drawNum-1]){
        matchErrors.push('第 '+r.lineNo+' 行：抽签号 '+r.drawNum+' 已匹配过另一支队');
        return;
      }
      order[r.drawNum-1] = candidates[0].id;
    });
    if(matchErrors.length > 0) return { ok:false, reason:'match_errors', errors:matchErrors };

    // 4) 应用：调用 doDraw with manual mode
    var manualOrder = order.slice();
    manualOrder._by = importedBy||'';
    manualOrder._note = drawNote||'';
    var priorDraw = db.draws[groupId];
    var priorQual = db.matches.some(function(m){return m.groupId===groupId && m.stage==='qualifying';});
    var r = doDraw(groupId, 'manual', manualOrder);
    if(!r.ok) return r;
    XCEM.Log.add(db, 'draw.import', {
      groupId:groupId, by:importedBy, note:drawNote, count:order.length,
      hadPrevDraw: !!priorDraw, hadPrevQual:priorQual
    });
    save();
    // 【5.1 修复】导入成功后真正自动生成资格赛（不再谎报）
    var gen = genQualifying(groupId);
    if(!gen.ok){
      return { ok:false, reason:'qualifying_gen_failed', detail:gen.reason, order:order };
    }
    return { ok:true, order:order, autoGenQualifying:true, qualifyingCount:gen.count };
  }

  /**
   * 7.1 按场地检录表 — 生成 CSV zip（每场地一 csv）
   * @returns {ok, fileName, content}
   */
  // ===== 极简 xlsx 生成器（无外部依赖：ZIP STORED + 最小 OOXML） =====
  var CRC_TABLE = (function(){
    var t = [];
    for(var n=0; n<256; n++){
      var c = n;
      for(var k=0; k<8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      t[n] = c >>> 0;
    }
    return t;
  })();
  function crc32(u8){
    var c = 0xFFFFFFFF;
    for(var i=0; i<u8.length; i++) c = CRC_TABLE[(c ^ u8[i]) & 0xFF] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0;
  }
  function zipStore(entries){
    var enc = new TextEncoder();
    var parts = [];
    var central = [];
    var offset = 0;
    entries.forEach(function(e){
      var nameBytes = enc.encode(e.name);
      var crc = crc32(e.data);
      var local = new Uint8Array(30 + nameBytes.length);
      var dv = new DataView(local.buffer);
      dv.setUint32(0, 0x04034b50, true);
      dv.setUint16(4, 20, true);
      dv.setUint16(6, 0, true);
      dv.setUint16(8, 0, true); // 存储方式（无压缩）
      dv.setUint16(10, 0, true);
      dv.setUint16(12, 0, true);
      dv.setUint32(14, crc, true);
      dv.setUint32(18, e.data.length, true);
      dv.setUint32(22, e.data.length, true);
      dv.setUint16(26, nameBytes.length, true);
      dv.setUint16(28, 0, true);
      local.set(nameBytes, 30);
      parts.push(local, e.data);
      central.push({ name:nameBytes, crc:crc, size:e.data.length, offset:offset });
      offset += local.length + e.data.length;
    });
    var cdParts = [];
    var cdSize = 0;
    central.forEach(function(c){
      var h = new Uint8Array(46 + c.name.length);
      var dv = new DataView(h.buffer);
      dv.setUint32(0, 0x02014b50, true);
      dv.setUint16(4, 20, true);
      dv.setUint16(6, 20, true);
      dv.setUint16(8, 0, true);
      dv.setUint16(10, 0, true);
      dv.setUint16(12, 0, true);
      dv.setUint16(14, 0, true);
      dv.setUint32(16, c.crc, true);
      dv.setUint32(20, c.size, true);
      dv.setUint32(24, c.size, true);
      dv.setUint16(28, c.name.length, true);
      dv.setUint16(30, 0, true);
      dv.setUint16(32, 0, true);
      dv.setUint16(34, 0, true);
      dv.setUint16(36, 0, true);
      dv.setUint32(38, 0, true);
      dv.setUint32(42, c.offset, true);
      h.set(c.name, 46);
      cdParts.push(h);
      cdSize += h.length;
    });
    var eocd = new Uint8Array(22);
    var dvE = new DataView(eocd.buffer);
    dvE.setUint32(0, 0x06054b50, true);
    dvE.setUint16(8, central.length, true);
    dvE.setUint16(10, central.length, true);
    dvE.setUint32(12, cdSize, true);
    dvE.setUint32(16, offset, true);
    var total = offset + cdSize + 22;
    var out = new Uint8Array(total);
    var pos = 0;
    parts.forEach(function(p){ out.set(p, pos); pos += p.length; });
    cdParts.forEach(function(p){ out.set(p, pos); pos += p.length; });
    out.set(eocd, pos);
    return out;
  }
  function buildXlsx(sheetName, rows){
    function xmlEsc(s){
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
    var sheet = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
      + '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>';
    rows.forEach(function(row){
      sheet += '<row>';
      row.forEach(function(cell){
        var v = cell == null ? '' : String(cell);
        sheet += '<c t="inlineStr"><is><t xml:space="preserve">' + xmlEsc(v) + '</t></is></c>';
      });
      sheet += '</row>';
    });
    sheet += '</sheetData></worksheet>';
    var contentTypes = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
      + '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">'
      + '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>'
      + '<Default Extension="xml" ContentType="application/xml"/>'
      + '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>'
      + '<Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>'
      + '</Types>';
    var rels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
      + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
      + '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>'
      + '</Relationships>';
    var workbook = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
      + '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">'
      + '<sheets><sheet name="' + xmlEsc(sheetName) + '" sheetId="1" r:id="rId1"/></sheets></workbook>';
    var wbRels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
      + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
      + '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/>'
      + '</Relationships>';
    var enc = new TextEncoder();
    return zipStore([
      { name:'[Content_Types].xml', data:enc.encode(contentTypes) },
      { name:'_rels/.rels', data:enc.encode(rels) },
      { name:'xl/workbook.xml', data:enc.encode(workbook) },
      { name:'xl/_rels/workbook.xml.rels', data:enc.encode(wbRels) },
      { name:'xl/worksheets/sheet1.xml', data:enc.encode(sheet) }
    ]);
  }

  function exportCheckInTables(){
    var db_ = db;
    var venues = (db_.settings.venuesCount || 2);
    var venueIds = [];
    for(var i=1; i<=venues; i++) venueIds.push('V'+i);
    // 收集每个场地的比赛
    var venuesOut = {};
    venueIds.forEach(function(v){ venuesOut[v] = []; });
    (db_.matches||[]).forEach(function(m){
      if(!m.venueId) return;
      if(m.status==='cancelled') return;
      if(!venuesOut[m.venueId]) venuesOut[m.venueId] = [];
      venuesOut[m.venueId].push(m);
    });
    // 按 scheduledTime 排序（本地槽号解析，避免依赖 Algorithm 内部函数）
    function slotNum(s){
      if(typeof s === 'number') return s;
      if(!s) return 0;
      var mm = String(s).match(/T\+(\d+)/);
      if(mm) return parseInt(mm[1], 10);
      var t = Date.parse(s);
      if(!isNaN(t)) return Math.floor(t/60000);
      return 0;
    }
    Object.keys(venuesOut).forEach(function(v){
      venuesOut[v].sort(function(a,b){
        return slotNum(a.scheduledTime) - slotNum(b.scheduledTime);
      });
    });
    function teamLabel(tid){
      var t = tid ? db_.teams.find(function(x){return x.id===tid;}) : null;
      return t ? t.name : '待定';
    }
    function orgLabel(tid){
      var t = tid ? db_.teams.find(function(x){return x.id===tid;}) : null;
      return t ? (t.organization||'') : '';
    }
    function drawNum(tid){
      var t = tid ? db_.teams.find(function(x){return x.id===tid;}) : null;
      return t ? (t.drawNumber||'') : '';
    }
    function stageLabel(m){
      if(m.stage==='qualifying') return '资格赛';
      if(m.stage==='final') return '冠亚军决赛';
      if(m.stage==='third') return '季军赛';
      if(m.stage==='knockout'){
        // 与 UI 层 koRoundName 一致：按 N/2^(rn-1) 命名（2=冠亚军决赛、4=4强赛、其它=N强赛）
        var gg = (db_.groups||[]).find(function(x){return x.id===m.groupId;});
        var N0 = gg ? (gg.knockoutSize||0) : 0;
        var n = N0 ? Math.max(2, Math.round(N0 / Math.pow(2, (m.round||1)-1))) : 0;
        if(n === 2) return '冠亚军决赛';
        if(n === 4) return '4强赛';
        return n ? (n + '强赛') : '淘汰赛';
      }
      return m.stage||'';
    }
    var xlsxFiles = [];
    venueIds.forEach(function(v){
      var rows = [['开始时间','组别','抽签号(红)','红队','红队单位','抽签号(蓝)','蓝队','蓝队单位','比赛阶段','比赛状态','原属组别(借用场时)','备注']];
      venuesOut[v].forEach(function(m){
        var grp = (db_.groups||[]).find(function(g){return g.id===m.groupId;});
        var grpName = grp?grp.name:'';
        rows.push([
          m.scheduledTime||'',
          grpName,
          drawNum(m.redTeamId),
          teamLabel(m.redTeamId),
          orgLabel(m.redTeamId),
          drawNum(m.blueTeamId),
          teamLabel(m.blueTeamId),
          orgLabel(m.blueTeamId),
          stageLabel(m),
          m.status||'',
          m.borrowedFromGroupId||'',
          m.notes||''
        ]);
      });
      xlsxFiles.push({ name: '检录表-' + v + '.xlsx', content: buildXlsx('检录表-' + v, rows) });
    });
    XCEM.Log.add(db_, 'report.checkInExport', { venues: venueIds.length, totalMatches: Object.keys(venuesOut).reduce(function(a,v){return a+venuesOut[v].length;},0) });
    save();
    return { ok:true, files: xlsxFiles };
  }

  /**
   * 5.1 录入页导出"含抽签号"Excel模板（CSV 格式，操作员复制到 Excel 即可）
   * @param groupId 组别ID
   * @returns CSV 字符串
   */
  function exportTeamsTemplate(groupId){
    var grp = db.groups.find(function(g){return g.id===groupId;});
    if(!grp) return '';
    var teams = db.teams.filter(function(t){return t.groupId===groupId && t.status!=='disqualified_after_play';})
      .sort(function(a,b){ return (a.name||'').localeCompare(b.name||''); });
    var lines = ['抽签号|队名|单位|组别|特邀'];
    teams.forEach(function(t){
      lines.push(['', t.name||'', t.organization||'', grp.name||'', t.isInvited?'★':''].join('|'));
    });
    // 加 BOM 让 Excel 识别 UTF-8
    return '\ufeff' + lines.join('\r\n');
  }

  /**
   * 6.10.2 抽签报名模板导出为 xlsx（列：抽签号|队名|单位|组别|特邀）
   * 填好抽签号后可直接在抽签页“导入抽签报名模板”中导入
   */
  function exportDrawTemplateXlsx(groupId){
    var grp = db.groups.find(function(g){return g.id===groupId;});
    if(!grp) return null;
    var teams = db.teams.filter(function(t){return t.groupId===groupId && t.status!=='disqualified_after_play';})
      .sort(function(a,b){ return (a.name||'').localeCompare(b.name||''); });
