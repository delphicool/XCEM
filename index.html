  /**
   * 6.10.2 解析抽签报名模板 xlsx（Excel 填好抽签号后保存的文件）
   * 支持 STORED 与 DEFLATE 压缩、sharedStrings / inlineStr / 数字单元格
   * 输出与现场粘贴格式一致的竖线分隔文本，可直接喂给 importDrawResult
   * @param u8 Uint8Array
   * @param cb function(err, result) result={ok, text}
   */
  function parseDrawXlsx(u8, cb){
    function fail(reason){ cb(null, { ok:false, reason:reason }); }
    function xmlUnesc(s){
      return String(s).replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&apos;/g,"'");
    }
    function numUnesc(s){
      return String(s).replace(/&#(\d+);/g, function(_,n){ return String.fromCharCode(parseInt(n,10)); })
        .replace(/&#x([0-9a-fA-F]+);/g, function(_,n){ return String.fromCharCode(parseInt(n,16)); });
    }
    function parseSst(xmlText){
      // 自闭合的空 <si/> 归一化为 <si></si>，避免共享字符串索引错位
      xmlText = xmlText.replace(/<(?:[a-zA-Z]+:)?si\b([^>]*?)\/>/g, '<si$1></si>');
      var out = [];
      var siRe = /<(?:[a-zA-Z]+:)?si\b[^>]*>([\s\S]*?)<\/(?:[a-zA-Z]+:)?si>/g;
      var m;
      while((m = siRe.exec(xmlText))){
        var ts = [];
        var tRe = /<(?:[a-zA-Z]+:)?t\b[^>]*>([\s\S]*?)<\/(?:[a-zA-Z]+:)?t>/g;
        var t;
        while((t = tRe.exec(m[1]))){ ts.push(t[1]); }
        out.push(numUnesc(xmlUnesc(ts.join(''))));
      }
      return out;
    }
    function parseSheet(xmlText, sst){
      var rows = [];
      var rowRe = /<(?:[a-zA-Z]+:)?row\b[^>]*>([\s\S]*?)<\/(?:[a-zA-Z]+:)?row>/g;
      var cRe = /<(?:[a-zA-Z]+:)?c\b([^>]*)>([\s\S]*?)<\/(?:[a-zA-Z]+:)?c>/g;
      var m, c;
      while((m = rowRe.exec(xmlText))){
        var cells = [];
        cRe.lastIndex = 0;
        while((c = cRe.exec(m[1]))){
          var attrs = c[1], inner = c[2];
          var tMatch = attrs.match(/\bt\s*=\s*"([^"]*)"/);
          var type = tMatch ? tMatch[1] : '';
          var val = '';
          var vm;
          if(type === 's'){
            vm = inner.match(/<(?:[a-zA-Z]+:)?v[^>]*>([\s\S]*?)<\/(?:[a-zA-Z]+:)?v>/);
            var idx = vm ? parseInt(vm[1], 10) : NaN;
            val = (!isNaN(idx) && sst && sst[idx] != null) ? sst[idx] : '';
          } else if(type === 'inlineStr'){
            var tm = inner.match(/<(?:[a-zA-Z]+:)?t\b[^>]*>([\s\S]*?)<\/(?:[a-zA-Z]+:)?t>/);
            val = tm ? tm[1] : '';
          } else if(type === 'b'){
            vm = inner.match(/<(?:[a-zA-Z]+:)?v[^>]*>([\s\S]*?)<\/(?:[a-zA-Z]+:)?v>/);
            val = (vm && vm[1] === '1') ? 'TRUE' : 'FALSE';
          } else {
            vm = inner.match(/<(?:[a-zA-Z]+:)?v[^>]*>([\s\S]*?)<\/(?:[a-zA-Z]+:)?v>/);
            val = vm ? vm[1] : '';
          }
          cells.push(numUnesc(xmlUnesc(val)));
        }
        rows.push(cells);
      }
      return rows;
    }
    try{
      var dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
      // 1) 从尾部扫描 EOCD
      var eocdPos = -1;
      for(var i = u8.length - 22; i >= Math.max(0, u8.length - 22 - 65558); i--){
        if(dv.getUint32(i, true) === 0x06054b50){ eocdPos = i; break; }
      }
      if(eocdPos < 0) return fail('not_xlsx');
      var entryCount = dv.getUint16(eocdPos + 10, true);
      var cdOffset = dv.getUint32(eocdPos + 16, true);
      // 2) 遍历中央目录找 sheet1 与 sharedStrings
      var p = cdOffset;
      var wanted = { 'xl/worksheets/sheet1.xml': null, 'xl/sharedStrings.xml': null };
      for(var e = 0; e < entryCount && p + 46 <= u8.length; e++){
        if(dv.getUint32(p, true) !== 0x02014b50) return fail('bad_zip');
        var method = dv.getUint16(p + 10, true);
        var compSize = dv.getUint32(p + 20, true);
        var nameLen = dv.getUint16(p + 28, true);
        var extraLen = dv.getUint16(p + 30, true);
        var commentLen = dv.getUint16(p + 32, true);
        var localOffset = dv.getUint32(p + 42, true);
        var name = new TextDecoder('utf-8').decode(u8.subarray(p + 46, p + 46 + nameLen));
        if(Object.prototype.hasOwnProperty.call(wanted, name)){
          wanted[name] = { method:method, compSize:compSize, localOffset:localOffset };
        }
        p += 46 + nameLen + extraLen + commentLen;
      }
      var sheetEntry = wanted['xl/worksheets/sheet1.xml'];
      if(!sheetEntry) return fail('no_sheet');
      // 3) 读取条目：STORED 直接解码；DEFLATE 用 DecompressionStream 解压
      function readEntry(entry){
        var lp = entry.localOffset;
        var lNameLen = dv.getUint16(lp + 26, true);
        var lExtraLen = dv.getUint16(lp + 28, true);
        var dataStart = lp + 30 + lNameLen + lExtraLen;
        var raw = u8.subarray(dataStart, dataStart + entry.compSize);
        if(entry.method === 0){
          return Promise.resolve(new TextDecoder('utf-8').decode(raw));
        }
        if(entry.method === 8){
          if(typeof DecompressionStream === 'undefined') return Promise.reject(new Error('当前浏览器不支持解压，请重新下载模板填写后导入'));
          var ds = new DecompressionStream('deflate-raw');
          return new Response(new Blob([raw]).stream().pipeThrough(ds)).text();
        }
        return Promise.reject(new Error('不支持的压缩方式'));
      }
      var p1 = readEntry(sheetEntry);
      var sstEntry = wanted['xl/sharedStrings.xml'];
      var p2 = sstEntry ? readEntry(sstEntry) : Promise.resolve('');
      Promise.all([p1, p2]).then(function(parts){
        var sst = parts[1] ? parseSst(parts[1]) : null;
        var rows = parseSheet(parts[0], sst)
          .filter(function(r){ return r.some(function(c){ return String(c).trim() !== ''; }); });
        if(!rows.length){ cb(null, { ok:false, reason:'empty_sheet' }); return; }
        cb(null, { ok:true, text: rows.map(function(r){ return r.join('|'); }).join('\n'), rows: rows });
      }).catch(function(err){ cb(null, { ok:false, reason:(err && err.message) || 'parse_error' }); });
    }catch(err){ fail((err && err.message) || 'parse_error'); }
  }

  /**
   * 排程结果导出（按场次顺序，竖线 | 分隔，带 BOM）
   * 列：场次|红队|红队学校|蓝队|蓝队学校|场地|时间
   * @param groupId 组别ID
   * @returns CSV 字符串
   */
  function exportScheduleCsv(groupId){
    var grp = db.groups.find(function(g){return g.id===groupId;});
    if(!grp) return '';
    var ms = db.matches.filter(function(m){ return m.groupId===groupId && m.stage==='qualifying' && m.status!=='cancelled'; });
    // 按时间槽排序（T+0, T+1...）：同一轮先 1vs2、3vs4、5vs6，下一轮再 2vs3、4vs5、6vs7，
    // 保证每队交替出场、有维护设备时间；未排程的按 matchIndex 兜底排后
    function slotNum(s){
      if(typeof s === 'number') return s;
      if(!s) return NaN;
      var mm = String(s).match(/T\+(\d+)/);
      if(mm) return parseInt(mm[1], 10);
      var t = Date.parse(s);
      if(!isNaN(t)) return Math.floor(t/60000);
      return NaN;
    }
    ms.sort(function(a,b){
      var sa = slotNum(a.scheduledTime), sb = slotNum(b.scheduledTime);
      if(isNaN(sa) && isNaN(sb)) return (a.matchIndex||0)-(b.matchIndex||0);
      if(isNaN(sa)) return 1;
      if(isNaN(sb)) return -1;
      return sa - sb || ((a.matchIndex||0)-(b.matchIndex||0));
    });
    function tName(id){ var t = db.teams.find(function(x){return x.id===id;}); return t ? (t.name||'') : '待定'; }
    function tOrg(id){ var t = db.teams.find(function(x){return x.id===id;}); return t ? (t.organization||'') : ''; }
    var lines = ['场次|红队|红队学校|蓝队|蓝队学校|场地|时间'];
    ms.forEach(function(m, idx){
      lines.push([
        '第' + (idx+1) + '场',
        tName(m.redTeamId),
        tOrg(m.redTeamId),
        tName(m.blueTeamId),
        tOrg(m.blueTeamId),
        (m.venueId||'') ? (String(m.venueId).replace(/^V/,'') + '号场地') : '',
        m.scheduledTime||''
      ].join('|'));
    });
    XCEM.Log.add(db, 'schedule.export', { groupId:groupId, count:ms.length });
    save();
    return '\ufeff' + lines.join('\r\n');
  }

  function clearDraw(groupId){
    var prior = db.draws[groupId];
    if(!prior) return { ok:false };
    // 检查是否已有资格赛比赛
    var hasQual = db.matches.some(function(m){return m.groupId===groupId && m.stage==='qualifying';});
    if(hasQual) return { ok:false, reason:'qualify_exists' };
    delete db.draws[groupId];
    // 重置 drawNumber
    db.teams.filter(function(t){return t.groupId===groupId;}).forEach(function(t){ t.drawNumber = 0; });
    XCEM.Log.add(db, 'draw.clear', { groupId:groupId, before:prior });
    save();
    return { ok:true };
  }

  /** 生成资格赛 */
  function genQualifying(groupId){
    if(!XCEM.Algorithm.isRingDrawn(db, groupId)) return { ok:false, reason:'no_draw' };
    // 删除已有未确认的资格赛
    var existedLocked = db.matches.filter(function(m){return m.groupId===groupId && m.stage==='qualifying' && (m.status==='locked' || m.status==='confirmed' || m.status==='modified');});
    if(existedLocked.length > 0){
      return { ok:false, reason:'already_generated_with_results' };
    }
    db.matches = db.matches.filter(function(m){return !(m.groupId===groupId && m.stage==='qualifying');});
    var plans = XCEM.Algorithm.genQualifyingMatches(db, groupId);
    plans.forEach(function(p, idx){
      db.matches.push({
        id: nextId('match'),
        groupId: groupId,
        stage: 'qualifying',
        round: p.round || 1,
        matchIndex: idx+1,
        redTeamId: p.redTeamId,
        blueTeamId: p.blueTeamId,
        venueId: null,
        scheduledTime: null,
        status: 'pending',
        manualLock: false,
        score: { red:0, blue:0 },
        result: null,
        goldenGoal: false,
        deathPenalty: false,
        winnerTeamId: null,
        attackerRed: null,
        attackerBlue: null,
        confirmedAt: null,
        lockedAt: null,
        modified: false,
        notes: ''
      });
    });
    XCEM.Log.add(db, 'qualify.generate', { groupId:groupId, count:plans.length });
    save();
    return { ok:true, count:plans.length };
  }
  function regenQualifying(groupId){
    var anyConfirmed = db.matches.some(function(m){return m.groupId===groupId && m.stage==='qualifying' && (m.status==='locked' || m.status==='confirmed' || m.status==='modified');});
    if(anyConfirmed){
      return { ok:false, reason:'has_confirmed' };
    }
    db.matches = db.matches.filter(function(m){return !(m.groupId===groupId && m.stage==='qualifying');});
    return genQualifying(groupId);
  }

  /** 段内队伍列表：按抽签号排序后取 [start, end] 位次区间 */
  function segmentTeams(seg){
    return db.teams.filter(function(t){ return t.groupId===seg.groupId && t.status!=='disqualified_after_play'; })
      .sort(function(a,b){ return (a.drawNumber||0)-(b.drawNumber||0); })
      .slice((seg.start||1)-1, seg.end||0);
  }

  /** 场地编排（改进算法 V2.0）：
   *  目标：负载均衡（最大与最小负载差尽量小），同时最小化混编场地数量。
   *  策略：允许场地负载达到 maxLoad = target + delta；处理大组时尝试拆成最少段数（k=1,2,…），
   *  每段尽量等分，分配到当前负载最低的 k 个场地，检查是否不超 maxLoad；从 k=1 开始，一旦可行即采用。
   *  分配逻辑：先把每个场地补到 target（needs），剩余部分从负载最小的场地逐个 +1（不超过 maxLoad）；
   *  所有 k 均不可行时，回退到按剩余容量比例分配。段大小 ≥ minSegmentSize。
   *  处理顺序：小组、大组均按队伍数降序，动态考虑已分配后的负载。
   */
  function allocateVenues(opts){
    db.venuePlan = db.venuePlan || { segments: [], applied:false };
    var vCount = db.settings.venuesCount || 2;
    var infos = (db.groups||[]).filter(function(g){ return g.enabled; }).map(function(g){
      var ts = db.teams.filter(function(t){ return t.groupId===g.id && t.status!=='disqualified_after_play'; })
        .sort(function(a,b){ return (a.drawNumber||0)-(b.drawNumber||0); });
      return { groupId:g.id, name:g.name, venueAssign: Array.isArray(g.venueAssign)?g.venueAssign.slice():[], teamCount:ts.length };
    }).filter(function(x){ return x.teamCount > 0; });
    var total = infos.reduce(function(s,x){ return s + x.teamCount; }, 0);
    if(total === 0) return { ok:false, reason:'no_teams' };
    var target = total / vCount;
    // delta 可配置（页面传入），默认 max(5, round(target*10%))
    var delta = (opts && typeof opts.delta === 'number' && opts.delta >= 0) ? opts.delta : Math.max(5, Math.round(target * 0.1));
    var maxLoad = target + delta;
    var minSegmentSize = 3;
    var warnings = [];
    var venues = [];
    for(var i=1; i<=vCount; i++){ venues.push({ venueId:'V'+i, load:0, segs:[] }); }
    function usableVenues(g){
      if(g.venueAssign.length > 0) return venues.filter(function(v){ return g.venueAssign.indexOf(v.venueId) >= 0; });
      return venues;
    }
    function addSeg(v, g, start, end){
      v.segs.push({ groupId:g.groupId, groupName:g.name, start:start, end:end, matches:end-start+1 });
      v.load += end - start + 1;
    }
    // 1. 分组：A 类（可完整放入）与 B 类（必须拆分），均按队伍数降序
    var aGroups = [], bGroups = [];
    infos.forEach(function(g){ (g.teamCount <= maxLoad ? aGroups : bGroups).push(g); });
    aGroups.sort(function(a,b){ return b.teamCount - a.teamCount; });
    bGroups.sort(function(a,b){ return b.teamCount - a.teamCount; });
    // 2. A 类组：完整放入当前负载最小的可用场地；放不下则视为 B 类拆分
    aGroups.forEach(function(g){
      var pool = usableVenues(g);
      if(pool.length === 0){ warnings.push(g.name + '：指定的场地不存在，已跳过'); return; }
      var v = pool.slice().sort(function(a,b){ return a.load - b.load; })[0];
      if(v.load + g.teamCount <= maxLoad){
        addSeg(v, g, 1, g.teamCount);
      } else {
        bGroups.push(g);
      }
    });
    bGroups.sort(function(a,b){ return b.teamCount - a.teamCount; });
    // 3. 大组拆分：k 从 1 开始尝试最少段数，每段先补到 target，剩余按负载最小逐 1 分配（不超 maxLoad）
    function splitByMinK(g, n, pool){
      for(var k=1; k<=pool.length; k++){
        var chosen = pool.slice().sort(function(a,b){ return a.load - b.load; }).slice(0, k);
        // 容量检查：到 maxLoad 的剩余容量之和必须 ≥ n
        var caps = chosen.map(function(v){ return maxLoad - v.load; });
        if(caps.reduce(function(s,x){ return s+x; }, 0) < n) continue;
        // 先满足各场地到 target 的需求（按负载升序依次取）
        var needs = chosen.map(function(v){ return Math.max(0, target - v.load); });
        var alloc = chosen.map(function(){ return 0; });
        var remaining = n;
        for(var i=0; i<chosen.length && remaining > 0; i++){
          var take = Math.min(remaining, needs[i]);
          alloc[i] = take;
          remaining -= take;
        }
        // 剩余部分：从当前负载（含已分配）最小的场地开始逐个 +1，直到用完或全部到 maxLoad
        var guard = 0;
        while(remaining > 0 && guard < 100000){
          var mi = 0;
          for(var j=1; j<chosen.length; j++){
            if(chosen[j].load + alloc[j] < chosen[mi].load + alloc[mi]) mi = j;
          }
          if(chosen[mi].load + alloc[mi] >= maxLoad) break;
          alloc[mi] += 1;
          remaining -= 1;
          guard++;
        }
        if(remaining > 0) continue;
        // 段大小校验：0 段跳过（等价于更小 k）；小于最小段人数跳过（m=1 无法成环）
        var okSeg = alloc.every(function(s){ return s >= minSegmentSize; });
        if(!okSeg) continue;
        // 可行：执行分配并退出 k 循环
        var start = 1;
        chosen.forEach(function(v, i){
          addSeg(v, g, start, start + alloc[i] - 1);
          start += alloc[i];
        });
        return true;
      }
      return false;
    }
    // 回退方案：按各场地剩余容量（target - 负载）比例拆分（所有 k 均不可行时，极少发生）
    function proportionalFallback(g, n, pool){
      warnings.push(g.name + '：无法按最少段数拆分，已回退按剩余容量比例分配');
      var available = pool.filter(function(v){ return v.load < target; });
      if(available.length === 0) available = pool.slice();
      available.sort(function(a,b){ return (target - b.load) - (target - a.load); });
      var rems = available.map(function(v){ return Math.max(target - v.load, 1); });
      var totalRem = rems.reduce(function(s,x){ return s+x; }, 0);
      var sizes = available.map(function(v, i){
        var size = Math.round(n * (rems[i] / totalRem));
        if(size < minSegmentSize) size = minSegmentSize;
        return size;
      });
      // 调整段大小使总和 = n（增加无限制；减少时不低于 2，m=2 仍可成段）
      var diff = n - sizes.reduce(function(s,x){ return s+x; }, 0);
      var idx = 0, guard = 0;
      while(diff !== 0 && guard < 10000){
        if(diff > 0){ sizes[idx] += 1; diff--; }
        else if(sizes[idx] > 2){ sizes[idx] -= 1; diff++; }
        idx = (idx + 1) % sizes.length;
        guard++;
      }
      if(diff !== 0) warnings.push(g.name + '：' + n + ' 队无法满足最小段要求（余 ' + diff + '），请人工调整');
      var start = 1;
      available.forEach(function(v, i){
        var size = sizes[i];
        if(size > 0 && start <= n){
          var end = Math.min(start + size - 1, n);
          addSeg(v, g, start, end);
          start = end + 1;
        }
      });
    }
    bGroups.forEach(function(g){
      var pool = usableVenues(g);
      if(pool.length === 0){ warnings.push(g.name + '：指定的场地不存在，已跳过'); return; }
      var n = g.teamCount;
      if(!splitByMinK(g, n, pool)) proportionalFallback(g, n, pool);
    });
    var segments = venues.filter(function(v){ return v.segs.length > 0; }).map(function(v){
      return { venueId:v.venueId, segs:v.segs.map(function(s){ return { groupId:s.groupId, start:s.start, end:s.end }; }) };
    });
    db.venuePlan = { segments:segments, applied:false, delta:delta };
    XCEM.Log.add(db, 'venueplan.recommend', { total:total, target:Math.round(target*100)/100, delta:delta });
    save();
    return { ok:true, total:total, target:Math.round(target*100)/100, delta:delta, maxLoad:Math.round(maxLoad*100)/100, warnings:warnings, segments:segments };
  }

  /** 应用场地编排：按段重建资格赛（段内两轮错位对阵：第一轮 1vs2,3vs4,… 全部打完；第二轮 2vs3,4vs5,…,队末vs队1）并自动排程 */
  function applyVenuePlan(){
    var vp = db.venuePlan;
    if(!vp || !Array.isArray(vp.segments) || vp.segments.length === 0) return { ok:false, reason:'no_plan' };
    var confirmed = db.matches.filter(function(m){ return m.stage==='qualifying' && (m.status==='locked'||m.status==='confirmed'||m.status==='modified'); });
    if(confirmed.length > 0) return { ok:false, reason:'has_confirmed', detail:confirmed.length };
    // 校验段合法性
    var vCount = db.settings.venuesCount || 2;
    var seen = {};
    var errors = [];
    vp.segments.forEach(function(vs){
      var vid = parseInt(String(vs.venueId||'').replace(/\D/g,''), 10);
      if(isNaN(vid) || vid < 1 || vid > vCount) errors.push('场地 ' + vs.venueId + ' 无效');
      (vs.segs||[]).forEach(function(seg){
        var ts = segmentTeams(seg);
        if(ts.length < 2) errors.push('段 [' + (seg.groupId||'') + ' ' + seg.start + '-' + seg.end + '] 队伍不足 2 支');
        ts.forEach(function(t){
          if(!seen[t.groupId]) seen[t.groupId] = {};
          if(seen[t.groupId][t.id]) errors.push('队伍 ' + t.name + ' 重复出现在多个段');
          seen[t.groupId][t.id] = true;
        });
      });
    });
    if(errors.length > 0) return { ok:false, reason:'invalid_plan', errors:errors };
    // 删除全部资格赛并重建
    db.matches = db.matches.filter(function(m){ return m.stage !== 'qualifying'; });
    var created = 0;
    vp.segments.forEach(function(vs){
      (vs.segs||[]).forEach(function(seg){
        var ts = segmentTeams(seg);
        if(ts.length < 2) return;
        var m = ts.length;
        // 两轮错位对阵：第一轮 1vs2,3vs4,…；第二轮 2vs3,4vs5,…，尾首闭环 队m vs 队1
        var pairs = [];
        for(var j=0; j+1 < m; j += 2) pairs.push({ r:1, a:j, b:j+1 });
        for(var j=1; j+1 < m; j += 2) pairs.push({ r:2, a:j, b:j+1 });
        if(m > 2) pairs.push({ r:2, a:m-1, b:0 });
        for(var j=0; j<pairs.length; j++){
          db.matches.push({
            id: nextId('match'),
            groupId: seg.groupId,
            stage: 'qualifying',
            round: pairs[j].r,
            matchIndex: created + 1,
            redTeamId: ts[pairs[j].a].id,
            blueTeamId: ts[pairs[j].b].id,
            venueId: null,
            scheduledTime: null,
            status: 'pending',
            manualLock: false,
            score: { red:0, blue:0 },
            result: null,
            goldenGoal: false,
            deathPenalty: false,
            winnerTeamId: null,
            attackerRed: null,
            attackerBlue: null,
            confirmedAt: null,
            lockedAt: null,
            modified: false,
            notes: ''
          });
          created++;
        }
      });
    });
    var plannedIds = {};
    vp.segments.forEach(function(vs){ (vs.segs||[]).forEach(function(seg){ segmentTeams(seg).forEach(function(t){ plannedIds[t.id] = true; }); }); });
    var unplanned = db.teams.filter(function(t){ return t.status!=='disqualified_after_play' && !plannedIds[t.id] && db.groups.some(function(g){ return g.id===t.groupId && g.enabled; }); });
    vp.applied = true;
    vp.appliedAt = new Date().toISOString();
    XCEM.Log.add(db, 'venueplan.apply', { count:created, unplanned:unplanned.length });
    save();
    var plans = autoScheduleAll();
    return { ok:true, count:created, unplanned:unplanned.map(function(t){return t.name;}), schedule:plans.length };
  }

  /** 自动排程 */
  function autoScheduleAll(groupId){
    // 先重置已排程（非锁定）
    (db.matches||[]).forEach(function(m){
      if(m.manualLock) return;
      if(groupId && m.groupId !== groupId) return;
      m.venueId = null;
      m.scheduledTime = null;
    });
    var plans = XCEM.Algorithm.autoSchedule(db, groupId);
    plans.forEach(function(p){
      var m = db.matches.find(function(x){return x.id===p.matchId;});
      if(m){
        m.venueId = p.venueId;
        m.scheduledTime = p.time;
      }
    });
    XCEM.Log.add(db, 'schedule.run', { groupId:groupId, count:plans.length });
    save();
    return plans;
  }

  /** 比赛操作 */
  function setScore(matchId, redScore, blueScore){
    var m = db.matches.find(function(x){return x.id===matchId;});
    if(!m) return { ok:false, reason:'not_found' };
    if(m.status === 'cancelled') return { ok:false, reason:'cancelled' };
    if(m.status === 'locked' || m.status === 'confirmed' || m.status === 'modified'){
      // 已锁定，调用方应改用 updateMatchLocked
      return { ok:false, reason:'locked' };
    }
    var before = JSON.parse(JSON.stringify(m));
    // 【6.13.1】XCEM-BUG-02 防御非数字输入：'abc' 经 parseInt 变 NaN，clamp 后仍 NaN，序列化存 null 且 result 被误判 draw
    var rs = String(redScore === '' || redScore === null || redScore === undefined ? '' : redScore).trim();
    var bs = String(blueScore === '' || blueScore === null || blueScore === undefined ? '' : blueScore).trim();
    var redNum = parseInt(rs || '0', 10);
    var blueNum = parseInt(bs || '0', 10);
    if(isNaN(redNum) || isNaN(blueNum)) return { ok:false, reason:'bad_score' };
    // 【6.8.7】分数范围 0-999
    redScore = Math.max(0, Math.min(999, redNum));
    blueScore = Math.max(0, Math.min(999, blueNum));
    m.score = { red:redScore, blue:blueScore };
    // 自动判定 result
    if(m.score.red > m.score.blue) m.result = 'red_win';
    else if(m.score.red < m.score.blue) m.result = 'blue_win';
    else m.result = 'draw';
    // 从 pending 推进到 confirming (待确认)
    if(m.status === 'pending') m.status = 'confirming';
    XCEM.Log.add(db, 'match.score', {
      groupId:m.groupId, target:m.id, before:before, after:JSON.parse(JSON.stringify(m))
    });
    save();
    return { ok:true };
  }
  function setAbstain(matchId, side){
    var m = db.matches.find(function(x){return x.id===matchId;});
    if(!m) return { ok:false, reason:'not_found' };
    if(m.status === 'cancelled') return { ok:false, reason:'cancelled' };
    if(m.status === 'locked' || m.status === 'confirmed' || m.status === 'modified') return { ok:false, reason:'locked' };
    var before = JSON.parse(JSON.stringify(m));
    if(side === 'red'){
      m.result = 'red_abstain';
      m.score = { red:0, blue: db.settings.abandonScore };
      m.winnerTeamId = m.blueTeamId;
    } else if(side === 'blue'){
      m.result = 'blue_abstain';
      m.score = { red: db.settings.abandonScore, blue:0 };
      m.winnerTeamId = m.redTeamId;
    } else {
      return { ok:false, reason:'bad_side' };
    }
    if(m.status === 'pending') m.status = 'confirming';
    XCEM.Log.add(db, 'match.abstain', { groupId:m.groupId, target:m.id, before:before, after:JSON.parse(JSON.stringify(m)) });
    save();
    return { ok:true };
  }
  function setGoldenGoal(matchId, side){
    var m = db.matches.find(function(x){return x.id===matchId;});
    if(!m) return { ok:false, reason:'not_found' };
    if(m.status === 'cancelled' || m.status === 'locked' || m.status === 'confirmed' || m.status === 'modified') return { ok:false, reason:'bad_status' };
    if(!(m.score.red === m.score.blue)) return { ok:false, reason:'not_tied' };
    var before = JSON.parse(JSON.stringify(m));
    m.goldenGoal = true;
    m.goldenGoalWinner = side; // 'red'|'blue'
    if(side === 'red'){ m.result = 'red_golden'; m.winnerTeamId = m.redTeamId; }
    else if(side === 'blue'){ m.result = 'blue_golden'; m.winnerTeamId = m.blueTeamId; }
    XCEM.Log.add(db, 'match.golden', { groupId:m.groupId, target:m.id, before:before, after:JSON.parse(JSON.stringify(m)) });
    save();
    return { ok:true };
  }
  function setDeathPenalty(matchId, side, attackerRed, attackerBlue){
    var m = db.matches.find(function(x){return x.id===matchId;});
    if(!m) return { ok:false, reason:'not_found' };
    if(m.status === 'cancelled' || m.status === 'locked' || m.status === 'confirmed' || m.status === 'modified') return { ok:false, reason:'bad_status' };
    var before = JSON.parse(JSON.stringify(m));
    m.deathPenalty = true;
    m.attackerRed = attackerRed || m.attackerRed || null;
    m.attackerBlue = attackerBlue || m.attackerBlue || null;
    if(side === 'red'){ m.result = 'red_penalty'; m.winnerTeamId = m.redTeamId; }
    else if(side === 'blue'){ m.result = 'blue_penalty'; m.winnerTeamId = m.blueTeamId; }
    XCEM.Log.add(db, 'match.penalty', { groupId:m.groupId, target:m.id, before:before, after:JSON.parse(JSON.stringify(m)) });
    save();
    return { ok:true };
  }
  function confirmMatch(matchId, reason){
    var r = XCEM.Algorithm.confirmMatch(db, matchId, { reason:reason });
    // 【6.8】确认后自动推进淘汰赛：胜者自动填入下一轮对阵框
    if(r.ok) r.autoAdvance = autoAdvanceKnockout(matchId);
    // 【6.14.1】确认锁定必须持久化（原实现资格赛确认时 autoAdvanceKnockout 返回 null，无任何 save，刷新后锁定丢失）
    if(r.ok) save();
    return r;
  }
  function updateMatch(matchId, patch, reason){
    var r = XCEM.Algorithm.updateMatchLocked(db, matchId, patch, reason);
    if(r.ok) r.autoAdvance = autoAdvanceKnockout(matchId);
    // 【6.14.1】改分必须持久化（同 confirmMatch：自动推进未触发 save 时改分结果刷新后丢失）
    if(r.ok) save();
    return r;
  }
  /** 自动推进：当该组当前轮全部完成时，自动生成/更新下一轮对阵并填入胜者 */
  function autoAdvanceKnockout(matchId){
    var m = db.matches.find(function(x){return x.id===matchId;});
    if(!m || m.stage === 'qualifying' || m.archived) return null;
    if(m.stage === 'final') return finalSeriesAdvance(m.groupId);
    var adv = generateNextRound(m.groupId);
    return (adv && adv.ok) ? adv : null;
  }
  /** 决赛系列推进（BO3 最多 3 场最少 2 场 / BO5 最多 5 场最少 3 场，多局先胜制）：
      统计已确认决赛场次胜者，某队先胜够局数 → 系列结束，剩余场次标记取消；
      未分胜负 → 填实下一空场（红蓝不互换：红队打满 BO3 都是红队）。 */
  function finalSeriesAdvance(groupId){
    var grp = db.groups.find(function(g){return g.id===groupId;});
    if(!grp) return null;
    var fmt = grp.finalFormat || 'BO1';
    if(fmt === 'BO1') return null;
    var needWins = fmt === 'BO3' ? 2 : (fmt === 'BO5' ? 3 : 2);
    var seriesN = fmt === 'BO3' ? 3 : (fmt === 'BO5' ? 5 : 1);
    var finals = db.matches.filter(function(m){
      return m.groupId===groupId && m.stage==='final' && !m.archived && m.status!=='cancelled';
    }).sort(function(a,b){ return (a.matchIndex||0)-(b.matchIndex||0); });
    if(finals.length === 0) return null;
    var played = finals.filter(function(m){ return m.status==='locked'||m.status==='confirmed'||m.status==='modified'; });
    if(played.length === 0) return null;
    var wins = {};
    played.forEach(function(m){ if(m.winnerTeamId) wins[m.winnerTeamId] = (wins[m.winnerTeamId]||0) + 1; });
    var a = finals[0].redTeamId, b = finals[0].blueTeamId;
    var champion = null;
    if(a && (wins[a]||0) >= needWins) champion = a;
    if(b && (wins[b]||0) >= needWins) champion = b;
    var changed = false;
    if(champion){
      // 系列结束：取消尚未开打的剩余场次
      finals.forEach(function(m){
        if(m.status==='pending' || m.status==='confirming' || m.status==='playing'){
          m.status = 'cancelled';
          m.notes = '系列已结束（' + needWins + ':' + ((wins[a]||0) > (wins[b]||0) ? (wins[a]||0) + ':' + (wins[b]||0) : (wins[b]||0) + ':' + (wins[a]||0)) + '），本场不再进行';
          changed = true;
        }
      });
      if(changed){ XCEM.Log.add(db, 'knockout.finalSeriesEnd', { groupId:groupId, champion:champion, wins:wins }); save(); }
      return { ok:true, seriesEnded:true, champion:champion, changed:changed };
    }
    // 未分胜负：填实下一空场（【6.8.5】红蓝不互换：红队打满 BO3 都是红队）
    var empty = finals.find(function(m){ return !m.redTeamId || !m.blueTeamId; });
    if(empty && a && b){
      var idx = (empty.matchIndex||1);
      var pair = { red:a, blue:b };
      empty.round = finals[0].round || 0;
      empty.redTeamId = pair.red;
      empty.blueTeamId = pair.blue;
      empty.status = 'pending';
      empty.notes = '决赛第 ' + idx + '/' + seriesN + ' 场 · 赛制: ' + fmt;
      changed = true;
      XCEM.Log.add(db, 'knockout.finalSeriesNext', { groupId:groupId, matchIndex:idx });
      save();
    }
    return { ok:true, seriesEnded:false, filledMatchIndex: empty ? (empty.matchIndex||1) : null, changed:changed };
  }
  function disqualifyTeam(teamId, reason){
    var t = db.teams.find(function(x){return x.id===teamId;});
    if(!t) return { ok:false, reason:'not_found' };
    var before = JSON.parse(JSON.stringify(t));
    t.status = 'disqualified_after_play';
    XCEM.Log.add(db, 'team.disqualify', { groupId:t.groupId, target:teamId, before:before, after:JSON.parse(JSON.stringify(t)), reason:reason });
    // 把后续比赛标记为 cancelled
    db.matches.forEach(function(m){
      if(m.groupId !== t.groupId) return;
      if(m.status === 'cancelled') return;
      if(m.status === 'locked' || m.status === 'confirmed' || m.status === 'modified') return;
      if(m.redTeamId === teamId || m.blueTeamId === teamId){
        if(!m.scheduledTime || m.status === 'pending'){
          m.status = 'cancelled';
          m.cancelReason = '队伍取消后续资格: ' + (reason||'');
        }
      }
    });
    save();
    return { ok:true };
  }
  function cancelMatch(matchId, reason){
    var m = db.matches.find(function(x){return x.id===matchId;});
    if(!m) return { ok:false };
    var before = JSON.parse(JSON.stringify(m));
    m.status = 'cancelled';
    m.cancelReason = reason || '';
    XCEM.Log.add(db, 'match.cancel', { groupId:m.groupId, target:m.id, before:before, after:JSON.parse(JSON.stringify(m)), reason:reason });
    save();
    return { ok:true };
  }

  /** 排名 / 晋级快照 */
  function saveSnapshot(groupId, kind, data){
    var snap = {
      id: nextId('snap'),
      ts: new Date().toISOString(),
      kind: kind,
      groupId: groupId,
      data: data
    };
    db.snapshots.push(snap);
    XCEM.Log.add(db, 'snapshot.save', { groupId:groupId, target:snap.id });
    save();
    return snap;
  }

  /** 淘汰赛 */
  function generateKnockout(groupId, opts){
    opts = opts || {};
    var grp = db.groups.find(function(g){return g.id===groupId;});
    if(!grp) return { ok:false, reason:'no_group' };
    // 【1.1】最后一道防线：校验组别配置
    var v = validateGroup(groupId);
    if(!v.ok){
      return { ok:false, reason:'group_invalid', detail:v };
    }
    var adv = XCEM.Algorithm.computeAdvancement(db, groupId);
    if(!adv.ok) return { ok:false, reason:adv.reason || 'advance_failed', detail:adv };

    // 【10.1】先归档已有未删除的淘汰赛（含其占位场），不删数据
    db.knockoutVersions = db.knockoutVersions || [];
    var existingKO = db.matches.filter(function(m){return m.groupId===groupId && m.stage!=='qualifying' && !m.archived});
    var archivedVersionIds = [];
    if(existingKO.length > 0){
      // 找出现在是 current 的版本，归档它
      var currentVer = db.knockoutVersions.find(function(v){return v.groupId===groupId && v.status==='current';});
      if(currentVer){
        currentVer.status = 'archived';
        currentVer.archivedAt = new Date().toISOString();
        archivedVersionIds.push(currentVer.id);
      }
      existingKO.forEach(function(m){ m.archived = true; m.archivedAt = new Date().toISOString(); });
      XCEM.Log.add(db, 'knockout.archive', { groupId:groupId, count:existingKO.length, versionId: currentVer ? currentVer.id : null });
    }
    // 生成第一轮
    var firstRound = XCEM.Algorithm.genKnockoutFirstRound(db, groupId, adv);
    // 【6.5.3】场地指定：opts.venueId 合法时，全部首轮比赛安排到该场地；
    // 场次从该场地现有最大时间槽之后接续（专用场地则从第1场开始）：1vsN=第1场，2vsN-1=第2场…
    var vCount0 = db.settings.venuesCount || 2;
    var koVenue = (opts.venueId && /^V\d+$/.test(opts.venueId) && parseInt(opts.venueId.slice(1),10) <= vCount0) ? opts.venueId : null;
    var koSlotStart = 0;
    if(koVenue){
      (db.matches||[]).forEach(function(m){
        if(m.status === 'cancelled') return;
        if(m.venueId !== koVenue || !m.scheduledTime) return;
        var mm = String(m.scheduledTime).match(/T\+(\d+)/);
        var s = mm ? parseInt(mm[1], 10) : NaN;
        if(!isNaN(s) && s >= koSlotStart) koSlotStart = s + 1;
      });
    }
    var newMatchIds = [];
    firstRound.forEach(function(p, idx){
      var id = nextId('match');
      newMatchIds.push(id);
      db.matches.push({
        id: id,
        groupId: groupId,
        stage: 'knockout',
        round: 1,
        matchIndex: idx+1,
        redTeamId: p.redTeamId,
        blueTeamId: p.blueTeamId,
        redSeed: p.redSeed,
        blueSeed: p.blueSeed,
        venueId: koVenue,
        scheduledTime: koVenue ? ('T+' + (koSlotStart + idx)) : null,
        status: 'pending',
        manualLock: false,
        score: { red:0, blue:0 },
        result: null,
        goldenGoal: false,
        deathPenalty: false,
        winnerTeamId: null,
        nextMatchId: null,
        loserNextMatchId: null,
        confirmedAt: null,
        lockedAt: null,
        modified: false,
        notes: ''
      });
    });
    // 【6.8.7】预创建中间轮次占位场（8强/4强等）：让排程表/对阵树提前展示完整赛程框架；
    // 胜者决出后由 generateNextRound 填实（下一轮已存在 → 只更新不新建）；
    // 占位场同样排到淘汰赛场地（场次接续首轮之后），保证排程表完整
    var totalRounds = Math.log2(adv.N);
    var koSlotNext = koSlotStart + firstRound.length;
    for(var pr=2; pr<totalRounds; pr++){
      var prCount = adv.N / Math.pow(2, pr);
      for(var pj=1; pj<=prCount; pj++){
        var pid2 = nextId('match'); newMatchIds.push(pid2);
        db.matches.push({
          id: pid2,
          groupId: groupId,
          stage: 'knockout',
          round: pr,
          matchIndex: pj,
          redTeamId: null,
          blueTeamId: null,
          venueId: koVenue,
          scheduledTime: koVenue ? ('T+' + koSlotNext++) : null,
          status: 'pending',
          manualLock: false,
          score: { red:0, blue:0 },
          result: null,
          goldenGoal: false,
          deathPenalty: false,
          winnerTeamId: null,
          nextMatchId: null,
          loserNextMatchId: null,
          confirmedAt: null,
          lockedAt: null,
          modified: false,
          notes: '由上一轮胜者自动填入'
        });
      }
    }
    // 生成季军赛占位（若资格赛至少 4 队，即 4 强及以上）
    var N = adv.N;
    if(N >= 4){
      var tidThird = nextId('match'); newMatchIds.push(tidThird);
      db.matches.push({
        id: tidThird,
        groupId: groupId,
        stage: 'third',
        round: 0,
        matchIndex: 0,
        redTeamId: null,
        blueTeamId: null,
        venueId: koVenue,
        scheduledTime: koVenue ? ('T+' + koSlotNext++) : null,
        status: 'pending',
        manualLock: false,
        score: { red:0, blue:0 },
        result: null,
        goldenGoal: false,
        deathPenalty: false,
        winnerTeamId: null,
        confirmedAt: null,
        lockedAt: null,
        modified: false,
        notes: '由半决赛负者自动进入'
      });
      var tidFinal = nextId('match'); newMatchIds.push(tidFinal);
      db.matches.push({
        id: tidFinal,
        groupId: groupId,
        stage: 'final',
        round: 0,
        matchIndex: 1,
        redTeamId: null,
        blueTeamId: null,
        venueId: koVenue,
        scheduledTime: koVenue ? ('T+' + koSlotNext++) : null,
        status: 'pending',
        manualLock: false,
        score: { red:0, blue:0 },
        result: null,
        goldenGoal: false,
        deathPenalty: false,
        winnerTeamId: null,
        confirmedAt: null,
        lockedAt: null,
        modified: false,
        notes: '决赛 / 赛制: ' + (grp.finalFormat || 'BO1')
      });
      // 【6.8.4】BO3/BO5 决赛系列：额外生成第 2、3 场占位（最多3场，最少2场；三局两胜）
      var finalSeriesCount = grp.finalFormat === 'BO3' ? 3 : (grp.finalFormat === 'BO5' ? 5 : 1);
      for(var fg=2; fg<=finalSeriesCount; fg++){
        var tidFg = nextId('match'); newMatchIds.push(tidFg);
        db.matches.push({
          id: tidFg,
          groupId: groupId,
          stage: 'final',
          round: 0,
          matchIndex: fg,
          redTeamId: null,
          blueTeamId: null,
          venueId: koVenue,
          scheduledTime: koVenue ? ('T+' + koSlotNext++) : null,
          status: 'pending',
          manualLock: false,
          score: { red:0, blue:0 },
          result: null,
          goldenGoal: false,
          deathPenalty: false,
          winnerTeamId: null,
          confirmedAt: null,
          lockedAt: null,
          modified: false,
          notes: '决赛第 ' + fg + '/' + finalSeriesCount + ' 场 · 赛制: ' + (grp.finalFormat || 'BO1')
        });
      }
    }
    // 链接下一轮（半决赛负者→季军赛；半决赛胜者/决赛胜者→决赛）
    var semis = firstRound; // 实际上第一轮就是 16强/8强=多场，半决赛是 round 2
    // 我们重整一下：round=1 是首轮，round=2 是半决赛 (semi)，round=3 是决赛
    // 为简化：第一轮是 round=1，若 N>=8，下一轮是 round=2（含半决赛）；semi 负者进 third，胜者进 final
    // 已生成 firstRound; 重新生成 next links 是复杂逻辑——我们允许 UI 在比赛完成后手动触发"生成下一轮"按钮
    XCEM.Log.add(db, 'knockout.generate', { groupId:groupId, count:firstRound.length, N:adv.N });

    // 【10.1】创建新版本记录
    var prevVersions = db.knockoutVersions.filter(function(v){return v.groupId===groupId;});
    var versionNo = prevVersions.length + 1;
    var newVersion = {
      id: nextId('koVer'),
      groupId: groupId,
      versionNo: versionNo,
      ts: new Date().toISOString(),
      advancementSnapshot: adv,
      matchIds: newMatchIds.slice(),
      status: 'current',
      createdBy: opts.createdBy || '',
      note: opts.note || ''
    };
    db.knockoutVersions.push(newVersion);
    // 给新比赛打 versionId
    newMatchIds.forEach(function(mid){
      var m = db.matches.find(function(x){return x.id===mid;});
      if(m) m.versionId = newVersion.id;
    });
    XCEM.Log.add(db, 'knockout.version.create', { groupId:groupId, versionNo:versionNo, archivedFrom: archivedVersionIds, matchCount:newMatchIds.length });

    save();
    return { ok:true, advancement:adv, firstRound:firstRound, version:newVersion, archivedVersions: archivedVersionIds };
  }

  /**
   * 10.1 获取组别的淘汰赛版本列表
   */
  function getKnockoutVersions(groupId){
    db.knockoutVersions = db.knockoutVersions || [];
    return db.knockoutVersions
      .filter(function(v){return v.groupId===groupId;})
      .sort(function(a,b){return (b.versionNo||0) - (a.versionNo||0);});
  }

  /**
   * 10.1 切换到某历史版本（只读）
   */
  function setActiveVersion(groupId, versionId){
    window.__xcemKActiveVer = versionId;
    return { ok:true };
  }

  /**
   * 10.1 手动作废当前版本（标记 archived）
   */
  function archiveCurrentVersion(groupId){
    var cur = (db.knockoutVersions||[]).find(function(v){return v.groupId===groupId && v.status==='current';});
    if(!cur) return { ok:false, reason:'no_current' };
    cur.status = 'archived';
    cur.archivedAt = new Date().toISOString();
    db.matches.forEach(function(m){
      if(cur.matchIds.indexOf(m.id) >= 0){
        m.archived = true;
        m.archivedAt = new Date().toISOString();
      }
    });
    XCEM.Log.add(db, 'knockout.archive', { groupId:groupId, versionNo:cur.versionNo, versionId:cur.id });
    save();
    return { ok:true, version:cur };
  }
  function generateNextRound(groupId){
    // 把当前轮所有已锁定的胜者挪到下一轮；下一轮已存在时只更新未锁定对阵，不重复创建
    var grp = db.groups.find(function(g){return g.id===groupId;});
    if(!grp) return { ok:false };
    // 仅看 knockout 主线（排除 third/final、已归档；【6.8.7】仅含有队伍的比赛参与推进，占位场不阻断）
    var allKo = db.matches.filter(function(m){return m.groupId===groupId && m.stage==='knockout' && !m.archived;});
    var koMain = allKo.filter(function(m){ return m.redTeamId && m.blueTeamId; });
    if(koMain.length === 0) return { ok:false, reason:'no_ko' };
    var maxRound = Math.max.apply(null, koMain.map(function(m){return m.round||0;}));
    var curr = koMain.filter(function(m){return (m.round||0)===maxRound;});
    if(curr.length === 0) return { ok:false, reason:'no_ko' };
    var incomplete = curr.filter(function(m){
      if(m.status !== 'locked' && m.status !== 'confirmed' && m.status !== 'modified') return true;
      if(!m.winnerTeamId) return true;
      return false;
    });
    if(incomplete.length > 0) return { ok:false, reason:'incomplete', detail:incomplete.length };
    if(curr.length === 1) return { ok:false, reason:'already_final' };
    // 提取胜者（按 matchIndex 排序）
    curr.sort(function(a,b){ return (a.matchIndex||0)-(b.matchIndex||0); });
    var winners = curr.map(function(m){return m.winnerTeamId;});
    var nextRound = maxRound + 1;
    var nextStage = 'knockout';
    // 仅 2 个 winners 时升级为决赛
    var isFinal = (winners.length === 2);
    if(isFinal) nextStage = 'final';
    // 生成下一轮配对：1 vs N, 2 vs N-1
    var nextMatches = [];
    for(var i=0; i<winners.length/2; i++){
      var ra = winners[i];
      var rb = winners[winners.length - 1 - i];
      if(!ra || !rb) return { ok:false, reason:'missing_winner' };
      nextMatches.push({
        stage: nextStage,
        round: nextRound,
        matchIndex: i+1,
        redTeamId: ra,
        blueTeamId: rb
      });
    }
    var updated = false;
    // 【6.8】查重：下一轮 knockout 已存在（含预创建占位场）时只更新未锁定对阵，不重复创建
    var nextRoundKo = allKo.filter(function(m){ return (m.round||0) === nextRound; });
    if(nextRoundKo.length > 0){
      nextRoundKo.sort(function(a,b){ return (a.matchIndex||0)-(b.matchIndex||0); });
      nextMatches.forEach(function(p, j){
        var t = nextRoundKo[j];
        if(t && t.status !== 'locked' && t.status !== 'confirmed' && t.status !== 'modified'){
          if(t.redTeamId !== p.redTeamId || t.blueTeamId !== p.blueTeamId){
            t.redTeamId = p.redTeamId;
            t.blueTeamId = p.blueTeamId;
            t.status = 'pending';
            t.winnerTeamId = null;
            t.score = { red:0, blue:0 };
            t.result = null;
            updated = true;
          }
        }
      });
    } else if(!isFinal){
      // 下一轮尚不存在：新建 knockout 比赛
      nextMatches.forEach(function(p){
        db.matches.push({
          id: nextId('match'),
          groupId: groupId,
          stage: p.stage,
          round: p.round,
          matchIndex: p.matchIndex,
          redTeamId: p.redTeamId,
          blueTeamId: p.blueTeamId,
          venueId: null,
          scheduledTime: null,
          status: 'pending',
          manualLock: false,
          score: { red:0, blue:0 },
          result: null,
          goldenGoal: false,
          deathPenalty: false,
          winnerTeamId: null,
          confirmedAt: null,
          lockedAt: null,
          modified: false,
          notes: nextStage==='final' ? ('决赛 / 赛制: ' + (grp.finalFormat || 'BO1')) : ''
        });
      });
    }
    // 【修复+6.8.4】决赛：填实决赛系列前两场（G1 红=A 蓝=B、G2 红蓝互换），G3+ 待系列推进再填；已锁定不覆盖，避免双决赛
    if(isFinal){
      var fmt = grp.finalFormat || 'BO1';
      var seriesN = fmt === 'BO3' ? 3 : (fmt === 'BO5' ? 5 : 1);
      var finals = db.matches.filter(function(m){
        return m.groupId===groupId && m.stage==='final' && !m.archived;
      }).sort(function(a,b){ return (a.matchIndex||0)-(b.matchIndex||0); });
      // 补建缺失的系列占位（旧版本只有 1 场决赛但赛制为 BO3/BO5）
      while(finals.length < seriesN){
        var fgIdx = finals.length + 1;
        db.matches.push({
          id: nextId('match'),
          groupId: groupId,
          stage: 'final',
          round: 0,
          matchIndex: fgIdx,
          redTeamId: null,
          blueTeamId: null,
          venueId: null,
          scheduledTime: null,
          status: 'pending',
          manualLock: false,
          score: { red:0, blue:0 },
          result: null,
          goldenGoal: false,
          deathPenalty: false,
          winnerTeamId: null,
          confirmedAt: null,
          lockedAt: null,
          modified: false,
          notes: '决赛第 ' + fgIdx + '/' + seriesN + ' 场 · 赛制: ' + fmt
        });
        finals.push(db.matches[db.matches.length-1]);
        updated = true;
      }
      // 填实前两场（【6.8.5】红蓝不互换：红队打满 BO3 都是红队）
      for(var fi=0; fi<finals.length && fi<2; fi++){
        var fm = finals[fi];
        if(fm.status === 'locked' || fm.status === 'confirmed' || fm.status === 'modified') continue;
        var pair = { red: nextMatches[0].redTeamId, blue: nextMatches[0].blueTeamId };
        if(fm.redTeamId !== pair.red || fm.blueTeamId !== pair.blue){
          fm.round = nextRound;
          fm.matchIndex = (fi+1);
          fm.redTeamId = pair.red;
          fm.blueTeamId = pair.blue;
          fm.status = 'pending';
          fm.score = { red:0, blue:0 };
          fm.result = null;
          fm.winnerTeamId = null;
          fm.confirmedAt = null;
          fm.lockedAt = null;
          fm.modified = false;
          fm.notes = seriesN > 1 ? ('决赛第 ' + (fi+1) + '/' + seriesN + ' 场 · 赛制: ' + fmt) : ('决赛 / 赛制: ' + fmt);
          updated = true;
        }
      }
      // 兜底：无任何决赛记录时新建第 1 场
      if(finals.length === 0){
        db.matches.push({
          id: nextId('match'),
          groupId: groupId,
          stage: 'final',
          round: nextRound,
          matchIndex: 1,
          redTeamId: nextMatches[0].redTeamId,
          blueTeamId: nextMatches[0].blueTeamId,
          venueId: null,
          scheduledTime: null,
          status: 'pending',
          manualLock: false,
          score: { red:0, blue:0 },
          result: null,
          goldenGoal: false,
          deathPenalty: false,
          winnerTeamId: null,
          confirmedAt: null,
          lockedAt: null,
          modified: false,
          notes: '决赛 / 赛制: ' + fmt
        });
        updated = true;
      }
    }
    // 半决赛负者填入季军赛占位（未锁定时更新）
    if(isFinal && curr.length === 2){
      var losers = curr.map(function(m){
        return m.redTeamId === m.winnerTeamId ? m.blueTeamId : m.redTeamId;
      });
      if(losers.length === 2){
        var third = db.matches.find(function(m){return m.groupId===groupId && m.stage==='third' && !m.archived;});
        if(third && third.status !== 'locked' && third.status !== 'confirmed' && third.status !== 'modified'){
          if(third.redTeamId !== losers[0] || third.blueTeamId !== losers[1]){
            third.redTeamId = losers[0];
            third.blueTeamId = losers[1];
            third.round = nextRound;
            third.status = 'pending';
            third.winnerTeamId = null;
            updated = true;
          }
        }
      }
    }
    XCEM.Log.add(db, 'knockout.nextRound', { groupId:groupId, round:nextRound, count:nextMatches.length, isFinal:isFinal, updated:updated });
    save();
    return { ok:true, count:nextMatches.length, round:nextRound, isFinal:isFinal, updated:updated };
  }

  /** 给未排场地/场次的淘汰赛安排场地场次：
      venueId 指定时强制重排：该组全部未锁定淘汰赛比赛重新安排到该场地（场次接续）；
      未指定时按 1..N 号场地轮流分配，只排未排场地/场次的比赛；
      场次从各场地现有最大时间槽之后接续（T+N）。 */
  function scheduleKoVenues(groupId, venueId){
    var grp = db.groups.find(function(g){return g.id===groupId;});
    if(!grp) return { ok:false, reason:'no_group' };
    var vCount = db.settings.venuesCount || 2;
    var forceVenue = (venueId && /^V\d+$/.test(venueId) && parseInt(venueId.slice(1),10) <= vCount) ? venueId : null;
    function koRank(m){
      if(m.stage==='knockout') return (m.round||1);
      if(m.stage==='third') return 90;
      if(m.stage==='final') return 91;
      return 0;
    }
    // 6.9.3 可重排的比赛：未锁定未确认、未取消、无手动锁
    var koList = (db.matches||[]).filter(function(m){
      return m.groupId===groupId && m.stage!=='qualifying' && !m.archived && m.status!=='cancelled' && !m.manualLock
        && m.status!=='locked' && m.status!=='confirmed';
    }).sort(function(a,b){
      var d = koRank(a) - koRank(b);
      if(d) return d;
      return (a.matchIndex||0) - (b.matchIndex||0);
    });
    if(koList.length === 0) return { ok:false, reason:'none_pending' };
    if(forceVenue){
      // 指定场地：全部重排到该场地，场次接续（本组被重排的比赛不计入现有最大槽）
      var next = 0;
      (db.matches||[]).forEach(function(m){
        if(m.status === 'cancelled' || m.archived) return;
        if(m.venueId !== forceVenue || !m.scheduledTime) return;
        if(m.groupId === groupId && m.stage !== 'qualifying') return;
        var mm = String(m.scheduledTime).match(/T\+(\d+)/);
        var s = mm ? parseInt(mm[1],10) : NaN;
        if(isNaN(s)) return;
        if(next <= s) next = s + 1;
      });
      koList.forEach(function(m){
        m.venueId = forceVenue;
        m.scheduledTime = 'T+' + (next++);
      });
      XCEM.Log.add(db, 'ko.schedule', { groupId:groupId, count:koList.length, venueId: forceVenue, note:'重排到指定场地' });
      save();
      return { ok:true, count:koList.length, rescheduled:true };
    }
    var pending = koList.filter(function(m){ return !m.venueId || !m.scheduledTime; });
    if(pending.length === 0) return { ok:false, reason:'none_pending' };
    var venueNext = {};
    for(var i=1;i<=vCount;i++){ venueNext['V'+i] = 0; }
    (db.matches||[]).forEach(function(m){
      if(m.status === 'cancelled') return;
      if(!m.venueId || !m.scheduledTime) return;
      var mm = String(m.scheduledTime).match(/T\+(\d+)/);
      var s = mm ? parseInt(mm[1],10) : NaN;
      if(isNaN(s)) return;
      if(venueNext[m.venueId] !== undefined && venueNext[m.venueId] <= s) venueNext[m.venueId] = s + 1;
    });
    pending.forEach(function(m, idx){
      var vId = forceVenue || ('V' + ((idx % vCount) + 1));
      m.venueId = vId;
      m.scheduledTime = 'T+' + (venueNext[vId]++);
    });
    XCEM.Log.add(db, 'ko.schedule', { groupId:groupId, count:pending.length, venueId: forceVenue || 'roundrobin' });
    save();
    return { ok:true, count:pending.length };
  }

  /** 锁屏 */
  function lock(){
    db.lock = db.lock || {};
    db.lock.locked = true;
    db.lock.lockedAt = new Date().toISOString();
    db.lock.lastPage = XCEM.App.getCurrentPage();
    db.lock.lastContext = null;
    XCEM.Log.add(db, 'system.lock', { target: db.lock.lastPage });
    save();
  }
  function unlock(password){
    if(!XCEM.Crypto.verify(password, db.event.passwordHash)) return { ok:false, reason:'wrong_pwd' };
    db.lock.locked = false;
    XCEM.Log.add(db, 'system.unlock', { target: db.lock.lastPage });
    save();
    return { ok:true };
  }

  /** 完全重置 */
  function resetAll(){
    var fresh = XCEM.Model.defaults();
    var keys = Object.keys(fresh);
    keys.forEach(function(k){ delete db[k]; db[k] = fresh[k]; });
    XCEM.Log.add(db, 'system.reset', {});
    save();
  }

  return {
    setDb:setDb, getDb:getDb, save:save,
    setEvent:setEvent, changePassword:changePassword,
    setSettings:setSettings,
    upsertGroup:upsertGroup, deleteGroup:deleteGroup,
    addTeam:addTeam, updateTeam:updateTeam, deleteTeam:deleteTeam,
    batchImportTeams:batchImportTeams, autoNumberDraws:autoNumberDraws,
    doDraw:doDraw, clearDraw:clearDraw, importDrawResult:importDrawResult, exportTeamsTemplate:exportTeamsTemplate, exportDrawTemplateXlsx:exportDrawTemplateXlsx, parseDrawXlsx:parseDrawXlsx, exportCheckInTables:exportCheckInTables, exportScheduleCsv:exportScheduleCsv, buildXlsx:buildXlsx, validateGroup:validateGroup, getKnockoutVersions:getKnockoutVersions, setActiveVersion:setActiveVersion, archiveCurrentVersion:archiveCurrentVersion,
    genQualifying:genQualifying, regenQualifying:regenQualifying,
    allocateVenues:allocateVenues, applyVenuePlan:applyVenuePlan,
    autoScheduleAll:autoScheduleAll,
    setScore:setScore, setAbstain:setAbstain,
    setGoldenGoal:setGoldenGoal, setDeathPenalty:setDeathPenalty,
    confirmMatch:confirmMatch, updateMatch:updateMatch,
    disqualifyTeam:disqualifyTeam, cancelMatch:cancelMatch,
    saveSnapshot:saveSnapshot,
    generateKnockout:generateKnockout, generateNextRound:generateNextRound, scheduleKoVenues:scheduleKoVenues,
    lock:lock, unlock:unlock, resetAll:resetAll
  };
})();

        reasonHtml += '<div class="field"><label>操作密码（与锁屏密码一致）</label><input type="password" id="modal-password" autocomplete="off" placeholder="请输入操作密码"></div>';
      }
      m.innerHTML = '<div class="modal">'
        + '<h3>' + esc(title) + '</h3>'
        + '<div class="body">' + (typeof body === 'string' ? body : '') + reasonHtml + '</div>'
        + '<div class="footer">'
        +   '<button class="btn" id="modal-cancel">取消</button>'

        + '</div></div>';
      root.appendChild(m);
      var closed = false;
      function close(result){
        if(closed) return; closed = true;

        resolve(result);
      }
      m.querySelector('#modal-cancel').onclick = function(){ close(false); };

          if(e.key === 'Enter'){ m.querySelector('#modal-ok').click(); }

      });

    document.getElementById('btn-save-set').onclick = function(){
      var obj = {
        scoreWin: parseInt(document.getElementById('set-win').value||3),
        scoreDraw: parseInt(document.getElementById('set-draw').value||1),
        scoreLoss: parseInt(document.getElementById('set-loss').value||0),
        abandonScore: parseInt(document.getElementById('set-abandon').value||9),
        venuesCount: parseInt(document.getElementById('set-venues').value||2),

      var o = document.getElementById('pwd-old').value;

      document.getElementById('pwd-new').value='';
      document.getElementById('pwd-new2').value='';

    document.getElementById('btn-export').onclick = function(){
      var data = XCEM.Engine.getDb();
      var blob = new Blob([JSON.stringify(data, null, 2)], { type:'application/json' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'xcem_backup_' + new Date().toISOString().slice(0,10) + '.json';
      a.click();
      URL.revokeObjectURL(url);
      toast('已导出备份', 'success');
    };
    document.getElementById('btn-import').onclick = function(){
      document.getElementById('file-import').click();
    };
    document.getElementById('file-import').onchange = function(e){
      var file = e.target.files[0]; if(!file) return;
      var reader = new FileReader();
      reader.onload = async function(){
        try{
          var newData = XCEM.Storage.importJSON(reader.result);
          var ok = await confirm('确认恢复？', '<p>这将 <b>覆盖</b> 当前所有赛事数据。</p><p>文件版本: schema=' + esc(String(newData.schema)) + '</p>', { danger:true, okLabel:'覆盖并恢复' });
          if(!(ok && ok.ok)) return;
          // 替换 db
          var db = XCEM.Engine.getDb();
          Object.keys(db).forEach(function(k){ delete db[k]; });
          Object.keys(newData).forEach(function(k){ db[k] = newData[k]; });
          XCEM.Engine.save();
          XCEM.App.reload();
          toast('已从备份恢复', 'success');
        }catch(err){
          toast('恢复失败: ' + err.message, 'error');
        }
      };
      reader.readAsText(file);
    };
  }

        var mcount = db.matches.filter(function(m){return m.groupId===gid;}).length;

        if(!(ok && ok.ok)) return;

        toast('已删除', 'success');
        XCEM.App.reload();

  function editGroupForm(g){

    var root = document.getElementById('modal-root');
    var m = document.createElement('div');
    m.className = 'modal-backdrop';
    m.innerHTML = '<div class="modal">'
      + '<h3>' + (isNew?'新增组别':'编辑组别') + '</h3>'
      + '<div class="body">'
      +   '<div class="field-row">'

      +     '<div class="field"><label>启用</label><select id="g-enabled"><option value="1"' + (g.enabled?' selected':'') + '>是</option><option value="0"' + (g.enabled?'':' selected') + '>否</option></select></div>'

      +   '<div class="field-row">'
      +     '<div class="field"><label>资格赛 - 每队场次</label><select id="g-qm"><option value="1"' + (g.qualifyingMatchesPerTeam===1?' selected':'') + '>1场/人</option><option value="2"' + (g.qualifyingMatchesPerTeam===1?'':' selected') + '>2场/人</option></select></div>'
      +     '<div class="field"><label>淘汰规模 <span class="hint">(建议 ≤ 队伍数最大值)</span></label>'
      +       '<select id="g-ksize">'
      +         '<option value="0">不创建</option>'
      +         '<option value="4"' + (g.knockoutSize===4?' selected':'') + '>4强</option>'
      +         '<option value="8"' + (g.knockoutSize===8?' selected':'') + '>8强</option>'
      +         '<option value="16"' + (g.knockoutSize===16?' selected':'') + '>16强</option>'
      +         '<option value="32"' + (g.knockoutSize===32?' selected':'') + '>32强</option>'
      +         '<option value="64"' + (g.knockoutSize===64?' selected':'') + '>64强</option>'
      +       '</select></div>'
      +     '<div class="field"><label>特邀名额</label><input type="number" id="g-inv" value="' + (g.invitedQuota||0) + '" min="0"></div>'
      +     '<div class="field"><label>决赛赛制</label><select id="g-final"><option value="BO1"' + (g.finalFormat==='BO1'?' selected':'') + '>BO1</option><option value="BO3"' + (g.finalFormat==='BO3'?' selected':'') + '>BO3</option><option value="BO5"' + (g.finalFormat==='BO5'?' selected':'') + '>BO5</option></select></div>'
      +   '</div>'
      +   '<div class="alert info mt-2">说明：淘汰规模 + 特邀名额 = 最终晋级总数。系统会按排名晋级 + 特邀释放算法自动扩展。</div>'
      + '</div>'
      + '<div class="footer">'
      +   '<button class="btn" id="gf-cancel">取消</button>'
      +   '<button class="btn btn-primary" id="gf-save">保存</button>'
      + '</div></div>';
    root.appendChild(m);
    var closed = false;
    function close(){ if(m.parentNode) m.parentNode.removeChild(m); closed = true; }
    m.querySelector('#gf-cancel').onclick = close;
    m.querySelector('#gf-save').onclick = function(){
      var n = document.getElementById('g-name').value.trim();
      if(!n){ alert('请填写组别名称'); return; }
      var km = document.getElementById('g-ksize').value|0;
      var iv = document.getElementById('g-inv').value|0;
      if(iv > km){ alert('特邀名额 (' + iv + ') 不能大于淘汰规模 (' + km + ')'); return; }
      XCEM.Engine.upsertGroup({
        id: g.id || null,
        name: n,

        knockoutSize: km,
        invitedQuota: iv,
        venueAssign: g.venueAssign || [],
        finalFormat: document.getElementById('g-final').value
      });
      close();
      toast('已保存', 'success');
      XCEM.App.reload();
    };
  }

  // 注册页面渲染函数
  function pageTeams(){
    var db = XCEM.Engine.getDb();
    var groups = db.groups;
    if(groups.length === 0){
      setMain('<h1>队伍管理</h1><div class="alert warn">尚未创建组别，请先到“组别管理”创建至少一个组别。</div>');
      return;
    }
    var sel = window.__xcemTeamSel || groups[0].id;
    if(!groups.some(function(g){return g.id===sel;})){ sel = groups[0].id; window.__xcemTeamSel = sel; }
    window.__xcemTeamSel = sel;
    var groupOpts = groups.map(function(g){ return '<option value="' + g.id + '"' + (g.id===sel?' selected':'') + '>' + esc(g.name) + '</option>'; }).join('');
    var teamArr = db.teams.filter(function(t){return t.groupId===sel;}).sort(function(a,b){ return (a.drawNumber||0) - (b.drawNumber||0); });
    var rows = teamArr.map(function(t){
      return '<tr>'
        + '<td class="center">' + (t.drawNumber||'-') + '</td>'
        + '<td>' + esc(t.name) + (t.isInvited?' <span class="pill gold">★特邀</span>':'') + '</td>'
        + '<td>' + esc(t.organization||'') + '</td>'
        + '<td class="center">'
        +   (t.status==='disqualified_after_play' ? '<span class="pill danger">取消资格</span>' :
            (t.status==='abandoned_pre' ? '<span class="pill warn">赛前弃权</span>' : '<span class="pill green">正常</span>'))
        + '</td>'
        + '<td class="text-right">'
        +   '<button class="btn btn-xs" data-edit="' + t.id + '">编辑</button> '
        +   '<button class="btn btn-xs" data-inv="' + t.id + '">' + (t.isInvited?'取消特邀':'设为特邀') + '</button> '
        +   '<button class="btn btn-xs btn-danger" data-del="' + t.id + '">删除</button>'
        + '</td>'
        + '</tr>';
    }).join('');
    var html = ''
      + '<h1>队伍管理</h1><p class="sub">录入 / 编辑参赛队伍，标记特邀身份</p>'
      + '<div class="panel">'
      +   '<div class="field-row">'
      +     '<div class="field"><label>选择组别</label><select id="t-group">' + groupOpts + '</select></div>'
      +     '<div class="field"><label>队伍名称</label><input id="t-name" placeholder="队伍名"></div>'
      +     '<div class="field"><label>所属单位（可选）</label><input id="t-org" placeholder="学校 / 俱乐部"></div>'
      +     '<div class="field"><label>设为特邀</label><div class="field-inline"><input id="t-inv" type="checkbox"></div></div>'
      +   '</div>'
      +   '<div class="btn-row mt-2"><button class="btn btn-primary" id="btn-add-team">➕ 添加队伍</button></div>'
      +   '<hr>'
      +   '<h3>批量导入</h3>'
      +   '<p class="text-muted">每行一支队伍，使用逗号或 Tab 分隔：<code class="code-inline">队伍名,所属单位,是否特邀</code>。是否特邀列填 y/特邀/是 即可。</p>'
      +   '<div class="field"><textarea id="t-batch" rows="5" placeholder="例如：&#10;南宁一中飞鹰队,南宁一中,y&#10;桂林中学飞龙队,桂林中学,"></textarea></div>'
      +   '<div class="btn-row"><button class="btn" id="btn-batch-add">📥 批量导入</button><button class="btn btn-warn" id="btn-auto-num">🔢 自动分配抽签号</button><button class="btn" id="btn-seed-sample">🌱 生成示例数据</button><button class="btn" id="btn-validate-batch">✅ 校验本组</button></div>'
      +   '<div id="t-batch-validation"></div>'
      + '</div>'
      + '<div class="panel"><h2>本组队伍 <span class="meta">共 ' + teamArr.length + ' 支</span></h2>'
      +   '<div class="table-wrap"><table class="tbl"><thead><tr><th class="center">抽签号</th><th>名称</th><th>所属单位</th><th class="center">状态</th><th class="text-right">操作</th></tr></thead><tbody>'
      +   (rows || '<tr><td colspan="5" class="empty-state">尚无队伍</td></tr>')
      +   '</tbody></table></div></div>';
    setMain(html);
    document.getElementById('t-group').onchange = function(){ window.__xcemTeamSel = this.value; pageTeams(); };
    function reloadTeamHandlers(){
      Array.prototype.forEach.call(document.querySelectorAll('[data-edit]'), function(b){
        b.onclick = function(){
          var t = db.teams.find(function(x){return x.id===b.dataset.edit;});
          editTeamForm(t, function(){ pageTeams(); });
        };
      });
      Array.prototype.forEach.call(document.querySelectorAll('[data-inv]'), function(b){
        b.onclick = function(){
          var t = db.teams.find(function(x){return x.id===b.dataset.inv;});
          XCEM.Engine.updateTeam(t.id, { isInvited: !t.isInvited });
          toast('已更新', 'success');
          pageTeams();
        };
      });
      Array.prototype.forEach.call(document.querySelectorAll('[data-del]'), function(b){
        b.onclick = async function(){
          var t = db.teams.find(function(x){return x.id===b.dataset.del;});
          var ok = await confirm('删除队伍？', '<p>删除 <b>' + esc(t.name) + '</b>？</p>如果该队已经参加过比赛，将无法删除。', { danger:true, okLabel:'确认删除' });
          if(!(ok && ok.ok)) return;
          var r = XCEM.Engine.deleteTeam(t.id);
          if(!r.ok) toast(r.reason==='has_match'?'该队已有参赛记录，无法删除':'删除失败', 'warn');
          else toast('已删除', 'success');
          pageTeams();
        };
      });

      if(!name){ toast('请填写队伍名称', 'warn'); return; }
      var r = XCEM.Engine.addTeam(window.__xcemTeamSel, {
        name: name,
        organization: document.getElementById('t-org').value.trim(),
        isInvited: document.getElementById('t-inv').checked
      });
      if(!r.ok){ toast('队伍名称不能为空', 'warn'); return; }
      document.getElementById('t-name').value='';
      document.getElementById('t-org').value='';
      toast('已添加', 'success');
      pageTeams();
    };
    document.getElementById('btn-validate-batch').onclick = function(){
      var r = XCEM.Engine.validateGroup(window.__xcemTeamSel);
      var div = document.getElementById('t-batch-validation');
      if(r.ok){
        div.innerHTML = '<div class="alert success mt-2">✅ 校验通过！特邀 ' + r.actualInvited + '/' + r.M + '，总队伍 ' + r.totalTeams + '。可以进入抽签。</div>';
        toast('校验通过', 'success');
      } else {
        var list = r.errors.map(function(e){return '⚠ ' + esc(e.msg);}).join('<br>');

  function pageDraw(){
    var db = XCEM.Engine.getDb();
    var groups = db.groups;
    if(groups.length === 0){
      setMain('<h1>抽签</h1><div class="alert warn">请先创建组别并录入队伍。</div>');
      return;
    }
    var sel = window.__xcemDrawSel || groups[0].id;
    if(!groups.some(function(g){return g.id===sel;})){ sel = groups[0].id; window.__xcemDrawSel = sel; }
    window.__xcemDrawSel = sel;
    var teamArr = db.teams.filter(function(t){return t.groupId===sel;}).sort(function(a,b){ return (a.drawNumber||0) - (b.drawNumber||0); });
    var draw = db.draws[sel];
    // 【关联校验】当前组校验结果：未通过 → 导入按钮置灰，禁止抽签
    var v = XCEM.Engine.validateGroup(sel);
    var groupOpts = groups.map(function(g){ return '<option value="' + g.id + '"' + (g.id===sel?' selected':'') + '>' + esc(g.name) + ' · ' + db.teams.filter(function(t){return t.groupId===g.id;}).length + '队</option>'; }).join('');
    var vErrHtml = '';
    if(!v.ok){
      vErrHtml = '<div class="alert error mt-2"><b>❌ 本组校验未通过，导入抽签功能已禁用：</b><br>'
        + v.errors.map(function(e){ return '⚠ ' + esc(typeof e==='string'?e:(e.msg||'')); }).join('<br>')
        + '<br><a href="#teams">→ 前往队伍管理页处理</a></div>';
    }
    var html = ''
      + '<h1>抽签</h1><p class="sub">现场抽签结果由操作员导入，导入后自动生成资格赛赛程（组别校验通过后才可导入）</p>'
      + '<div class="panel">'
      +   '<div class="field-row">'
      +     '<div class="field"><label>选择组别</label><select id="d-group">' + groupOpts + '</select></div>'
      +   '</div>'
      +   '<div class="btn-row mt-2">'
      +     '<button class="btn" id="btn-check-all">🔍 全部组别校验</button>'
      +     '<button class="btn btn-success" id="btn-export-tpl">📤 导出抽签报名模板</button>'
      +     '<button class="btn btn-info" id="btn-import-tpl" ' + ((teamArr.length>0 && v.ok)?'':'disabled') + '>📥 导入抽签报名模板</button>'
      +     '<button class="btn" id="btn-import-draw" ' + ((teamArr.length>0 && v.ok)?'':'disabled') + '>📥 导入抽签结果（现场粘贴）</button>'
      +   '</div>'
      +   '<input type="file" id="draw-tpl-file" accept=".xlsx" style="display:none">'
      +   vErrHtml
      +   '<div id="draw-check-all"></div>'
      +   (draw ? '<div class="alert info mt-2">最近抽签时间：' + esc(draw.createdAt) + ' · 来源：' + esc(String(draw.source||'系统随机')) + ' · 累计抽签次数：' + esc(String(draw.redrawCount)) + '</div>'
        : '<div class="alert warn mt-2">该组尚未导入抽签结果。校验通过后可点击上方按钮，粘贴现场抽签表格。</div>')
      + '</div>'
      + '<div class="panel"><h2>当前抽签顺序</h2>'
      +   (draw && draw.order ? renderDrawOrder(sel, draw.order) : '<div class="empty-state">尚未导入抽签结果。</div>')
      + '</div>';
    setMain(html);
    document.getElementById('d-group').onchange = function(){ window.__xcemDrawSel = this.value; pageDraw(); };
    document.getElementById('btn-import-draw').onclick = function(){
      if(!XCEM.Engine.validateGroup(sel).ok){ toast('本组校验未通过，无法导入抽签', 'error'); return; }
      openImportDrawDialog(sel);
    };
    // 6.10.2 导出抽签报名模板（xlsx）
    document.getElementById('btn-export-tpl').onclick = function(){
      var u8 = XCEM.Engine.exportDrawTemplateXlsx(sel);
      if(!u8){ toast('该组暂无队伍，无法导出模板', 'warn'); return; }
      var grpName = (db.groups.find(function(g){return g.id===sel;})||{}).name || sel;
      downloadText('抽签报名模板-' + grpName + '.xlsx', u8, 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
      toast('已下载抽签报名模板', 'success');
    };
    // 6.10.2 导入抽签报名模板（xlsx）：选择文件解析后预填导入弹窗
    document.getElementById('btn-import-tpl').onclick = function(){
      if(!XCEM.Engine.validateGroup(sel).ok){ toast('本组校验未通过，无法导入抽签', 'error'); return; }
      var fi = document.getElementById('draw-tpl-file');
      fi.value = '';
      fi.click();
    };
    document.getElementById('draw-tpl-file').onchange = function(){
      var f = this.files && this.files[0];
      if(!f) return;
      toast('正在解析 ' + f.name + ' …', 'info');
      f.arrayBuffer().then(function(buf){
        XCEM.Engine.parseDrawXlsx(new Uint8Array(buf), function(err, r){
          if(err || !r || !r.ok){ toast('解析失败：' + ((r&&r.reason)||'未知错误'), 'error'); return; }
          toast('解析成功，请确认后导入', 'success');
          openImportDrawDialog(sel, r.text);
        });
      }).catch(function(){ toast('读取文件失败', 'error'); });
    };
    // 全部组别校验：逐组展示校验结果
    document.getElementById('btn-check-all').onclick = function(){
      var results = groups.map(function(g){
        return { g:g, v:XCEM.Engine.validateGroup(g.id), teams:db.teams.filter(function(t){return t.groupId===g.id;}).length };
      });
      var passCount = results.filter(function(r){return r.v.ok;}).length;
      var rows = results.map(function(r){
        return '<tr>'
          + '<td>' + esc(r.g.name) + '</td>'
          + '<td class="center">' + r.teams + '</td>'
          + '<td class="center">' + (r.g.enabled ? '<span class="pill green">启用</span>' : '<span class="pill gray">禁用</span>') + '</td>'
          + '<td class="center">' + (r.v.ok ? '<span class="text-success">✅ 通过</span>' : '<span class="text-danger">❌ 未通过</span>') + '</td>'
          + '<td style="font-size:12px">' + (r.v.ok ? '<span class="text-muted">—</span>' : r.v.errors.map(function(e){ return '⚠ ' + esc(typeof e==='string'?e:(e.msg||'')); }).join('<br>')) + '</td>'
          + '</tr>';
      }).join('');
      document.getElementById('draw-check-all').innerHTML = '<div class="mt-3"><h3>全部组别校验结果 <span class="meta">' + passCount + '/' + groups.length + ' 组通过</span></h3>'
        + '<div class="table-wrap"><table class="tbl"><thead><tr><th>组别</th><th class="center">队数</th><th class="center">状态</th><th class="center">校验</th><th>未通过详情</th></tr></thead><tbody>' + rows + '</tbody></table></div></div>';
    };
  }

  // 5.1 抽签现场导入弹窗；prefillText：从 xlsx 解析出的预填文本（可空）
  function openImportDrawDialog(groupId, prefillText){
    var db = XCEM.Engine.getDb();
    var grp = (db.groups||[]).find(function(g){return g.id===groupId;});
    if(!grp) return;
    // 【关联校验】硬阻塞：校验未通过不允许打开导入弹窗
    var vPre = XCEM.Engine.validateGroup(groupId);
    if(!vPre.ok){
      toast('本组校验未通过，无法导入抽签', 'error');
      alert('本组校验未通过，无法导入抽签：\n' + vPre.errors.map(function(e){return '· ' + (typeof e==='string'?e:e.msg);}).join('\n') + '\n\n请先到“队伍管理”页面处理。');
      return;
    }
    var teams = db.teams.filter(function(t){return t.groupId===groupId;});
    var lines = ['抽签号|队名|单位|组别|特邀'];
    teams.slice().sort(function(a,b){return (a.name||'').localeCompare(b.name||'');}).forEach(function(t){
      lines.push(['', t.name||'', t.organization||'', grp.name||'', t.isInvited?'★':''].join('|'));
    });
    var preview = (prefillText != null && prefillText !== '') ? prefillText : lines.join('\n');
    var root = document.getElementById('modal-root');
    var m = document.createElement('div');
    m.className = 'modal-backdrop';
    m.innerHTML = '<div class="modal" style="max-width:780px">'
      + '<h3>📥 导入现场抽签结果（' + esc(grp.name) + '）</h3>'
      + '<div class="body">'
      +   '<div class="alert info">操作员先下载 "<b>📤 抽签报名模板(xlsx)</b>" → 在 Excel 中填写"抽签号"列并保存 → 到抽签页点"导入抽签报名模板"选择该文件，或粘贴回下方文本框</div>'
      +   '<div class="btn-row" style="margin-bottom:12px">'
      +     '<button class="btn" id="id-export">📤 导出抽签报名模板（xlsx）</button>'
      +     '<button class="btn" id="id-copy">📋 复制下方模板（含空白抽签号列）</button>'
      +     '<span class="meta">共 ' + teams.length + ' 支队，请确保抽签号 1..' + teams.length + ' 不重不漏</span>'
      +   '</div>'
      +   '<div class="field"><label>粘贴已填好的抽签结果（用竖线 | 分隔各列：抽签号|队名|单位|组别|特邀）</label>'
      +     '<textarea id="id-paste" style="width:100%;min-height:240px;font-family:monospace">' + esc(preview) + '</textarea></div>'
      +   '<div class="field-row">'
      +     '<div class="field"><label>抽签人姓名</label><input id="id-by" placeholder="例如 张三"></div>'
      +     '<div class="field"><label>备注（可选）</label><input id="id-note" placeholder="例如 由裁判长主持抽签"></div>'
      +   '</div>'
      +   '<div id="id-result"></div>'
      + '</div>'
      + '<div class="footer">'
      +   '<button class="btn" id="id-cancel">取消</button>'
      +   '<button class="btn btn-primary" id="id-submit">✅ 校验并导入</button>'
      + '</div></div>';
    root.appendChild(m);
    function close(){ if(m.parentNode) m.parentNode.removeChild(m); }
    m.querySelector('#id-cancel').onclick = close;
    m.querySelector('#id-export').onclick = function(){
      var u8 = XCEM.Engine.exportDrawTemplateXlsx(groupId);
      if(!u8){ toast('导出失败', 'error'); return; }
      downloadText('抽签报名模板-' + (grp.name||groupId) + '.xlsx', u8, 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
      toast('已导出抽签报名模板', 'success');
    };
    m.querySelector('#id-copy').onclick = function(){
      var text = preview;
      var ta = document.createElement('textarea');
      ta.value = text; document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); toast('已复制到剪贴板，请粘贴到 Excel 填写抽签号', 'success'); } catch(e) { toast('浏览器拒绝访问剪贴板，请手动复制', 'warn'); }
      document.body.removeChild(ta);
    };
    m.querySelector('#id-submit').onclick = function(){
      var txt = m.querySelector('#id-paste').value;
      var by = m.querySelector('#id-by').value.trim();
      var note = m.querySelector('#id-note').value.trim();
      if(!by){ alert('请填写抽签人姓名'); return; }
      var r = XCEM.Engine.importDrawResult(groupId, txt, by, note);
      var resultDiv = m.querySelector('#id-result');
      if(r.ok){
        // 只生成资格赛，排程交给“场地编排 / 场地排程”页面
        resultDiv.innerHTML = '<div class="alert success mt-2">✅ 校验通过，已写入 ' + r.order.length + ' 支队伍到抽签表，自动生成 ' + (r.qualifyingCount||'?') + ' 场资格赛。请到“场地编排 / 场地排程”页面进行排程。</div>';
        toast('导入成功，资格赛已生成', 'success');
        setTimeout(function(){ close(); pageDraw(); }, 1500);
      } else {
        var msg = '<div class="alert error mt-2">❌ 校验失败：' + esc(r.reason) + '<br>';
        if(r.errors && r.errors.length){ msg += '<pre style="max-height:240px;overflow:auto">' + esc(r.errors.map(function(e){return typeof e==='string'?e:e.msg;}).join('\n')) + '</pre>'; }
        if(r.missing){ msg += '缺少抽签号：' + esc(r.missing.join(',')) + '<br>期望 ' + r.expected + ' 个，得到 ' + r.got + ' 个'; }
        if(r.detail){ msg += '原因：' + esc(r.detail) + '<br>'; }
        if(r.reason === 'validation_failed'){ msg += '<a href="#teams">→ 前往队伍管理页处理</a><br>'; }
        msg += '</div>';
        resultDiv.innerHTML = msg;
      }
    };
  }

  function renderDrawOrder(groupId, orderIds){
    var db = XCEM.Engine.getDb();

      var t = db.teams.find(function(x){return x.id===id;});

        + (t.isInvited?'<div style="font-size:10px;color:var(--gold)">★特邀</div>':'')
        + '</div>';
    }).join('');
