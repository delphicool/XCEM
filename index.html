  function pageQualify(){
    var db = XCEM.Engine.getDb();
    var groups = db.groups;
    if(groups.length === 0){ setMain('<h1>资格赛</h1><div class="alert warn">尚未创建组别。</div>'); return; }
    var sel = window.__xcemQSel || groups[0].id;
    if(sel !== 'all' && !groups.some(function(g){return g.id===sel;})){ sel = groups[0].id; window.__xcemQSel = sel; }
    window.__xcemQSel = sel;
    var opts = '<option value="all"' + (sel==='all'?' selected':'') + '>全部组别</option>'
      + groups.map(function(g){ return '<option value="' + g.id + '"' + (g.id===sel?' selected':'') + '>' + esc(g.name) + '</option>'; }).join('');
    var matches = db.matches.filter(function(m){return m.stage==='qualifying' && (sel==='all' || m.groupId===sel);});
    if(matches.length === 0){
      setMain('<h1>资格赛</h1><div class="panel">'
        + '<div class="field"><label>选择组别</label><select id="q-group">' + opts + '</select></div>'
        + '<div class="empty-state">本组还没有资格赛。请先到“抽签”页面导入现场抽签结果，导入后将自动生成资格赛赛程。</div>'
        + '</div>');
      document.getElementById('q-group').onchange = function(){ window.__xcemQSel = this.value; pageQualify(); };
      return;
    }
    matches.sort(function(a,b){
      if((a.matchIndex||0)!==(b.matchIndex||0)) return (a.matchIndex||0)-(b.matchIndex||0);
      return 0;
    });
    var slots = venueSlotOrder();
    var rows = matches.map(function(m){
      var isLocked = (m.status==='locked' || m.status==='confirmed' || m.status==='modified');
      return '<tr class="' + (m.status==='cancelled'?'cancelled':(isLocked?'locked':'')) + '">'
        + '<td class="center">' + (m.matchIndex||'') + '</td>'
        + '<td>' + groupName(m.groupId) + '</td>'
        + '<td>' + venueName(m.venueId) + '</td>'
        + '<td class="center">' + (slots.order[m.id] ? '第' + slots.order[m.id] + '场' : '<span class="text-muted">未排</span>') + '</td>'
        + '<td class="center"><span class="pill red">红</span></td>'
        + '<td>' + teamName(m.redTeamId) + (isNaN(parseInt(m.redSeed))?'':' <span class="text-muted">(种子'+m.redSeed+')</span>') + '</td>'
        + '<td class="center"><b>' + (m.score?m.score.red:0) + ' : ' + (m.score?m.score.blue:0) + '</b></td>'
        + '<td>' + teamName(m.blueTeamId) + (isNaN(parseInt(m.blueSeed))?'':' <span class="text-muted">(种子'+m.blueSeed+')</span>') + '</td>'
        + '<td>' + resultLabel(m) + '</td>'
        + '<td>' + statusPill(m.status) + '</td>'
        + '<td class="text-right">'
        +   (m.status==='pending'||m.status==='confirming' ? '<button class="btn btn-xs btn-primary" data-entry="' + m.id + '">录入</button> ' : '')
        +   (isLocked ? '<button class="btn btn-xs btn-warn" data-edit-locked="' + m.id + '">改</button>' : '')
        +   '<button class="btn btn-xs btn-danger" data-cancel="' + m.id + '">×</button>'
        + '</td>'
        + '</tr>';
    }).join('');
    var scheduled = matches.filter(function(m){return !!m.scheduledTime;}).length;
    var locked = matches.filter(function(m){return m.status==='locked'||m.status==='confirmed';}).length;
    var cancelled = matches.filter(function(m){return m.status==='cancelled';}).length;
    var html = ''
      + '<h1>资格赛</h1><p class="sub">环形两场 BO1 — 每队 2 场，按抽签顺序相邻对阵</p>'
      + '<div class="panel">'
      +   '<div class="field-row">'
      +     '<div class="field"><label>选择组别</label><select id="q-group">' + opts + '</select></div>'
      +   '</div>'
      +   '<div class="dash-grid mt-2">'
      +     '<div class="stat-card"><div class="label">总场数</div><div class="value">' + matches.length + '</div></div>'
      +     '<div class="stat-card"><div class="label">已排程</div><div class="value">' + scheduled + '</div></div>'
      +     '<div class="stat-card"><div class="label">已锁定</div><div class="value">' + locked + '</div></div>'

  /** 自动推进提示：普通推进 / 决赛系列下一场 / 系列结束三种文案 */

  function pageEntry(){
    var db = XCEM.Engine.getDb();
    // 排除已归档比赛（重新生成淘汰对阵后的旧版本不参与录入）
    var matches = db.matches.filter(function(m){ return !m.archived; }).slice().sort(function(a,b){
      var so = (a.status==='confirming'||a.status==='pending'?0:1) - (b.status==='confirming'||b.status==='pending'?0:1);
      if(so) return so;
      if((a.groupId||'').localeCompare(b.groupId||'')) return (a.groupId||'').localeCompare(b.groupId||'');
      return (a.matchIndex||0) - (b.matchIndex||0);
    });
    // 组别筛选（组别下拉选择框；搜索框按其余字段过滤）
    var groupIds = db.groups.map(function(g){return g.id;});
    var entryGroup = window.__xcemEntryGroup;
    if(entryGroup !== 'all' && groupIds.indexOf(entryGroup) < 0){
      entryGroup = 'all';
      window.__xcemEntryGroup = entryGroup;
    }
    if(!entryGroup) entryGroup = 'all';
    var groupMatches = entryGroup === 'all' ? matches : matches.filter(function(m){ return m.groupId === entryGroup; });
    // 阶段筛选（阶段下拉选择框：全部/资格赛/16强赛/8强赛/4强赛/季军赛/冠亚军决赛）
    var koNByGroup = {};

    var entryStage = window.__xcemEntryStage;
    if(entryStage !== 'all' && stageNames.indexOf(entryStage) < 0){
      entryStage = 'all';
      window.__xcemEntryStage = entryStage;
    }
    if(!entryStage) entryStage = 'all';
    var stageMatches = entryStage === 'all' ? groupMatches : groupMatches.filter(function(m){ return matchStageLabel(m, koNByGroup[m.groupId]) === entryStage; });
    var cur = null;
    var entryId = window.__xcemEntryId;
    var staleEntry = false;
    if(entryId){
      cur = stageMatches.find(function(m){return m.id===entryId;});
      // 若 entryId 指向 KO 占位场或不存在 → 当作 stale，清掉并由下方通用逻辑兜底
      if(cur && (!cur.redTeamId || !cur.blueTeamId)){
        cur = null;
        window.__xcemEntryId = null;
        staleEntry = true;
      }
      if(!cur) staleEntry = true;
    }
    if(staleEntry || !cur){
      window.__xcemEntryId = null;
      cur = stageMatches.find(function(m){return m.status==='confirming'||m.status==='pending'||m.status==='modified'||m.status==='playing';})
        || stageMatches.find(function(m){return m.redTeamId && m.blueTeamId;})
        || stageMatches[0];
    }
    var teamLabel = function(tid){ var _t = tid ? db.teams.find(function(t){return t.id===tid;}) : null; return _t ? _t.name : '待定'; };
    var teamOrg = function(tid){ var _t = tid ? db.teams.find(function(t){return t.id===tid;}) : null; return _t ? (_t.organization||'') : ''; };
    var stageLabel = function(m){ return matchStageLabel(m, koNByGroup[m.groupId]); };
    // 搜索字段：场地名称、场次、队名、校名、阶段（组别由下拉框过滤）
    // 场次编号：资格赛按场地全局编号；淘汰赛按「组别·阶段·场地」局部从 1 编号（与淘汰赛页一致）
    var slotOrder = venueSlotOrder().order;
    var koOrder = koStageSlotOrder(null);
    Object.keys(koOrder).forEach(function(id){ slotOrder[id] = koOrder[id]; });
    var groupOpts = '<option value="all"' + (entryGroup==='all'?' selected':'') + '>全部组别</option>'
      + db.groups.map(function(g){ return '<option value="' + g.id + '"' + (g.id===entryGroup?' selected':'') + '>' + groupName(g.id) + '</option>'; }).join('');
    var matchOptions = stageMatches.map(function(m){
      var g = groupName(m.groupId);
      var stage = stageLabel(m);
      // 场地：未排时显示“未排场地”也可搜索；场次：已排 → 阶段·场地局部编号，未排 → 阶段内对阵序号兜底(标“待排”)，保证 16强赛等淘汰赛同样可按场次模糊定位
      var venueLabel = m.venueId ? (m.venueId.replace(/^V/,'') + '号场地') : '未排场地';
      var slotLabel = slotOrder[m.id] ? ('第' + slotOrder[m.id] + '场') : (m.matchIndex ? ('第' + m.matchIndex + '场(待排)') : '未排场次');
      return {
        id: m.id, status: m.status,
        // 用于搜索的关键词：场地名称、场次、队名、校名、阶段
        keywords: (venueLabel + ' ' + slotLabel + ' ' + teamLabel(m.redTeamId) + ' ' + teamLabel(m.blueTeamId) + ' ' + teamOrg(m.redTeamId) + ' ' + teamOrg(m.blueTeamId) + ' ' + stage).toLowerCase(),
        // 显示文本：组别 · 阶段 · 场地 · 场次 · 红队 vs 蓝队
        text: g + ' · ' + stage + ' · ' + venueLabel + ' · ' + slotLabel + ' · ' + teamLabel(m.redTeamId) + ' vs ' + teamLabel(m.blueTeamId),
        stage: stage
      };
    });
    if(!cur){
      var stageOptsEmpty = '<option value="all" selected>全部</option>' + stageNames.map(function(s){ return '<option value="' + s + '">' + s + '</option>'; }).join('');
      setMain('<h1>比赛录入</h1><div class="panel"><div class="field-row">'
        + '<div class="field"><label>选择组别</label><select id="e-group">' + groupOpts + '</select></div>'
        + '<div class="field"><label>选择阶段</label><select id="e-stage">' + stageOptsEmpty + '</select></div>'
        + '</div><div class="empty-state">该组别/阶段暂无比赛，请选择其它组别或阶段。</div></div>');
      document.getElementById('e-group').onchange = function(){ window.__xcemEntryGroup = this.value; window.__xcemEntryId = null; pageEntry(); };
      document.getElementById('e-stage').onchange = function(){ window.__xcemEntryStage = this.value; window.__xcemEntryId = null; pageEntry(); };
      return;
    }
    var redTeam = db.teams.find(function(t){return t.id===cur.redTeamId;});
    var blueTeam = db.teams.find(function(t){return t.id===cur.blueTeamId;});
    var g = db.groups.find(function(x){return x.id===cur.groupId;});
    var stage = stageLabel(cur);
    var isLocked = (cur.status==='locked' || cur.status==='confirmed');
    var curVenue = cur.venueId ? (cur.venueId.replace(/^V/,'') + '号场地') : '';
    var curSlot = slotOrder[cur.id] ? ('第' + slotOrder[cur.id] + '场') : '';
    var unlockReason = window.__xcemUnlockReason;
    window.__xcemUnlockReason = null;
    var showModifyPanel = unlockReason;

    // 8.1 顶部黄色横条：m.status === 'confirming' 时显示
    var pendingBar = (cur.status === 'confirming') ? '<div class="alert warn" id="pending-bar">⚠️ 当前比赛有未确认的比分 <button class="btn btn-success btn-xs" id="btn-bar-confirm" style="margin-left:8px">✅ 立即确认</button></div>' : '';

    var html = ''
      + '<h1>比赛录入</h1><p class="sub">现场比分录入，支持金球、死亡点球、弃权、确认与修改</p>'
      + pendingBar
      + '<div class="panel">'
      +   '<div class="field-row entry-row">'
      +     '<div class="field">'
      +       '<label>选择组别</label>'
      +       '<select id="e-group">' + groupOpts + '</select>'
      +     '</div>'
      +     '<div class="field">'
      +       '<label>选择阶段</label>'
      +       '<select id="e-stage">'
      +         '<option value="all"' + (entryStage==='all'?' selected':'') + '>全部</option>'
      +         stageNames.map(function(s){ return '<option value="' + s + '"' + (s===entryStage?' selected':'') + '>' + s + '</option>'; }).join('')
      +       '</select>'
      +     '</div>'
      +     '<div class="field">'
      +       '<label>选择比赛 <span class="hint">输入场地名称/场次/队名/校名/阶段关键词可模糊过滤，↑↓ 选择，回车确认</span></label>'
      +       '<div class="e-suggest-wrap">'
      +       '<input type="text" id="e-search" placeholder="输入场地名称/场次/队名/校名/阶段关键词，↑↓选择 回车确认" autocomplete="off" value="">'
      +       '<div id="e-suggest" class="e-suggest"></div>'
      +       '</div>'
      +     '</div>'
      +   '</div>'
      +   '<div class="meta" id="e-match-info" style="margin-top:4px">' + esc(matchOptions.find(function(o){return o.id===cur.id;}) ? matchOptions.find(function(o){return o.id===cur.id;}).text : '') + ' · ' + statusPill(cur.status) + '</div>'
      + '</div>'
      + '<div class="panel"><h2>当前比赛</h2>'
      +   '<div class="match-loc">' + esc(g?g.name:'') + ' · ' + stage + (curVenue ? ' · 第' + curVenue : ' · 未排场地') + (curSlot ? ' · ' + curSlot : ' · 未排场次') + '</div>'
      +   '<div class="score-card">'
      +     '<div class="score-side red">'
      +       '<div class="name">' + esc(redTeam?redTeam.name:'待定') + (redTeam&&redTeam.isInvited?' <span class="pill gold">★</span>':'') + '</div>'
      +       '<div class="score" id="score-red">' + (cur.score?cur.score.red:0) + '</div>'
      +     '</div>'
      +     '<div class="score-vs">VS</div>'
      +     '<div class="score-side blue">'
      +       '<div class="name">' + esc(blueTeam?blueTeam.name:'待定') + (blueTeam&&blueTeam.isInvited?' <span class="pill gold">★</span>':'') + '</div>'
      +       '<div class="score" id="score-blue">' + (cur.score?cur.score.blue:0) + '</div>'

      +   '<div class="btn-row mt-3">'

      +   '</div>'

    // === 8.1 组别下拉选择（切换组别后重新渲染，比赛搜索按组别过滤）===

      groupSelect.onchange = function(){
        window.__xcemEntryGroup = this.value;
        window.__xcemEntryId = null;
        pageEntry();
      };
    }
    // === 阶段下拉选择（全部/资格赛/16强赛/8强赛/4强赛/季军赛/冠亚军决赛）===
    var stageSelect = document.getElementById('e-stage');
    if(stageSelect){
      stageSelect.onchange = function(){
        window.__xcemEntryStage = this.value;
        window.__xcemEntryId = null;
        pageEntry();
      };

    // === 8.1 比赛选择模糊搜索下拉（每输入一个字符更新一次结果）===
    var searchInput = document.getElementById('e-search');
    var suggestPanel = document.getElementById('e-suggest');
    var visibleOptions = [];
    var suggestIndex = -1;
    function filterMatches(query){
      var q = (query||'').toLowerCase().trim();
      var visible = [];
      var seen = {};
      matchOptions.forEach(function(o){
        if(seen[o.id]) return;
        if(!q || o.keywords.indexOf(q) >= 0){
          seen[o.id] = true;
          visible.push(o);
        }
      });
      visibleOptions = visible.slice(0, 30);
      suggestIndex = -1;
      if(visibleOptions.length > 0){
        suggestPanel.innerHTML = visibleOptions.map(function(o, i){
          return '<div class="e-suggest-item" data-idx="' + i + '">' + esc(o.text) + '</div>';
        }).join('');
      } else {
        suggestPanel.innerHTML = '<div class="e-suggest-empty">无匹配比赛</div>';
      }
      suggestPanel.style.display = 'block';
      return visibleOptions;
    }
    function closeSuggest(){ if(suggestPanel) suggestPanel.style.display = 'none'; }
    function highlightSuggest(){
      Array.prototype.forEach.call(suggestPanel.children, function(c, i){
        c.className = 'e-suggest-item' + (i === suggestIndex ? ' active' : '');
      });
      if(suggestIndex >= 0){
        var el = suggestPanel.children[suggestIndex];
        if(el && el.scrollIntoView) el.scrollIntoView({ block:'nearest' });
      }
    }
    searchInput.addEventListener('input', function(){ filterMatches(this.value); });
    searchInput.addEventListener('focus', function(){
      if(!suggestPanel.style.display || suggestPanel.style.display === 'none') filterMatches(this.value);
    });
    // 鼠标点击候选
    suggestPanel.addEventListener('click', function(e){
      var el = e.target;
      while(el && el !== suggestPanel && !(el.className && String(el.className).indexOf('e-suggest-item') >= 0)) el = el.parentNode;
      if(!el || el === suggestPanel) return;
      var idx = parseInt(el.getAttribute('data-idx'), 10);
      var o = visibleOptions[idx];
      if(o){ window.__xcemEntryId = o.id; closeSuggest(); pageEntry(); }
    });
    // 键盘导航：↑↓ 移动高亮，回车选中，Esc 关闭
    searchInput.addEventListener('keydown', function(e){
      if(e.key === 'ArrowDown'){
        if(visibleOptions.length){ e.preventDefault(); suggestIndex = (suggestIndex + 1) % visibleOptions.length; highlightSuggest(); }
      } else if(e.key === 'ArrowUp'){
        if(visibleOptions.length){ e.preventDefault(); suggestIndex = (suggestIndex - 1 + visibleOptions.length) % visibleOptions.length; highlightSuggest(); }
      } else if(e.key === 'Enter'){
        e.preventDefault();
        if(visibleOptions.length === 0){ filterMatches(this.value); }
        var target = (suggestIndex >= 0 && visibleOptions[suggestIndex]) ? visibleOptions[suggestIndex] : visibleOptions[0];
        if(target){ window.__xcemEntryId = target.id; closeSuggest(); pageEntry(); }
      } else if(e.key === 'Escape'){
        closeSuggest();
      }
    });
    // 失焦延迟关闭（让候选点击先生效）
    searchInput.addEventListener('blur', function(){ setTimeout(closeSuggest, 150); });

    // === 8.1 oninput + 200ms 防抖自动保存分数 ===
    var saveTimer = null;
    function autoSaveScore(){
      if(saveTimer) clearTimeout(saveTimer);
      saveTimer = setTimeout(function(){
        var r = parseInt(document.getElementById('in-red').value)||0;
        var b = parseInt(document.getElementById('in-blue').value)||0;
        if(r > 999 || r < 0 || b > 999 || b < 0){
          document.getElementById('auto-save-status').innerHTML = '<span class="text-danger">分数需在 0-999</span>';
          return;
        }
        var res = XCEM.Engine.setScore(cur.id, r, b);
        if(res && res.ok){
          document.getElementById('auto-save-status').innerHTML = '<span class="text-success">✓ 已自动保存</span>';
          refreshCurrent();
        } else {
          document.getElementById('auto-save-status').innerHTML = '<span class="text-warn">' + esc(res ? res.reason : 'err') + '</span>';
        }
      }, 200);
    }
    document.getElementById('in-red').addEventListener('input', function(){
      updateScoreMirror();
      autoSaveScore();
    });
    document.getElementById('in-blue').addEventListener('input', function(){
      updateScoreMirror();
      autoSaveScore();
    });
    function updateScoreMirror(){
      document.getElementById('score-red').textContent = document.getElementById('in-red').value||0;
      document.getElementById('score-blue').textContent = document.getElementById('in-blue').value||0;
    }

    // 局部刷新当前比赛的状态/比分/结果/按钮可用性
    function refreshCurrent(){
      cur = XCEM.Engine.getDb().matches.find(function(m){return m.id===cur.id;}) || cur;
      document.getElementById('in-red').value = (cur.score?cur.score.red:0);
      document.getElementById('in-blue').value = (cur.score?cur.score.blue:0);
      document.getElementById('score-red').textContent = (cur.score?cur.score.red:0);
      document.getElementById('score-blue').textContent = (cur.score?cur.score.blue:0);
      var rl = document.getElementById('result-label');
      if(rl) rl.innerHTML = resultLabel(cur);
      var st = document.getElementById('status-pill');
      if(st) st.outerHTML = '<span id="status-pill" style="margin-right:6px">' + statusPill(cur.status) + '</span>';
      var stext = document.getElementById('status-text');
      if(stext) stext.textContent = (cur.confirmedAt?'已锁定于 '+esc(cur.confirmedAt):'未锁定') + (cur.modifyReason?' · 上次修改：'+esc(cur.modifyReason):'');
      var isLocked2 = (cur.status==='locked' || cur.status==='confirmed' || cur.status==='modified');
      ['btn-red-abstain','btn-blue-abstain','btn-golden','btn-penalty','btn-cancel-match'].forEach(function(id){
        var b = document.getElementById(id); if(b) b.disabled = isLocked2;
      });
      var cbtn = document.getElementById('btn-confirm');
      if(cbtn) cbtn.disabled = isLocked2;
      var ep = document.getElementById('extra-panel'); if(ep) ep.innerHTML = '';
      // 8.1 未确认黄条
      var bar = document.getElementById('pending-bar');
      var cur2 = cur;
      if(cur2.status === 'confirming' && !bar){
        var nb = document.createElement('div');
        nb.className = 'alert warn';
        nb.id = 'pending-bar';
        nb.innerHTML = '⚠️ 当前比赛有未确认的比分 <button class="btn btn-success btn-xs" id="btn-bar-confirm" style="margin-left:8px">✅ 立即确认</button>';
        document.getElementById('main-content').insertBefore(nb, document.getElementById('main-content').firstChild.nextSibling);
        var bc = document.getElementById('btn-bar-confirm');
        if(bc) bc.onclick = function(){
          var r = XCEM.Engine.confirmMatch(cur2.id);
          if(r.ok){ toast('已确认', 'success'); pageEntry(); } else { toast('操作失败', 'warn'); }
        };

  // 排名表导出为 xlsx（表头与页面表格一致：排名/队伍/单位/…/抽签号/破同分）

    var db = XCEM.Engine.getDb();

    var r = XCEM.Algorithm.computeRanking(db, groupId);
    var rows = [['排名','队伍','单位','场次','胜','平','负','进球','失球','净胜球','积分','抽签号','破同分']];
    r.order.forEach(function(item){

      rows.push([

  function pageKnockout(){
    var db = XCEM.Engine.getDb();
    var groups = db.groups;
    if(groups.length === 0){ setMain('<h1>淘汰赛</h1><div class="alert warn">尚未创建组别。</div>'); return; }
    var sel = window.__xcemKSel;
    if(!sel || !groups.some(function(g){return g.id===sel;})){
      sel = groups[0].id;
      window.__xcemKSel = sel;
    }
    var opts = groups.map(function(g){ return '<option value="' + g.id + '"' + (g.id===sel?' selected':'') + '>' + esc(g.name) + '</option>'; }).join('');

    // 【10.1】版本选择器
    var versions = XCEM.Engine.getKnockoutVersions(sel);
    var activeVer = window.__xcemKActiveVer || (versions.find(function(v){return v.status==='current';}) || {}).id || '';
    var versionOpts = versions.map(function(v){
      return '<option value="' + v.id + '"' + (v.id===activeVer?' selected':'') + '>'
        + 'v' + v.versionNo + ' · ' + v.status + ' · ' + esc(v.ts.substring(0,16).replace('T',' '))
        + (v.note?' · '+esc(v.note):'') + '</option>';
    }).join('');
    var readOnlyMode = activeVer && versions.find(function(v){return v.id===activeVer && v.status==='archived';});

    var koMatches = db.matches.filter(function(m){return m.groupId===sel && m.stage!=='qualifying' && !m.archived;});
    // 若 activeVer 是 archived 版本，则显示该版本的比赛（只读）
    var displayMatches = readOnlyMode ? db.matches.filter(function(m){return m.versionId===activeVer;}) : koMatches;

    if(displayMatches.length === 0){
      setMain('<h1>淘汰赛</h1><div class="panel"><div class="field-row"><div class="field"><label>选择组别</label><select id="k-group">' + opts + '</select></div>'
        + (versions.length>0?'<div class="field"><label>版本</label><select id="k-version"><option value="">仅当前版本</option>' + versionOpts + '</select></div>':'')
        + '</div><div class="empty-state">尚未生成淘汰赛。请先完成资格赛 → 进入"晋级"页面生成对阵。</div></div>');
      document.getElementById('k-group').onchange = function(){ window.__xcemKSel = this.value; window.__xcemKActiveVer = ''; pageKnockout(); };
      var kvs = document.getElementById('k-version');
      if(kvs) kvs.onchange = function(){ window.__xcemKActiveVer = this.value; pageKnockout(); };
      return;
    }
    // 分轮次分组
    var rounds = {};
    displayMatches.forEach(function(m){ rounds[m.round||0] = rounds[m.round||0]||[]; rounds[m.round||0].push(m); });
    var roundNums = Object.keys(rounds).map(Number).sort(function(a,b){return a-b;});
    var grp = db.groups.find(function(g){return g.id===sel;});
    // 淘汰规模 N：首轮(round=1)场数 × 2；用于“16强赛/8强赛”等轮次命名
    var koN = (rounds[1] ? rounds[1].length * 2 : 0) || grp.knockoutSize || 0;
    var readonlyBanner = readOnlyMode ? '<div class="alert warn"><b>📜 只读模式</b> — 查看历史版本 v' + esc(String(readOnlyMode.versionNo)) + '，历史比赛成绩完整保留。<button class="btn btn-xs" id="btn-back-current" style="margin-left:8px">↩ 返回当前版本</button></div>' : '';
    var schedVenueOpts = '<option value="">轮流分配</option>';
    var vCountK = db.settings.venuesCount || 2;

  // 轮次名称：按淘汰规模 N 命名（16 队首轮=16强赛，8强赛，4强赛，冠亚军决赛）
  function koRoundName(rn, N){
    var size = N / Math.pow(2, rn - 1);
    if(size === 2) return '冠亚军决赛';
    if(size === 4) return '4强赛';
    return size + '强赛';
  }
  // 阶段统一命名：资格赛 / 16强赛 / 8强赛 / 4强赛 / 季军赛 / 冠亚军决赛
  function matchStageLabel(m, koN){
    if(m.stage === 'qualifying') return '资格赛';
    if(m.stage === 'third') return '季军赛';
    if(m.stage === 'final') return '冠亚军决赛';
    if(m.stage === 'knockout') return koRoundName(m.round || 1, koN || 0);
    return '淘汰赛';
  }
  // 淘汰赛场次局部编号：每个阶段（16强赛/8强赛/4强赛/季军赛/冠亚军决赛）每个场地都从第 1 场开始编号
  function koStageSlotOrder(groupId){
    var db = XCEM.Engine.getDb();
    var order = {};
    var buckets = {};
    db.matches.forEach(function(m){
      if(m.stage === 'qualifying' || m.archived || m.status === 'cancelled') return;
      if(groupId && m.groupId !== groupId) return;
      if(!m.venueId) return;
      var key = m.groupId + '|' + m.stage + '|' + (m.round || 0) + '|' + m.venueId;
      (buckets[key] = buckets[key] || []).push(m);
    });
    Object.keys(buckets).forEach(function(k){
      buckets[k].sort(function(a,b){
        var sa = parseSlotTime(a.scheduledTime), sb = parseSlotTime(b.scheduledTime);
        if(isNaN(sa) && isNaN(sb)) return (a.matchIndex||0)-(b.matchIndex||0);
        if(isNaN(sa)) return 1;
        if(isNaN(sb)) return -1;
        return sa - sb;
      });
      buckets[k].forEach(function(m, i){ order[m.id] = i + 1; });
    });
    return order;
  }
  function renderBracket(rounds, roundNums, sel, N){
    var db = XCEM.Engine.getDb();
    var html = '<div class="panel"><h2>对阵树</h2><div class="bracket">';
    function matchCard(m){
      var redTeam = db.teams.find(function(t){return t.id===m.redTeamId;});
      var blueTeam = db.teams.find(function(t){return t.id===m.blueTeamId;});
      var locked = m.status==='locked'||m.status==='confirmed';
      var cancelled = m.status==='cancelled';
      var redWin = locked && m.winnerTeamId === m.redTeamId;
      var blueWin = locked && m.winnerTeamId === m.blueTeamId;
      return '<div class="match" data-ko-entry="' + m.id + '" style="cursor:'+(cancelled?'default':'pointer')+'">'
        + '<div class="seed">' + esc((m.redSeed?'#'+m.redSeed+' vs #'+(m.blueSeed||'?'):(m.matchIndex?'#'+m.matchIndex:''))) + (locked?' · <span class="text-success">已锁定</span>':(cancelled?' · <span class="text-muted">已取消</span>':'')) + '</div>'
        + '<div class="slot red ' + (redWin?'winner':'') + '">' + esc(redTeam?redTeam.name:'待定') + (redTeam&&redTeam.isInvited?' ★':'') + '</div>'
        + '<div class="vs">' + (m.score?(m.score.red+':'+m.score.blue):'— : —') + '</div>'
        + '<div class="slot blue ' + (blueWin?'winner':'') + '">' + esc(blueTeam?blueTeam.name:'待定') + (blueTeam&&blueTeam.isInvited?' ★':'') + '</div>'
        + (cancelled?'<div class="text-muted text-center" style="font-size:11px">已取消</div>':
          '<div class="text-center"><button class="btn btn-xs btn-primary" data-ko-entry="' + m.id + '">📝 录入</button></div>')
        + '</div>';
    }
    function roundColumn(title, list){
      list = list.slice().sort(function(a,b){
        var sa = a.redSeed||a.matchIndex||0, sb = b.redSeed||b.matchIndex||0;
        return sa - sb;
      });
      html += '<div class="round"><div class="round-title">' + esc(title) + '</div>';
      list.forEach(function(m){ html += matchCard(m); });
      html += '</div>';
    }
    // 汇总所有比赛，按阶段分类
    var allMatches = [];
    roundNums.forEach(function(rn){ allMatches = allMatches.concat(rounds[rn]||[]); });
    var finalList = allMatches.filter(function(m){ return m.stage === 'final'; }).sort(function(a,b){ return (a.matchIndex||0)-(b.matchIndex||0); });
    var thirdList = allMatches.filter(function(m){ return m.stage === 'third'; }).sort(function(a,b){ return (a.matchIndex||0)-(b.matchIndex||0); });
    // 1) 淘汰轮次从左到右升序（16强赛 → 8强赛 → 4强赛 …）
    roundNums.filter(function(rn){
      return (rounds[rn]||[]).some(function(m){ return m.stage === 'knockout'; });
    }).forEach(function(rn){
      var list = (rounds[rn]||[]).filter(function(m){ return m.stage === 'knockout'; });
      roundColumn(koRoundName(rn, N), list);
    });
    // 2) 最后一列：冠亚军决赛在上、季军赛在下
    if(finalList.length || thirdList.length){
      html += '<div class="round"><div class="round-title">决赛</div>';
      if(finalList.length){
        html += '<div class="round-sub">冠亚军决赛</div>';
        finalList.forEach(function(m){ html += matchCard(m); });
      }
      if(thirdList.length){
        html += '<div class="round-sub">季军赛</div>';
        thirdList.forEach(function(m){ html += matchCard(m); });
      }
      html += '</div>';
    }
    html += '</div></div>';
    return html;
  }
  // 导出淘汰赛详细比赛列表 xlsx（格式：阶段|场地|场次|红蓝|学校|队伍名，每场红蓝两行；场次按阶段场地局部编号）
  function exportKOListXlsx(matches, sel){
    var db = XCEM.Engine.getDb();
    var slotOrder = koStageSlotOrder(sel);
    var rows = [['阶段','场地','场次','红蓝','学校','队伍名']];
    matches.forEach(function(m){
      var red = db.teams.find(function(x){return x.id===m.redTeamId;});
      var blue = db.teams.find(function(x){return x.id===m.blueTeamId;});
      var g = db.groups.find(function(x){return x.id===m.groupId;});
      var stageLabel = matchStageLabel(m, g ? (g.knockoutSize||0) : 0);
      var venue = m.venueId ? (m.venueId.replace(/^V/,'') + '号场地') : '未排';
      var slot = slotOrder[m.id] ? slotOrder[m.id] : '';
      rows.push([stageLabel, venue, slot, '红', red?(red.organization||''):'待定', red?red.name:'待定']);
      rows.push([stageLabel, venue, slot, '蓝', blue?(blue.organization||''):'待定', blue?blue.name:'待定']);
    });
    return XCEM.Engine.buildXlsx('淘汰赛详细比赛列表', rows);
  }
  // 淘汰赛列表排序：16强赛(round1) → 8强赛(round2) → 4强赛(round3) → 季军赛 → 冠亚军决赛
  function koStageRank(m){
    if(m.stage === 'knockout') return (m.round||1);
    if(m.stage === 'third') return 90;
    if(m.stage === 'final') return 91;
    return 0;
  }
  function renderKOList(matches, sel, koN){
    var db = XCEM.Engine.getDb();
    // 场次：每个阶段每个场地均从 1 开始编号
    var slotOrder = koStageSlotOrder(sel);
    var rows = matches.slice().sort(function(a,b){
      var d = koStageRank(a) - koStageRank(b);
      if(d) return d;
      return (a.matchIndex||0) - (b.matchIndex||0);
    }).map(function(m){
      var redTeam = db.teams.find(function(t){return t.id===m.redTeamId;});
      var blueTeam = db.teams.find(function(t){return t.id===m.blueTeamId;});
      var stage = matchStageLabel(m, koN);
      return '<tr class="' + (m.status==='cancelled'?'cancelled':'') + '">'
        + '<td>' + stage + '</td>'
        + '<td>' + venueName(m.venueId) + '</td>'
        + '<td class="center">' + (slotOrder[m.id] ? '第' + slotOrder[m.id] + '场' : '<span class="text-muted">未排</span>') + '</td>'
        + '<td>' + esc(redTeam?redTeam.name:'待定') + '</td>'
        + '<td class="center">' + (m.score?m.score.red:0) + ' : ' + (m.score?m.score.blue:0) + '</td>'
        + '<td>' + esc(blueTeam?blueTeam.name:'待定') + '</td>'
        + '<td>' + statusPill(m.status) + '</td>'
        + '</tr>';
    }).join('');
    return '<div class="panel"><h2>详细比赛列表</h2><p class="hint">场次编号：每个阶段每个场地均从第 1 场开始</p>'
      + '<div class="btn-row no-print"><button class="btn btn-success" id="btn-export-ko-list">📊 输出 Excel(.xlsx)</button></div>'
      + '<div class="table-wrap"><table class="tbl"><thead><tr><th>阶段</th><th>场地</th><th class="center">场次</th><th>红队</th><th class="center">比分</th><th>蓝队</th><th>状态</th></tr></thead><tbody>' + rows + '</tbody></table></div></div>';
  }

  function pageVenuePlan(){
    var db = XCEM.Engine.getDb();
    db.venuePlan = db.venuePlan || { segments: [], applied:false };
    var vp = db.venuePlan;
    if(!Array.isArray(vp.segments)) vp.segments = [];
    var groups = db.groups;
    var vCount = db.settings.venuesCount || 2;
    if(groups.length === 0){ setMain('<h1>场地编排</h1><div class="alert warn">尚未创建组别。</div>'); return; }
    function groupTeams(gid){
      return db.teams.filter(function(t){ return t.groupId===gid && t.status!=='disqualified_after_play'; })
        .sort(function(a,b){ return (a.drawNumber||0)-(b.drawNumber||0); });
    }
    function segInfo(seg){
      var ts = groupTeams(seg.groupId).slice((seg.start||1)-1, seg.end||0);
      var m = ts.length;
      var g = groups.find(function(x){ return x.id===seg.groupId; });
      var a = ts.length ? (ts[0].drawNumber||'') : '?';
      var b = ts.length ? (ts[ts.length-1].drawNumber||'') : '?';
      return { g:g, m:m, matches:(m===2)?1:m, a:a, b:b };
    }
    var cards = '';
    for(var i=1; i<=vCount; i++){
      var vid = 'V' + i;
      var vs = vp.segments.find(function(x){ return x.venueId===vid; }) || { venueId:vid, segs:[] };
      var segRows = vs.segs.map(function(seg, si){
        var info = segInfo(seg);
        return '<div class="vp-seg">'
          + '<span class="vp-seg-name">' + esc(info.g?info.g.name:seg.groupId) + ' · 抽签号 ' + esc(info.a) + '-' + esc(info.b) + '</span>'
          + '<span class="vp-seg-meta">' + info.m + ' 队 / ' + info.matches + ' 场</span>'
          + '<button class="btn btn-xs btn-danger" data-vp-del="' + vid + '" data-vp-idx="' + si + '" style="float:right">✕</button>'
          + '</div>';
      }).join('');
      var totalM = vs.segs.reduce(function(s, seg){ return s + segInfo(seg).matches; }, 0);
      cards += '<div class="panel vp-card">'
        + '<h3>' + esc(i + ' 号场地') + ' <span class="vp-total">' + totalM + ' 场</span></h3>'
        + '<div class="vp-segs">' + (segRows || '<div class="text-muted" style="padding:4px 0">暂无分配</div>') + '</div>'
        + '<div class="vp-add">'
        +   '<select class="vp-add-g" data-vid="' + vid + '">' + groups.map(function(g){ return '<option value="' + esc(g.id) + '">' + esc(g.name) + '</option>'; }).join('') + '</select>'
        +   '<input class="vp-add-s" placeholder="起始抽签号" data-vid="' + vid + '" style="width:86px">'
        +   '<input class="vp-add-e" placeholder="结束抽签号" data-vid="' + vid + '" style="width:86px">'
        +   '<button class="btn btn-xs btn-primary" data-vp-add="' + vid + '">添加段</button>'
        + '</div>'
        + '</div>';
    }
    var plannedIds = {};
    vp.segments.forEach(function(vs){ (vs.segs||[]).forEach(function(seg){
      groupTeams(seg.groupId).slice((seg.start||1)-1, seg.end||0).forEach(function(t){ plannedIds[t.id] = true; });
    }); });
    var unplanned = db.teams.filter(function(t){ return t.status!=='disqualified_after_play' && !plannedIds[t.id] && groups.some(function(g){ return g.id===t.groupId && g.enabled; }); });
    var unplannedHtml = unplanned.length === 0
      ? '<div class="alert ok">✅ 所有队伍均已分配到场地。</div>'
      : '<div class="alert warn">⚠️ 有 ' + unplanned.length + ' 支队伍未进入任何段：' + unplanned.slice(0,10).map(function(t){ var g = groups.find(function(x){return x.id===t.groupId;}); return esc(g?g.name:'?') + '-' + esc(t.name); }).join('、') + (unplanned.length>10?'…':'') + '（未分配的队伍不生成比赛）</div>';
    var appliedNote = vp.applied
      ? '<div class="alert ok">✅ 当前编排已应用，赛程已按段生成（段内首尾循环）。调整后需重新应用。</div>'
      : '<div class="alert warn">当前编排尚未应用。调整完成后点击“应用并排程”，赛程将按段重建。</div>';
    var html = ''
      + '<h1>场地编排</h1>'
      + '<p class="sub">固定场地连续段首尾循环：每段内队伍全程不跨场地，段内对阵 a vs a+1 → a+1 vs a+2 → … → b vs a。推荐算法（V2.0）：小组完整放入最空场地，大组按最少段数拆分（每段先补到均载、剩余按负载最小逐 1 分配），兼顾负载均衡与混编场地最少；一个场地可容纳多个组别的段（可混组别）。</p>'
      + '<div class="panel">'
      +   '<div class="btn-row">'
      +     '<button class="btn btn-primary" id="btn-vp-recommend">🔄 一键推荐</button>'
      +     '<span class="meta" style="align-self:center">超载容差 delta（留空=自动，默认 max(5, 均载×10%)）</span>'
      +     '<input id="vp-delta" type="number" min="0" step="1" placeholder="自动" value="' + (typeof vp.delta==='number' && isFinite(vp.delta) ? vp.delta : '') + '" style="width:70px">'
      +     '<button class="btn btn-success" id="btn-vp-apply">📋 应用并排程</button>'
      +     '<button class="btn" id="btn-vp-clear">🧹 清空编排</button>'
      +     '<button class="btn" id="btn-vp-export">📤 导出编排表</button>'
      +   '</div>'
      +   appliedNote
      +   unplannedHtml
      + '</div>'
      + '<div class="vp-grid">' + cards + '</div>';
    setMain(html);
    document.getElementById('btn-vp-recommend').onclick = async function(){
      var ok = await confirm('一键推荐编排？', '<p>将按改进算法 V2.0（小组完整放入 + 大组最少段数拆分、每段先补到均载）重新生成各场地分配，<b>覆盖当前编排</b>。不会修改赛程，应用后才重建赛程。</p>', { okLabel:'生成推荐' });
      if(!(ok && ok.ok)) return;
      var dStr = document.getElementById('vp-delta').value.trim();
      var opts = (dStr === '') ? undefined : { delta: Math.max(0, parseInt(dStr, 10) || 0) };
      var r = XCEM.Engine.allocateVenues(opts);
      if(!r.ok){ toast('推荐失败: ' + (r.reason||''), 'error'); return; }
      var warnTxt = (r.warnings && r.warnings.length) ? '；⚠ ' + r.warnings.join('；') : '';
      toast('已生成推荐编排（共 ' + r.total + ' 队，均载 ' + r.target + '，负载上限 ' + r.maxLoad + '）' + warnTxt, (r.warnings && r.warnings.length) ? 'warn' : 'success');
      pageVenuePlan();
    };
    document.getElementById('btn-vp-apply').onclick = async function(){
      var r = XCEM.Engine.applyVenuePlan();
      if(!r.ok){
        var msg;
        if(r.reason === 'has_confirmed'){ msg = '已有确认成绩的资格赛，无法重建。请先取消相关比赛确认。'; }
        else if(r.reason === 'no_plan'){ msg = '尚无编排，请先一键推荐或手动添加段。'; }
        else { msg = (r.errors||[]).join('<br>') || ('失败: ' + r.reason); }
        var ok = await confirm('无法应用编排', '<p>' + msg + '</p>', { okLabel:'知道了' });
        return;
      }
      var extra = (r.unplanned && r.unplanned.length) ? '；另有 ' + r.unplanned.length + ' 队未分配，未生成比赛' : '';
      toast('已应用：按段生成 ' + r.count + ' 场并完成排程' + extra, 'success');
      pageVenuePlan();
    };
    document.getElementById('btn-vp-clear').onclick = async function(){
      var ok = await confirm('清空场地编排？', '<p>只清空编排方案，不会删除已生成的比赛与排程。清空后可重新推荐。</p>', { danger:true, okLabel:'清空' });
      if(!(ok && ok.ok)) return;
      db.venuePlan = { segments: [], applied:false };
      XCEM.Engine.save();
      toast('已清空编排', 'success');
      pageVenuePlan();
    };
    document.getElementById('btn-vp-export').onclick = function(){
      var rows = [['场地','组别','起始抽签号','结束抽签号','队伍数','场数']];
      var totalAll = 0;
      vp.segments.forEach(function(vs){
        (vs.segs||[]).forEach(function(seg){
          var info = segInfo(seg);
          rows.push([String(vs.venueId).replace('V','')+'号场地', info.g?info.g.name:seg.groupId, info.a, info.b, info.m, info.matches]);
          totalAll += info.matches;
        });
      });
      rows.push(['合计', '', '', '', '', totalAll]);
      downloadText('场地编排_' + Date.now() + '.xlsx', XCEM.Engine.buildXlsx('场地编排', rows), 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
      toast('已导出编排表', 'success');
    };
    Array.prototype.forEach.call(document.querySelectorAll('[data-vp-del]'), function(b){
      b.onclick = function(){
        var vid = b.dataset.vpDel, idx = parseInt(b.dataset.vpIdx, 10);
        var vs = vp.segments.find(function(x){ return x.venueId===vid; });
        if(vs && vs.segs[idx] !== undefined) vs.segs.splice(idx, 1);
        if(vs && vs.segs.length === 0) vp.segments = vp.segments.filter(function(x){ return x.venueId!==vid; });
        vp.applied = false;
        XCEM.Engine.save();
        toast('已删除段', 'success');
        pageVenuePlan();
      };
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-vp-add]'), function(b){
      b.onclick = function(){
        var vid = b.dataset.vpAdd;
        var card = b.closest('.vp-card');
        if(!card) return;
        var gid = card.querySelector('.vp-add-g').value;
        var sStr = card.querySelector('.vp-add-s').value.trim();
        var eStr = card.querySelector('.vp-add-e').value.trim();
        var ts = groupTeams(gid);
        if(ts.length === 0){ toast('该组没有队伍', 'error'); return; }
        function posOf(dn){
          for(var i=0; i<ts.length; i++){ if(String(ts[i].drawNumber) === String(dn)) return i+1; }
          return -1;
        }
        var sp = posOf(sStr), ep = posOf(eStr);
        if(sp < 1 || ep < 1){ toast('抽签号不存在（该组可用 ' + (ts[0].drawNumber||'?') + '-' + (ts[ts.length-1].drawNumber||'?') + '）', 'error'); return; }
        if(sp > ep){ var tmp = sp; sp = ep; ep = tmp; }
        var conflict = false;
        vp.segments.forEach(function(vs){ (vs.segs||[]).forEach(function(seg){
          if(seg.groupId !== gid) return;
          if(!(ep < seg.start || sp > seg.end)) conflict = true;
        }); });
        if(conflict){ toast('该组队伍与已有段重叠，请检查', 'error'); return; }
        var vs = vp.segments.find(function(x){ return x.venueId===vid; });
        if(!vs){ vs = { venueId:vid, segs:[] }; vp.segments.push(vs); }
        vs.segs.push({ groupId:gid, start:sp, end:ep });
        vp.applied = false;
        XCEM.Engine.save();
        toast('已添加段', 'success');
        pageVenuePlan();
      };
    });
  }

  // 场地内场次编号：每个场地按时间槽排序后编号 1..N（“本场地第几场”）
  function venueSlotOrder(){
    var db = XCEM.Engine.getDb();
    var byVenue = {};
    var order = {};
    db.matches.forEach(function(m){
      if(!m.venueId || !m.scheduledTime || m.status === 'cancelled' || m.archived) return;
      (byVenue[m.venueId] = byVenue[m.venueId] || []).push(m);
    });
    Object.keys(byVenue).forEach(function(v){
      byVenue[v].sort(function(a,b){
        var sa = parseSlotTime(a.scheduledTime), sb = parseSlotTime(b.scheduledTime);
        if(isNaN(sa) && isNaN(sb)) return (a.matchIndex||0)-(b.matchIndex||0);
        if(isNaN(sa)) return 1;
        if(isNaN(sb)) return -1;
        return sa - sb;
      });
      byVenue[v].forEach(function(m, i){ order[m.id] = i + 1; });
    });
    return { byVenue:byVenue, order:order };
  }
  // 视图 1：按场地 —— 下拉选择单个场地，用“本场地第几场”编号，可单独导出

  // 视图 2：按组别 —— 按抽签号排序显示队伍与场地/场次安排，可导出
  function renderByGroup(sel){
    var db = XCEM.Engine.getDb();
    var slots = venueSlotOrder();
    var list = sel ? db.groups.filter(function(g){ return g.id===sel; }) : db.groups.slice();
    var html = '';
    var shown = 0;
    list.forEach(function(g){
      var ts = db.teams.filter(function(t){ return t.groupId===g.id && t.status!=='disqualified_after_play'; })
        .sort(function(a,b){ return (a.drawNumber||0)-(b.drawNumber||0); });
      if(ts.length === 0) return;
      shown++;
      var rows = ts.map(function(t){
        // 6.10.2 排除已归档旧比赛，避免重建对阵后的旧记录混入排程表
        var myMs = db.matches.filter(function(m){
          return (m.redTeamId===t.id || m.blueTeamId===t.id) && m.status!=='cancelled' && !m.archived && m.venueId && m.scheduledTime;
        }).sort(function(a,b){ return parseSlotTime(a.scheduledTime) - parseSlotTime(b.scheduledTime); });
        var cells = myMs.map(function(m){
          return m.venueId.replace(/^V/,'') + '号场地 第' + (slots.order[m.id]||'?') + '场';
        }).join('<br>');
        return '<tr>'
          + '<td class="center">' + (t.drawNumber||'') + '</td>'
          + '<td>' + esc(t.organization||'') + '</td>'
          + '<td>' + esc(t.name) + (t.isInvited?' <span style="font-size:10px;color:var(--gold)">★特邀</span>':'') + '</td>'
          + '<td>' + (cells || '<span class="text-muted">未排程</span>') + '</td>'
          + '</tr>';
      }).join('');
      html += '<div class="panel">'
        + '<h3>' + esc(g.name) + ' <span class="meta">' + ts.length + ' 队</span></h3>'
        + '<div class="table-wrap"><table class="tbl"><thead><tr>'
        + '<th class="center">抽签号</th><th>学校</th><th>队伍名</th><th>场地 / 场次</th>'
        + '</tr></thead><tbody>' + rows + '</tbody></table></div>'
        + '</div>';
    });
    if(shown === 0) return '<div class="panel"><div class="empty-state">暂无数据。</div></div>';
    return html;
  }
  // 导出单个场地的编排表（xlsx）：阶段|场地|场次|红蓝|学校|队伍名
  function exportVenueTable(vid){
    var db = XCEM.Engine.getDb();
    var slots = venueSlotOrder();
    var ms = slots.byVenue[vid] || [];
    if(ms.length === 0) return null;
    var rows = [['阶段','场地','场次','红蓝','学校','队伍名']];
    ms.forEach(function(m, idx){
      var red = db.teams.find(function(x){return x.id===m.redTeamId;});
      var blue = db.teams.find(function(x){return x.id===m.blueTeamId;});
      var g = db.groups.find(function(x){return x.id===m.groupId;});
      var stageLabel = matchStageLabel(m, g ? (g.knockoutSize||0) : 0);
      rows.push([stageLabel, vid.replace(/^V/,'') + '号场地', idx+1, '红', red?(red.organization||''):'待定', red?red.name:'待定']);
      rows.push([stageLabel, vid.replace(/^V/,'') + '号场地', idx+1, '蓝', blue?(blue.organization||''):'待定', blue?blue.name:'待定']);
    });
    return XCEM.Engine.buildXlsx('场地编排表-' + vid.replace(/^V/,''), rows);
  }
  // 导出组别排程表（xlsx）：组别|抽签号|学校|队伍名|第1场|第2场...
  function exportGroupTable(sel){
    var db = XCEM.Engine.getDb();
    var slots = venueSlotOrder();
    var list = sel ? db.groups.filter(function(g){ return g.id===sel; }) : db.groups.slice();
    var rows = [];
    var maxN = 0;
    list.forEach(function(g){
      db.teams.filter(function(t){ return t.groupId===g.id && t.status!=='disqualified_after_play'; })
        .sort(function(a,b){ return (a.drawNumber||0)-(b.drawNumber||0); })
        .forEach(function(t){
          // 6.10.2 排除已归档旧比赛，避免重建对阵后的旧记录混入排程表
          var myMs = db.matches.filter(function(m){
            return (m.redTeamId===t.id || m.blueTeamId===t.id) && m.status!=='cancelled' && !m.archived && m.venueId && m.scheduledTime;
          }).sort(function(a,b){ return parseSlotTime(a.scheduledTime) - parseSlotTime(b.scheduledTime); });
          if(myMs.length > maxN) maxN = myMs.length;
          var cell = [g.name, t.drawNumber||'', t.organization||'', t.name];
          myMs.forEach(function(m){ cell.push(m.venueId.replace(/^V/,'') + '号场地第' + (slots.order[m.id]||'?') + '场'); });
          rows.push(cell);
        });
    });
    if(rows.length === 0) return null;
    var header = ['组别', '抽签号', '学校', '队伍名'];
    for(var i=1; i<=maxN; i++) header.push('第' + i + '场');
    rows.forEach(function(r){ while(r.length < header.length) r.push(''); });
    rows.unshift(header);
    return XCEM.Engine.buildXlsx('组别排程表', rows);
  }

  // ===== 6.10.2 报表中心：组别+报表类型两个下拉，选择后才生成内容；下载当前报表 =====
  // 6.10.2 去掉场地编排表（与按场地检录表重复），保留 6 类
  var REP_TYPES = [
    { id:'ranking',       label:'1. 资格赛排名表' },
    { id:'advance',       label:'2. 晋级队伍表' },
    { id:'ko',            label:'3. 淘汰赛对阵表' },
    { id:'checkin',       label:'4. 按场地检录表' },
    { id:'groupSchedule', label:'5. 组别排程表' },
    { id:'drawTemplate',  label:'6. 抽签报名模板' }
  ];
  // 该组已排程比赛，按场地+场地内场次排序
  function repSortedMatches(sel){
    var db = XCEM.Engine.getDb();
    var slots = venueSlotOrder();
    return db.matches.filter(function(m){
      return m.groupId===sel && m.status!=='cancelled' && !m.archived && m.venueId && m.scheduledTime;
    }).sort(function(a,b){
      var va = parseInt(String(a.venueId).replace(/^V/,''),10) || 0;
      var vb = parseInt(String(b.venueId).replace(/^V/,''),10) || 0;
      if(va !== vb) return va - vb;
      return (slots.order[a.id]||0) - (slots.order[b.id]||0);
    });
  }
  // 生成报表内容 HTML（组别 + 报表类型；checkin 时 stage 可选：按阶段筛选）
  function repBuildContent(type, sel, stage){
    var db = XCEM.Engine.getDb();
    var grp = db.groups.find(function(g){return g.id===sel;});
    var gname = grp ? esc(grp.name) : '';
    var koSize = grp ? (grp.knockoutSize || 0) : 0;
    function stamp(){ return '<div class="text-right text-muted mt-2">赛事：' + esc(db.event.name) + ' · 生成时间：' + new Date().toLocaleString() + '</div>'; }
    if(type === 'ranking'){
      var r = XCEM.Algorithm.computeRanking(db, sel);
      var rows = r.order.map(function(item){
        var s = r.stats[item.teamId]||{};
        var t = db.teams.find(function(x){return x.id===item.teamId;});
        return '<tr><td>'+item.rank+'</td><td>' + esc(t.name) + '</td><td>' + esc(t.organization||'') + '</td><td class="center">'+s.played+'</td><td class="center">'+s.won+'</td><td class="center">'+s.drawn+'</td><td class="center">'+s.lost+'</td><td class="center">'+s.gf+'</td><td class="center">'+s.ga+'</td><td class="center">'+(s.gd>=0?'+':'')+s.gd+'</td><td class="center"><b>'+s.pts+'</b></td><td class="center">'+(t.isInvited?'★':'')+'</td></tr>';
      }).join('');
      return '<div class="panel"><h2>报表 1 — 资格赛排名表 — ' + gname + '</h2>'
        + '<div class="table-wrap"><table class="tbl"><thead><tr>'
        + '<th>排名</th><th>队伍</th><th>单位</th><th class="center">场</th><th class="center">胜</th><th class="center">平</th><th class="center">负</th><th class="center">进球</th><th class="center">失球</th><th class="center">净胜</th><th class="center">积分</th><th class="center">特邀</th>'
        + '</tr></thead><tbody>' + rows + '</tbody></table></div>' + stamp() + '</div>';
    }
    if(type === 'advance'){
      var adv = XCEM.Algorithm.computeAdvancement(db, sel);
      if(!adv.ok) return '<div class="panel"><div class="empty-state">该组尚未生成晋级结果或条件不足（详见"晋级"页面）。</div></div>';
      var aRows = adv.seq.map(function(it){
        var t = db.teams.find(function(x){return x.id===it.teamId;});
        return '<tr><td class="center"><b>#'+it.seed+'</b></td><td>' + esc(t.name) + (t.isInvited?' ★':'') + '</td><td class="center">'+it.rank+'</td><td class="center">' + (it.rank <= adv.R?'排名晋级':'特邀晋级') + '</td></tr>';
      }).join('');
      return '<div class="panel"><h2>报表 2 — 晋级队伍表 — ' + gname + '</h2>'
        + '<div class="table-wrap"><table class="tbl"><thead><tr><th>种子</th><th>队伍</th><th class="center">资格赛排名</th><th class="center">晋级方式</th></tr></thead><tbody>' + aRows + '</tbody></table></div>' + stamp() + '</div>';
    }
    if(type === 'ko'){
      var koMatches = db.matches.filter(function(m){return m.groupId===sel && m.stage!=='qualifying' && !m.archived;});
      if(koMatches.length === 0) return '<div class="panel"><div class="empty-state">尚未生成淘汰赛对阵。</div></div>';
      // 6.10.2 场次改为每个阶段每个场地从 1 开始编号（与打印的报表一致）
      var repSlots = koStageSlotOrder(sel);
      var kRows = koMatches.map(function(m){
        var red = db.teams.find(function(x){return x.id===m.redTeamId;});
        var blue = db.teams.find(function(x){return x.id===m.blueTeamId;});
        return '<tr><td>'+(m.matchIndex||'')+'</td><td>'+matchStageLabel(m, koSize)+'</td><td>'+venueName(m.venueId)+'</td><td class="center">'+(repSlots[m.id]?'第'+repSlots[m.id]+'场':'—')+'</td><td>'+esc(red?red.name:'-')+'</td><td class="center">'+(m.score?m.score.red+':'+m.score.blue:'— : —')+'</td><td>'+esc(blue?blue.name:'-')+'</td><td>'+statusPill(m.status)+'</td></tr>';
      }).join('');
      return '<div class="panel"><h2>报表 3 — 淘汰赛对阵表 — ' + gname + '</h2>'
        + '<div class="table-wrap"><table class="tbl"><thead><tr><th>#</th><th>阶段</th><th>场地</th><th class="center">场次</th><th>红队</th><th class="center">比分</th><th>蓝队</th><th>状态</th></tr></thead><tbody>' + kRows + '</tbody></table></div>' + stamp() + '</div>';
    }
    if(type === 'checkin'){
      var ms = repSortedMatches(sel);
      // 6.10.2 阶段选择框：非"全部阶段"时按阶段筛选
      if(stage){
        ms = ms.filter(function(m){ return matchStageLabel(m, koSize) === stage; });
      }
      if(ms.length === 0) return '<div class="panel"><div class="empty-state">该组该阶段暂无已排程比赛（请先到"场地排程"页面排程）。</div></div>';
      var repSlots2 = venueSlotOrder();
      var cRows = ms.map(function(m){
        var red = db.teams.find(function(x){return x.id===m.redTeamId;});
        var blue = db.teams.find(function(x){return x.id===m.blueTeamId;});
        // 6.10.2 新表头：组别|阶段|场地|场次|红队队名|学校名称|蓝队队名|学校名称
        return '<tr><td>'+gname+'</td><td>'+matchStageLabel(m, koSize)+'</td><td>'+venueName(m.venueId)+'</td><td class="center">'+(repSlots2.order[m.id]?'第'+repSlots2.order[m.id]+'场':'—')+'</td><td>'+esc(red?red.name:'-')+'</td><td>'+esc(red?(red.organization||''):'')+'</td><td>'+esc(blue?blue.name:'-')+'</td><td>'+esc(blue?(blue.organization||''):'')+'</td></tr>';
      }).join('');
      return '<div class="panel"><h2>报表 4 — 按场地检录表 — ' + gname + (stage?' — ' + esc(stage):'') + '</h2>'
        + '<div class="table-wrap"><table class="tbl"><thead><tr><th>组别</th><th>阶段</th><th>场地</th><th class="center">场次</th><th>红队队名</th><th>学校名称</th><th>蓝队队名</th><th>学校名称</th></tr></thead><tbody>' + cRows + '</tbody></table></div>' + stamp() + '</div>';
    }
    if(type === 'groupSchedule'){
      var ts = db.teams.filter(function(t){ return t.groupId===sel && t.status!=='disqualified_after_play'; })
        .sort(function(a,b){ return (a.drawNumber||0)-(b.drawNumber||0); });
      var slots4 = venueSlotOrder();
      var gRows = ts.map(function(t){
        // 6.10.2 排除已归档旧比赛，避免重建对阵后的旧记录混入排程表
        var myMs = db.matches.filter(function(m){
          return (m.redTeamId===t.id || m.blueTeamId===t.id) && m.status!=='cancelled' && !m.archived && m.venueId && m.scheduledTime;
        }).sort(function(a,b){ return parseSlotTime(a.scheduledTime) - parseSlotTime(b.scheduledTime); });
        var cells = myMs.map(function(m){
          return m.venueId.replace(/^V/,'') + '号场地 第' + (slots4.order[m.id]||'?') + '场';
        }).join('<br>');
        return '<tr><td class="center">' + (t.drawNumber||'') + '</td><td>' + esc(t.organization||'') + '</td><td>' + esc(t.name) + (t.isInvited?' <span style="font-size:10px;color:var(--gold)">★特邀</span>':'') + '</td><td>' + (cells || '<span class="text-muted">未排程</span>') + '</td></tr>';
      }).join('');
      return '<div class="panel"><h2>报表 5 — 组别排程表 — ' + gname + '</h2>'
        + '<div class="table-wrap"><table class="tbl"><thead><tr><th class="center">抽签号</th><th>学校</th><th>队伍名</th><th>场地 / 场次</th></tr></thead><tbody>' + gRows + '</tbody></table></div>' + stamp() + '</div>';
    }
    if(type === 'drawTemplate'){
      var tts = db.teams.filter(function(t){return t.groupId===sel && t.status!=='disqualified_after_play';})
        .sort(function(a,b){ return (a.name||'').localeCompare(b.name||''); });
      var dRows = tts.map(function(t){
        return '<tr><td class="center"></td><td>' + esc(t.name||'') + '</td><td>' + esc(t.organization||'') + '</td><td>' + esc(grp.name||'') + '</td><td class="center">' + (t.isInvited?'★':'') + '</td></tr>';
      }).join('');
      return '<div class="panel"><h2>报表 6 — 抽签报名模板 — ' + gname + '</h2>'
        + '<div class="table-wrap"><table class="tbl"><thead><tr><th class="center">抽签号</th><th>队名</th><th>单位</th><th>组别</th><th class="center">特邀</th></tr></thead><tbody>' + dRows + '</tbody></table></div>'
        + '<div class="text-muted mt-2">提示：下载 xlsx 后在"抽签号"列填写，再到抽签页用"导入抽签报名模板"直接导入。</div>' + stamp() + '</div>';
    }
    return '<div class="panel"><div class="empty-state">请先选择报表类型。</div></div>';
  }
  // 6.10.2 检录表阶段下拉选项：该组已排程比赛存在的阶段（按固定顺序）
  function repStageOptions(sel, curStage){
    var db = XCEM.Engine.getDb();
    var grp = db.groups.find(function(g){return g.id===sel;});
    var koSize = grp ? (grp.knockoutSize||0) : 0;
    var stages = [];
    repSortedMatches(sel).forEach(function(m){
      var lb = matchStageLabel(m, koSize);
      if(stages.indexOf(lb) < 0) stages.push(lb);
    });
    var fixed = ['资格赛','季军赛','冠亚军决赛'];
    stages.sort(function(a,b){
      function rk(s){ var i = fixed.indexOf(s); if(i>=0) return 100+i; var mm = s.match(/^(\d+)强赛$/); return mm ? parseInt(mm[1],10) : 200; }
      return rk(a)-rk(b);
    });
    var opts = '<option value="">全部阶段</option>';
    stages.forEach(function(s){ opts += '<option value="' + esc(s) + '"' + (s===curStage?' selected':'') + '>' + esc(s) + '</option>'; });
    return opts;
  }
  // 阶段选择框仅在报表类型=按场地检录表时显示
  function repUpdateStageSel(show){
    var w = document.getElementById('rep-stage-wrap');
    if(!w) return;
    if(show){
      var o = document.getElementById('rep-stage');
      if(o) o.innerHTML = repStageOptions(window.__xcemRepSel, window.__xcemRepStage||'');
      w.style.display = '';
    } else {
      w.style.display = 'none';
      window.__xcemRepStage = '';
    }
  }
  function pageReports(){
    var db = XCEM.Engine.getDb();
    var groups = db.groups;
    if(groups.length === 0){ setMain('<h1>报表中心</h1><div class="alert warn">尚未创建组别。</div>'); return; }

    if(!groups.some(function(g){return g.id===sel;})){ sel = groups[0].id; window.__xcemRepSel = sel; }
    window.__xcemRepSel = sel;
    var repType = window.__xcemRepType || '';
    var opts = groups.map(function(g){ return '<option value="' + g.id + '"' + (g.id===sel?' selected':'') + '>' + esc(g.name) + '</option>'; }).join('');
    var typeOpts = '<option value="">— 请选择报表类型 —</option>' + REP_TYPES.map(function(rt){
      return '<option value="' + rt.id + '"' + (rt.id===repType?' selected':'') + '>' + rt.label + '</option>';
    }).join('');
    var html = ''
      + '<h1>报表中心</h1><p class="sub">选择组别与报表类型后生成报表</p>'
      + '<div class="panel no-print">'
      +   '<div class="field-row">'
      +     '<div class="field"><label>选择组别</label><select id="rep-group">' + opts + '</select></div>'
      +     '<div class="field"><label>报表类型</label><select id="rep-type">' + typeOpts + '</select></div>'
      +     '<div class="field" id="rep-stage-wrap" style="display:none"><label>选择阶段</label><select id="rep-stage"></select></div>'
      +   '</div>'
      +   '<div class="btn-row mt-2"><button class="btn btn-success" id="btn-download-report">⬇️ 下载当前报表</button></div>'
      + '</div>'

    setMain(html);
    repUpdateStageSel(repType === 'checkin');

    document.getElementById('rep-group').onchange = function(){
      window.__xcemRepSel = this.value;
