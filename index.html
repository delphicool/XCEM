    };
    document.getElementById('rep-type').onchange = function(){
      window.__xcemRepType = this.value;
      repUpdateStageSel(this.value === 'checkin');
      repRender(this.value, window.__xcemRepSel);
    };
    document.getElementById('rep-stage').onchange = function(){
      window.__xcemRepStage = this.value;
      repRender(window.__xcemRepType, window.__xcemRepSel);
    };
    document.getElementById('btn-download-report').onclick = function(){
      var t = window.__xcemRepType;
      if(!t){ toast('请先选择报表类型', 'warn'); return; }
      repDownload(t, window.__xcemRepSel, window.__xcemRepStage || '');
    };
  }
  function repRender(type, sel){
    var box = document.getElementById('rep-content');
    if(box && type) box.innerHTML = repBuildContent(type, sel, window.__xcemRepStage || '');
  }
  function repDownload(type, sel, stage){
    var db = XCEM.Engine.getDb();
    var grp = db.groups.find(function(g){return g.id===sel;});
    if(!grp) return;
    var xlsxMime = 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
    var u8, name;
    if(type === 'ranking'){
      u8 = exportRankingXlsx(sel);
      name = '资格赛排名表-' + grp.name + '.xlsx';
    } else if(type === 'advance'){
      u8 = exportAdvanceXlsx(sel);
      if(!u8){ toast('该组尚未生成晋级结果', 'warn'); return; }
      name = '晋级队伍表-' + grp.name + '.xlsx';
    } else if(type === 'ko'){
      var koMatches = db.matches.filter(function(m){return m.groupId===sel && m.stage!=='qualifying' && !m.archived;});
      if(koMatches.length === 0){ toast('尚未生成淘汰赛对阵', 'warn'); return; }
      u8 = exportKOListXlsx(koMatches, sel);
      name = '淘汰赛对阵表-' + grp.name + '.xlsx';
    } else if(type === 'checkin'){
      u8 = exportCheckInGroupXlsx(sel, stage);
      if(!u8){ toast('该组该阶段暂无已排程比赛', 'warn'); return; }
      name = '按场地检录表-' + grp.name + (stage?'-' + stage:'') + '.xlsx';
    } else if(type === 'groupSchedule'){
      u8 = exportGroupTable(sel);
      if(!u8){ toast('无已排程比赛', 'warn'); return; }
      name = '组别排程表-' + grp.name + '.xlsx';
    } else if(type === 'drawTemplate'){
      // 6.10.2 抽签报名模板改 xlsx，填好抽签号后可在抽签页直接导入
      u8 = XCEM.Engine.exportDrawTemplateXlsx(sel);
      if(!u8){ toast('该组暂无队伍', 'warn'); return; }
      name = '抽签报名模板-' + grp.name + '.xlsx';
    } else { toast('请先选择报表类型', 'warn'); return; }
    if(!u8){ toast('下载失败', 'error'); return; }
    downloadText(name, u8, xlsxMime);
    toast('已下载 ' + name, 'success');
  }
  // 6.10.1 下载：晋级队伍表 xlsx
  function exportAdvanceXlsx(groupId){
    var db = XCEM.Engine.getDb();
    var adv = XCEM.Algorithm.computeAdvancement(db, groupId);
    if(!adv.ok || !adv.seq || adv.seq.length === 0) return null;
    var rows = [['种子','队伍','单位','资格赛排名','晋级方式','特邀']];
    adv.seq.forEach(function(it){
      var t = db.teams.find(function(x){return x.id===it.teamId;});
      rows.push([it.seed, t?t.name:'', t?(t.organization||''):'', it.rank, it.rank <= adv.R ? '排名晋级' : '特邀晋级', (t && t.isInvited) ? '★' : '']);
    });
    return XCEM.Engine.buildXlsx('晋级队伍表', rows);
  }
  // 6.10.2 下载：按场地检录表（单组，可选阶段；表头：组别|阶段|场地|场次|红队队名|学校名称|蓝队队名|学校名称）
  function exportCheckInGroupXlsx(groupId, stage){
    var db = XCEM.Engine.getDb();
    var grp = db.groups.find(function(x){return x.id===groupId;});
    var koSize = grp ? (grp.knockoutSize||0) : 0;
    var ms = repSortedMatches(groupId);
    if(stage){
      ms = ms.filter(function(m){ return matchStageLabel(m, koSize) === stage; });
    }
    if(ms.length === 0) return null;
    var slots = venueSlotOrder();
    var rows = [['组别','阶段','场地','场次','红队队名','学校名称','蓝队队名','学校名称']];
    ms.forEach(function(m){
      var red = db.teams.find(function(x){return x.id===m.redTeamId;});
      var blue = db.teams.find(function(x){return x.id===m.blueTeamId;});
      var g = db.groups.find(function(x){return x.id===m.groupId;});
      rows.push([
        g ? g.name : '',
        matchStageLabel(m, koSize),
        venueName(m.venueId),
        slots.order[m.id] ? ('第' + slots.order[m.id] + '场') : '—',
        red ? red.name : '待定',
        red ? (red.organization||'') : '',
        blue ? blue.name : '待定',
        blue ? (blue.organization||'') : ''
      ]);
    });
    return XCEM.Engine.buildXlsx('按场地检录表', rows);
  }

  function pageBigScreen(){
    var db = XCEM.Engine.getDb();
    var groups = db.groups;
    if(groups.length === 0){
      setMain('<div class="bigscreen"><div class="bs-row"><div class="bs-main"><h1 style="color:#fff">赛事大屏</h1><div class="text-muted">尚无组别</div></div><div class="bs-side"></div></div></div>');
      return;
    }
    // 轮播列表（勾选状态存 window.__xcemBSRotList，重进页面保留）
    var rotationList = (window.__xcemBSRotList && window.__xcemBSRotList.length)
      ? window.__xcemBSRotList.filter(function(id){ return groups.some(function(g){return g.id===id;}); })
      : null;
    if(!rotationList || !rotationList.length){
      rotationList = groups.filter(function(g){return g.enabled;}).map(function(g){return g.id;});
      if(!rotationList.length) rotationList = groups.map(function(g){return g.id;});
    }
    var sel = window.__xcemBSSel;
    if(!sel || rotationList.indexOf(sel) < 0) sel = rotationList[0];
    window.__xcemBSSel = sel;
    // 6.9.1 分屏：1=资格赛 2=淘汰赛
    var tab = window.__xcemBSTab === 'ko' ? 'ko' : 'qual';
    window.__xcemBSTab = tab;
    var paused = !!window.__xcemBSPaused;
    // 6.9.4 切换时间：每个组别显示多少秒后切换（默认 60 秒/组）
    var switchSec = parseInt(window.__xcemBSSwitchSec) || 60;
    if(switchSec < 10) switchSec = 10;
    if(switchSec > 600) switchSec = 600;

    var opts = groups.map(function(g){ return '<option value="' + g.id + '"' + (g.id===sel?' selected':'') + '>' + esc(g.name) + '</option>'; }).join('');
    var rotOpts = groups.map(function(g){
      var on = rotationList.indexOf(g.id) >= 0 ? 'checked' : '';
      return '<label style="margin-right:12px;color:#fff;font-size:13px"><input type="checkbox" class="bs-rot-cb" data-id="' + g.id + '" ' + on + ' style="margin-right:4px">' + esc(g.name) + '</label>';
    }).join('');

    var html = ''
      + '<div class="bigscreen">'
      +   '<div class="bs-header">'
      +     '<div class="bs-header-left">'
      +       '<button class="bs-tab-btn" id="bs-tab1">① 资格赛</button>'
      +       '<button class="bs-tab-btn" id="bs-tab2">② 淘汰赛</button>'
      +       '<select id="bs-group" style="padding:8px 14px;border-radius:6px;background:#fff;color:#111;border:1px solid rgba(255,255,255,.3);font-size:15px">' + opts + '</select>'
      +       '<button class="btn btn-sm" id="bs-fullscreen" style="margin-left:8px">⛶ 全屏</button>'
      +       '<button class="btn btn-sm" id="bs-popout" style="margin-left:8px">⛶ 弹出窗口</button>'
      +     '</div>'
      +     '<h1 style="color:#fbbf24;margin:0;text-align:center;flex:1">' + esc(db.event.name||'赛事大屏') + '</h1>'
      +     '<div class="bs-header-right">'
      +       '<span style="color:#fbbf24;font-size:13px">切换时间</span>'
      +       '<input type="number" id="bs-switch-sec" min="10" max="600" step="5" value="' + switchSec + '" style="width:70px;margin:0 4px;padding:4px 6px;border-radius:4px;border:1px solid rgba(255,255,255,.3);background:#fff;color:#111;text-align:center">'
      +       '<span style="color:#fbbf24;font-size:13px">秒/组</span>'
      +       '<button class="btn btn-sm" id="bs-prev" style="margin-left:8px">⏮</button>'
      +       '<button class="btn btn-sm" id="bs-pause" style="margin-left:4px">' + (paused?'▶':'⏸') + '</button>'
      +       '<button class="btn btn-sm" id="bs-next" style="margin-left:4px">⏭</button>'
      +     '</div>'
      +   '</div>'
      +   '<div class="bs-rot-config" style="padding:6px 14px;background:rgba(0,0,0,.2);border-bottom:1px solid rgba(255,255,255,.1)">'
      +     '<span style="color:#94a3b8;font-size:12px;margin-right:8px">轮播组别：</span>' + rotOpts
      +   '</div>'
      +   '<div class="bs-row">'
      +     '<div class="bs-main bs-rank-panel">'
      +       '<div class="bs-rank-title" id="bs-scroll-title"></div>'
      +       '<div class="table-wrap bs-scroll-area" id="bs-scroll-area"></div>'
      +     '</div>'
      +     '<div class="bs-side">'
      +       '<div class="bs-rank" id="bs-side-progress"></div>'
      +       '<div class="bs-rank"><h3 style="color:#fbbf24" id="bs-side-top3-title">前 3 名</h3><div id="bs-side-top3"></div></div>'
      +     '</div>'
      +   '</div>'
      +   '<div class="bs-progress-bar"><div class="bs-progress-fill" style="width:0%"></div></div>'
      + '</div>';
    setMain(html);

    // ===== 6.9.2 动态内容全部局部刷新（不重建整页，保证全屏下不会因自动切换而退出） =====
    function buildRankBody(gId){
      var grp = groups.find(function(g){return g.id===gId;});
      var rr = XCEM.Algorithm.computeRanking(db, gId);
      var st = rr.stats || {};
      var list = (rr.order||[]).map(function(it){
        var t = db.teams.find(function(x){return x.id===it.teamId;});
        var s = st[it.teamId] || {};
        return {
          rank: it.rank, name: t ? t.name : '?', org: t ? (t.organization||'') : '',
          played: s.played||0, won: s.won||0, drawn: s.drawn||0, lost: s.lost||0,
          gf: s.gf||0, ga: s.ga||0, gd: s.gd||0, pts: s.pts||0, source: it.source||'qual'
        };
      });
      // 6.9.2 显示全部队伍（不截断），滚到底才切组别
      var rows = list.map(function(r2){
        var rowCls = r2.source && r2.source.indexOf('lot') === 0 ? ' class="lot-row"' : '';
        return '<tr' + rowCls + '>'
          + '<td class="center"><b class="bs-rank-num">' + r2.rank + '</b></td>'
          + '<td class="bs-team-name">' + esc(r2.name) + '</td>'
          + '<td class="bs-team-org">' + esc(r2.org) + '</td>'
          + '<td class="center">' + r2.played + '</td>'
          + '<td class="center bs-w">' + r2.won + '</td>'
          + '<td class="center bs-d">' + r2.drawn + '</td>'
          + '<td class="center bs-l">' + r2.lost + '</td>'
          + '<td class="center">' + r2.gf + '</td>'
          + '<td class="center">' + r2.ga + '</td>'
          + '<td class="center bs-gd">' + (r2.gd>=0?'+':'') + r2.gd + '</td>'
          + '<td class="center bs-pts"><b>' + r2.pts + '</b></td>'
          + '</tr>';
      }).join('');
      var qualMatches = db.matches.filter(function(m){return m.groupId===gId && m.stage==='qualifying' && !m.archived;});
      var qualDone = qualMatches.filter(function(m){ return m.score && typeof m.score.red === 'number' && typeof m.score.blue === 'number'; }).length;
      return {
        title: esc(grp?grp.name:'') + ' · 资格赛实时排名',
        body: '<table class="tbl bs-rank-table"><thead><tr>'
          + '<th class="center">排名</th><th>队伍</th><th>学校</th>'
          + '<th class="center">场次</th><th class="center">胜</th><th class="center">平</th><th class="center">负</th>'
          + '<th class="center">进球</th><th class="center">失球</th><th class="center">净胜</th><th class="center">积分</th>'
          + '</tr></thead><tbody>' + (rows || '<tr><td colspan="11" class="empty-state">本组暂无比赛</td></tr>') + '</tbody></table>',
        side: '<h3 style="color:#fbbf24">资格赛进度</h3><div style="font-size:32px;font-weight:700;color:#fff">' + qualDone + ' / ' + qualMatches.length + '</div><div class="text-muted mt-2">已录入比分 / 全部资格赛比赛</div>'
      };
    }
    function buildKoTree(gId){
      var grp = groups.find(function(g){return g.id===gId;});
      var N = grp ? (grp.knockoutSize||0) : 0;
      var ko = db.matches.filter(function(m){return m.groupId===gId && m.stage!=='qualifying' && !m.archived;});
      var lockedKO = ko.filter(function(m){return m.status==='locked'||m.status==='confirmed';}).length;
      function tName(id){ var t = db.teams.find(function(x){return x.id===id;}); return t ? t.name : '待定'; }
      function card(m){
        var sc = m.score ? (m.score.red + ' : ' + m.score.blue) : '— : —';
        return '<div class="bs-ko-card">'
          + '<span class="tname red-name">' + esc(tName(m.redTeamId)) + '</span>'
          + '<span class="sc">' + sc + '</span>'
          + '<span class="tname blue-name">' + esc(tName(m.blueTeamId)) + '</span>'
          + '</div>';
      }
      var koMain = ko.filter(function(m){return m.stage==='knockout';});
      var finalList = ko.filter(function(m){return m.stage==='final';}).sort(function(a,b){ return (a.matchIndex||0)-(b.matchIndex||0); });
      var thirdList = ko.filter(function(m){return m.stage==='third';}).sort(function(a,b){ return (a.matchIndex||0)-(b.matchIndex||0); });
      var body;
      if(koMain.length === 0 && finalList.length === 0 && thirdList.length === 0){
        body = '<div class="empty-state">尚未生成淘汰赛对阵</div>';
      } else {
        // 6.9.2 对阵树：16强赛 → 8强赛 → 4强赛 → 决赛列（冠亚军决赛在上、季军赛在下）
        var roundNums = koMain.map(function(m){return m.round||1;}).filter(function(v,i,a){return a.indexOf(v)===i;}).sort(function(a,b){return a-b;});
        body = '<div class="bs-ko-tree">';
        roundNums.forEach(function(rn){
          var list = koMain.filter(function(m){return (m.round||1)===rn;}).sort(function(a,b){ return (a.matchIndex||0)-(b.matchIndex||0); });
          body += '<div class="bs-ko-col"><div class="bs-ko-col-title">' + (N ? koRoundName(rn, N) : ('第' + rn + '轮')) + '</div>'
            + list.map(card).join('') + '</div>';
        });
        body += '<div class="bs-ko-col"><div class="bs-ko-col-title">决赛</div>'
          + '<div class="bs-ko-sub">冠亚军决赛</div>' + (finalList.length ? finalList.map(card).join('') : '<div class="text-muted" style="text-align:center;padding:8px">待定</div>')
          + '<div class="bs-ko-sub">季军赛</div>' + (thirdList.length ? thirdList.map(card).join('') : '<div class="text-muted" style="text-align:center;padding:8px">待定</div>')
          + '</div>';
        body += '</div>';
      }
      return {
        title: esc(grp?grp.name:'') + ' · 淘汰赛对阵',
        body: body,
        side: '<h3 style="color:#fbbf24">淘汰赛进度</h3><div style="font-size:32px;font-weight:700;color:#fff">' + lockedKO + ' / ' + ko.length + '</div><div class="text-muted mt-2">已锁定 / 全部淘汰赛比赛</div>'
      };
    }
    // 6.9.4 冠亚季军：没结果时返回空队名（只显示表头），出结果后更新队名
    function koTop3(gId){
      var grp = groups.find(function(g){return g.id===gId;});
      var fmt = grp ? (grp.finalFormat || 'BO1') : 'BO1';
      var finals = db.matches.filter(function(m){return m.groupId===gId && m.stage==='final' && !m.archived && m.status!=='cancelled';})
        .sort(function(a,b){ return (a.matchIndex||0)-(b.matchIndex||0); });
      var thirds = db.matches.filter(function(m){return m.groupId===gId && m.stage==='third' && !m.archived && m.status!=='cancelled';});
      var played = finals.filter(function(m){ return m.status==='locked'||m.status==='confirmed'||m.status==='modified'; });
      var champion = null, runnerUp = null, third = null;
      if(fmt === 'BO1'){
        var f0 = finals[0];
        if(f0 && f0.winnerTeamId && played.length > 0){
          champion = f0.winnerTeamId;
          runnerUp = f0.redTeamId === champion ? f0.blueTeamId : f0.redTeamId;
        }
      } else {
        var needWins = fmt === 'BO3' ? 2 : 3;
        var wins = {};
        played.forEach(function(m){ if(m.winnerTeamId) wins[m.winnerTeamId] = (wins[m.winnerTeamId]||0) + 1; });
        var a = finals[0] ? finals[0].redTeamId : null, b = finals[0] ? finals[0].blueTeamId : null;
        if(a && (wins[a]||0) >= needWins){ champion = a; runnerUp = b; }
        if(b && (wins[b]||0) >= needWins){ champion = b; runnerUp = a; }
      }
      var t0 = thirds[0];
      if(t0 && t0.winnerTeamId && (t0.status==='locked'||t0.status==='confirmed'||t0.status==='modified')) third = t0.winnerTeamId;
      return { champion:champion, runnerUp:runnerUp, third:third };
    }
    function renderContent(resetScroll){
      var gId = window.__xcemBSSel;
      var t = window.__xcemBSTab === 'ko' ? 'ko' : 'qual';
      var t1 = document.getElementById('bs-tab1');
      var t2 = document.getElementById('bs-tab2');
      if(t1) t1.className = 'bs-tab-btn' + (t==='qual' ? ' active' : '');
      if(t2) t2.className = 'bs-tab-btn' + (t==='ko' ? ' active' : '');
      var sg = document.getElementById('bs-group');
      if(sg) sg.value = gId;
      var pb = document.getElementById('bs-pause');
      if(pb) pb.textContent = window.__xcemBSPaused ? '▶' : '⏸';
      var content = t === 'qual' ? buildRankBody(gId) : buildKoTree(gId);
      var titleEl = document.getElementById('bs-scroll-title');
      var area = document.getElementById('bs-scroll-area');
      var sideP = document.getElementById('bs-side-progress');
      var top3El = document.getElementById('bs-side-top3');
      if(titleEl) titleEl.innerHTML = content.title;
      if(area) area.innerHTML = content.body;
      if(sideP) sideP.innerHTML = content.side;
      if(top3El){
        var top3TitleEl = document.getElementById('bs-side-top3-title');
        if(t === 'ko'){
          // 6.9.4 屏2 冠亚季军：没结果只显示表头不显示队名，出结果后更新
          if(top3TitleEl) top3TitleEl.textContent = '冠亚季军';
          var koT3 = koTop3(gId);
          function medalRow(label, teamId, color, icon){
            var tname = '';
            if(teamId){
              var tt = db.teams.find(function(x){return x.id===teamId;});
              tname = tt ? tt.name : '?';
            }
            return '<div class="bs-medal"><div class="bs-medal-label" style="color:' + color + '">' + icon + ' ' + label + '</div>'
              + '<div class="bs-medal-name">' + esc(tname) + '</div></div>';
          }
          top3El.innerHTML = medalRow('冠军队', koT3.champion, '#fbbf24', '🥇')
            + medalRow('亚军队', koT3.runnerUp, '#cbd5e1', '🥈')
            + medalRow('季军队', koT3.third, '#d97706', '🥉');
        } else {
          if(top3TitleEl) top3TitleEl.textContent = '前 3 名';
          var rr2 = XCEM.Algorithm.computeRanking(db, gId);
          var list2 = rr2.order||[];
          top3El.innerHTML = list2.length === 0 ? '<div class="text-muted">暂无排名</div>'
            : '<div style="font-size:18px;line-height:1.8">' + list2.slice(0,3).map(function(it){
                var tt = db.teams.find(function(x){return x.id===it.teamId;});
                return '<div><span style="color:#fbbf24;font-weight:700;margin-right:8px">#' + it.rank + '</span>' + esc(tt?tt.name:'?') + '</div>';
              }).join('') + '</div>';
        }
      }
      if(resetScroll !== false){
        window.__xcemBSScrollPos = 0;
        window.__xcemBSElapsed = 0;
        window.__xcemBSRefresh = 0;
        window.__xcemBSSpeedCalced = false;
        window.__xcemBSHold = 10;  // 6.9.3 换组别后停 10 秒再开始滚动
        if(area) area.scrollTop = 0;
      }
    }
    renderContent(true);

    // ===== 事件绑定（全部局部更新，不重建整页） =====
    document.getElementById('bs-tab1').onclick = function(){ window.__xcemBSTab = 'qual'; renderContent(true); };
    document.getElementById('bs-tab2').onclick = function(){ window.__xcemBSTab = 'ko'; renderContent(true); };
    document.getElementById('bs-group').onchange = function(){ window.__xcemBSSel = this.value; renderContent(true); };
    document.getElementById('bs-fullscreen').onclick = function(){
      var el = document.querySelector('.bigscreen');
      if(el.requestFullscreen) el.requestFullscreen();
      else if(el.webkitRequestFullscreen) el.webkitRequestFullscreen();
    };
    document.getElementById('bs-popout').onclick = function(){
      var url = location.pathname + '?popup=bigscreen#bigscreen';
      var w = window.open(url, 'XCEM_BigScreen_' + Date.now(), 'width=1280,height=720,menubar=no,toolbar=no,location=no');
      if(!w){ toast('浏览器拦截了弹窗，请允许后重试', 'warn'); return; }
      toast('已在独立窗口打开', 'success');
    };
    document.getElementById('bs-switch-sec').onchange = function(){
      var v = parseInt(this.value);
      if(isNaN(v) || v < 10) v = 10;
      if(v > 600) v = 600;
      window.__xcemBSSwitchSec = v;
      this.value = v;
      window.__xcemBSSpeedCalced = false;  // 切换时间变化后重新自适应滚动速度
    };
    function switchGroup(dir){
      var idx = rotationList.indexOf(window.__xcemBSSel);
      var n = rotationList.length || 1;
      window.__xcemBSSel = rotationList[(idx + dir + n) % n];
      renderContent(true);
    }
    document.getElementById('bs-prev').onclick = function(){ switchGroup(-1); };
    document.getElementById('bs-next').onclick = function(){ switchGroup(1); };
    document.getElementById('bs-pause').onclick = function(){
      window.__xcemBSPaused = !window.__xcemBSPaused;
      var pb = document.getElementById('bs-pause');
      if(pb) pb.textContent = window.__xcemBSPaused ? '▶' : '⏸';
    };
    Array.prototype.forEach.call(document.querySelectorAll('.bs-rot-cb'), function(cb){
      cb.onchange = function(){
        var id = cb.getAttribute('data-id');
        var idx = rotationList.indexOf(id);
        if(cb.checked && idx < 0) rotationList.push(id);
        else if(!cb.checked && idx >= 0) rotationList.splice(idx, 1);
        window.__xcemBSRotList = rotationList.slice();
        if(rotationList.length && rotationList.indexOf(window.__xcemBSSel) < 0){
          window.__xcemBSSel = rotationList[0];
          renderContent(true);
        }
      };
    });

    // ===== 6.9.4 切换引擎：每组显示 switchSec 秒后切换；屏1滚动速度自适应保证时间内滚完全部队伍；屏2静止且每5秒刷新冠亚季军 =====
    if(window.__xcemBsTimer) clearInterval(window.__xcemBsTimer);
    window.__xcemBsTimer = setInterval(function(){
      var hash = location.hash.replace('#','');
      if(hash !== 'bigscreen'){ clearInterval(window.__xcemBsTimer); window.__xcemBsTimer = null; return; }
      if(window.__xcemBSPaused) return;
      var area = document.getElementById('bs-scroll-area');
      var fill = document.querySelector('.bs-progress-fill');
      if(!area) return;
      var sec = parseInt(window.__xcemBSSwitchSec) || 60;
      if(sec < 10) sec = 10;
      if(sec > 600) sec = 600;
      // 组内显示时长（帧计，暂停时冻结）；每 5 秒刷新一次内容更新冠亚季军/排名结果
      window.__xcemBSElapsed = (window.__xcemBSElapsed||0) + 0.05;
      window.__xcemBSRefresh = (window.__xcemBSRefresh||0) + 0.05;
      if(window.__xcemBSRefresh >= 5){
        window.__xcemBSRefresh = 0;
        renderContent(false);
      }
      if(window.__xcemBSTab === 'ko'){
        // 屏2 对阵树静止：时间到切组；期间每 5 秒更新冠亚季军比赛结果
        if(fill) fill.style.width = Math.min(100, window.__xcemBSElapsed / sec * 100) + '%';
        if(window.__xcemBSElapsed >= sec){ switchGroup(1); }
        return;
      }
      // 屏1 换组别后先停留 10 秒（让观众看清顶部），再开始向上滚动
      if(window.__xcemBSHold > 0){
        window.__xcemBSHold -= 0.05;
        if(fill) fill.style.width = '0%';
        if(window.__xcemBSElapsed >= sec){ switchGroup(1); }
        return;
      }
      var maxScroll = area.scrollHeight - area.clientHeight;
      if(maxScroll <= 1){
        // 内容不足一屏：无滚动，时间到切组
        if(fill) fill.style.width = Math.min(100, window.__xcemBSElapsed / sec * 100) + '%';
        if(window.__xcemBSElapsed >= sec){ switchGroup(1); }
        return;
      }
      // 滚动速度自适应：保证在切换时间内刚好滚完全部队伍（10 秒停留不计入）
      if(!window.__xcemBSSpeedCalced){
        var eff = Math.max(sec - 10, 1);
        window.__xcemBSSpeedAuto = maxScroll / eff;
        window.__xcemBSSpeedCalced = true;
      }
      var sp = window.__xcemBSSpeedAuto || 40;
      var pos = (window.__xcemBSScrollPos||0) + sp * 0.05;
      if(pos >= maxScroll){
        // 全部队伍已滚完：停在底部等待切换时间到
        area.scrollTop = maxScroll;
        window.__xcemBSScrollPos = maxScroll;
        if(fill) fill.style.width = '100%';
        if(window.__xcemBSElapsed >= sec){ switchGroup(1); }
        return;
      }
      window.__xcemBSScrollPos = pos;
      area.scrollTop = pos;
      if(fill) fill.style.width = (pos / maxScroll * 100) + '%';
    }, 50);
  }

  // 6.11.1 操作日志：组别内部 ID 翻译为名称（已删除的组显示原始 ID）
  function logGroupLabel(groupId){
    if(!groupId) return '';
    groupId = String(groupId);
    var db = XCEM.Engine.getDb();
    var g = db.groups.find(function(x){return x.id===groupId;});
    return g ? g.name : '（已删除）' + groupId;
  }
  // 6.11.1 操作日志：对象内部 ID 翻译为名称（比赛/队伍/快照）
  function logTargetLabel(target){
    if(!target) return '';
    if(typeof target === 'object') target = target.id || JSON.stringify(target);
    target = String(target); // 6.11.2 历史日志 target 可能非字符串（早期存数字等），统一转字符串防御
    var db = XCEM.Engine.getDb();
    if(target.indexOf('m-') === 0){
      var m = db.matches.find(function(x){return x.id===target;});
      if(!m) return '（已删除）' + target;
      var red = db.teams.find(function(x){return x.id===m.redTeamId;});
      var blue = db.teams.find(function(x){return x.id===m.blueTeamId;});
      var g = db.groups.find(function(x){return x.id===m.groupId;});
      var lbl = (red?red.name:'待定') + ' vs ' + (blue?blue.name:'待定');
      var where = '';
      if(m.venueId){
        var so = venueSlotOrder();
        where = '（' + m.venueId.replace(/^V/,'') + '号场地' + (so.order[m.id]?' 第'+so.order[m.id]+'场':'') + '）';
      }
      return matchStageLabel(m, g ? (g.knockoutSize||0) : 0) + ' · ' + lbl + where;
    }
    if(target.indexOf('tm-') === 0){
      var t = db.teams.find(function(x){return x.id===target;});
      return t ? (t.name + (t.organization?'（'+t.organization+'）':'')) : '（已删除）' + target;
    }
    if(target.indexOf('snap-') === 0) return '排名快照 #' + target.replace(/^snap-/,'');
    return target;
  }
  // 6.11.1 操作日志：before/after 修改前后对比（只显示变化的字段）
  function logDiffHtml(before, after){
    if(!before && !after) return '';
    function isObj(x){ return x && typeof x === 'object'; }
    var keys = {};
    if(isObj(before)) Object.keys(before).forEach(function(k){ keys[k]=1; });
    if(isObj(after)) Object.keys(after).forEach(function(k){ keys[k]=1; });
    if(Object.keys(keys).length === 0){
      return '<div style="border-bottom:1px dashed var(--line);padding-bottom:4px">'
        + '<b>' + esc(JSON.stringify(before)) + '</b> → <b>' + esc(JSON.stringify(after)) + '</b></div>';
    }
    var html = '';
    Object.keys(keys).forEach(function(k){
      var b = before ? before[k] : undefined;
      var a = after ? after[k] : undefined;
      if(JSON.stringify(b) === JSON.stringify(a)) return;
      function fmt(v){
        if(v === undefined) return '<span class="text-muted">（无）</span>';
        if(isObj(v)) return '<pre style="margin:0;font-size:11px;max-height:120px;overflow:auto">' + esc(JSON.stringify(v, null, 1)) + '</pre>';
        return '<b>' + esc(String(v)) + '</b>';
      }
      html += '<div style="margin-bottom:6px;border-bottom:1px dashed var(--line);padding-bottom:4px">'
        + '<span style="color:var(--muted);font-size:12px">' + esc(k) + '</span> ' + fmt(b) + ' → ' + fmt(a) + '</div>';
    });
    return html || '<div class="text-muted">无字段变化</div>';
  }
  // 6.11.1 操作日志：详情弹窗（时间/类型/组别/对象/原因/备注/附加信息/前后对比）
  function openLogDetail(a){
    var root = document.getElementById('modal-root');
    var m = document.createElement('div');
    m.className = 'modal-backdrop';
    var extraHtml = '';
    if(a.extra && Object.keys(a.extra).length){
      extraHtml = '<div class="field"><label>附加信息</label><pre style="max-height:160px;overflow:auto;background:#f8fafc;padding:8px;border-radius:6px">' + esc(JSON.stringify(a.extra, null, 2)) + '</pre></div>';
    }
    m.innerHTML = '<div class="modal" style="max-width:760px">'
      + '<h3>📄 日志详情</h3>'
      + '<div class="body">'
      +   '<div class="field"><label>时间</label><div>' + esc(new Date(a.ts).toLocaleString()) + '</div></div>'
      +   '<div class="field"><label>类型</label><div>' + esc(a.action) + '</div></div>'
      +   '<div class="field"><label>组别</label><div>' + esc(logGroupLabel(a.groupId)) + '</div></div>'
      +   '<div class="field"><label>对象</label><div>' + esc(logTargetLabel(a.target)) + '</div></div>'
      +   (a.reason ? '<div class="field"><label>原因</label><div class="text-warn">' + esc(a.reason) + '</div></div>' : '')
      +   (a.note ? '<div class="field"><label>备注</label><div>' + esc(a.note) + '</div></div>' : '')
      +   extraHtml
      +   '<div class="field"><label>修改前后对比</label>' + (logDiffHtml(a.before, a.after) || '<div class="text-muted">无</div>') + '</div>'
      + '</div>'
      + '<div class="footer"><button class="btn" id="ld-close">关闭</button></div></div>';
    root.appendChild(m);
    m.querySelector('#ld-close').onclick = function(){ if(m.parentNode) m.parentNode.removeChild(m); };
  }

  function pageLog(){
    var db = XCEM.Engine.getDb();
    var log = db.audit.slice().reverse();
    var rows = log.map(function(a){
      var hasDetail = !!(a.before || a.after || a.note || a.reason || (a.extra && Object.keys(a.extra).length));
      return '<tr>'
        + '<td class="text-muted">' + esc(new Date(a.ts).toLocaleString()) + '</td>'
        + '<td><span class="pill gray">' + esc(a.action) + '</span></td>'
        + '<td>' + esc(logGroupLabel(a.groupId)) + '</td>'
        + '<td>' + esc(logTargetLabel(a.target)) + '</td>'
        + '<td>' + (a.reason?'<span class="text-warn">' + esc(a.reason) + '</span>':'') + '</td>'
        + '<td class="center">' + (hasDetail ? '<button class="btn btn-xs" data-log-id="' + esc(a.id) + '">详情</button>' : '<span class="text-muted">—</span>') + '</td>'
        + '</tr>';
    }).join('');
    var html = ''
      + '<h1>操作日志</h1><p class="sub">所有重要操作都会被记录，包括修改前/后值与原因；点击"详情"查看前后对比</p>'
      + '<div class="panel"><h2>所有日志 <span class="meta">共 ' + log.length + ' 条</span></h2>'
      +   '<div class="table-wrap" style="max-height:600px;overflow:auto"><table class="tbl"><thead><tr><th>时间</th><th>类型</th><th>组别</th><th>对象</th><th>原因</th><th class="center">详情</th></tr></thead><tbody>'
      +   (rows || '<tr><td colspan="6" class="empty-state">无日志</td></tr>') + '</tbody></table></div>'
      +   '<div class="btn-row mt-2">'
      +     '<button class="btn" id="btn-export-log">📥 导出日志 CSV</button>'
      +   '</div>'
      +   '<div class="alert info mt-2">日志不可由普通页面操作直接删除，是数据可追溯的依据。</div>'
      + '</div>';
    setMain(html);
    Array.prototype.forEach.call(document.querySelectorAll('[data-log-id]'), function(btn){
      btn.onclick = function(){
        var a = log.find(function(x){ return x.id === btn.getAttribute('data-log-id'); });
        if(a) openLogDetail(a);
      };
    });
    document.getElementById('btn-export-log').onclick = function(){
      var csv = '时间,类型,组别,对象,原因,备注\n';
      log.forEach(function(a){
        csv += [a.ts, a.action, logGroupLabel(a.groupId), logTargetLabel(a.target), (a.reason||'').replace(/"/g,'""'), (a.note||'').replace(/"/g,'""')].map(function(x){return '"' + String(x).replace(/"/g,'""') + '"';}).join(',') + '\n';
      });
      var blob = new Blob(['\ufeff'+csv], { type:'text/csv;charset=utf-8' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');

/* =============================================================
   XCEM.Diag — 内置自检测试（不污染主数据，使用虚拟库）
   ============================================================= */
XCEM.Diag = (function(){
  var pass = 0, fail = 0;
  var log = [];

  function esc(s){
    if(s === undefined || s === null) return '';
    return String(s).replace(/[&<>"']/g, function(c){
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }

  function makeDb(){
    var db = XCEM.Model.defaults();
    db.event.passwordHash = XCEM.Crypto.hash('test123');
    return db;
  }

  function assert(name, cond, detail){
    if(cond){ pass++; log.push({ ok:true, name:name, detail:detail||'' }); }
    else    { fail++; log.push({ ok:false, name:name, detail:detail||'' }); }
  }

  function makeGroupWithTeams(db, n){
    var gid = 'g-' + Date.now() + '-' + Math.floor(Math.random()*1e6);
    db.groups.push({ id:gid, name:'测试组', enabled:true, qualifyingMatchesPerTeam:2, knockoutSize:16, invitedQuota:0, venueAssign:[], finalFormat:'BO1' });
    for(var i=0; i<n; i++){
      db.teams.push({ id:'t'+i, groupId:gid, name:'队'+(i+1), organization:'', drawNumber:i+1, isInvited:i<0, status:'normal', note:'' });
    }
    db.counters.teamSeq = Math.max(db.counters.teamSeq||0, n);
    return gid;
  }

  function runDraw(db, gid, seed){
    var order = db.teams.filter(function(t){return t.groupId===gid;}).map(function(t){return t.id;});
    var r = XCEM.Algorithm.drawShuffle(order, seed);
    db.draws[gid] = { order:r.order, randomSeed:r.seed, createdAt:new Date().toISOString(), redrawCount:1 };
    order.forEach(function(id, i){
      var t = db.teams.find(function(x){return x.id===id;});
      if(t) t.drawNumber = i+1;
    });
    return r.order;
  }

  function run(){
    pass = 0; fail = 0; log = [];
    // 备份真实库，测试结束恢复，避免测试数据污染用户数据
    var realDb = XCEM.Engine.getDb() || XCEM.Model.defaults();
    // T1: 抽签可复现
    {
      var db = makeDb();
      var gid = makeGroupWithTeams(db, 8);
      var o1 = runDraw(db, gid, 12345);
      var o2 = runDraw(db, gid, 12345);
      assert('T1 抽签可复现：相同种子 → 相同顺序', JSON.stringify(o1)===JSON.stringify(o2));
    }
    // T2: 资格赛环形生成 - N 场比赛
    {
      var db = makeDb();
      [2,3,4,5,6,8,16].forEach(function(n){
        var gid = makeGroupWithTeams(db, n);
        runDraw(db, gid, 7);
        var matches = XCEM.Algorithm.genQualifyingMatches(db, gid);
        // 环形生成：N=2 → 1 场（A0-A1）；N>=3 → N 场
        var expected = n === 2 ? 1 : n;
        assert('T2 资格赛环形 N=' + n + ' 队 → ' + expected + ' 场', matches.length === expected, 'got=' + matches.length);
        // 每队恰好 playCount 场（默认 2），N=2 时每队 1 场，N>=3 时每队 2 场
        var expectedPerTeam = n === 2 ? 1 : 2;
        var counts = {};
        matches.forEach(function(m){
          counts[m.redTeamId] = (counts[m.redTeamId]||0)+1;
          counts[m.blueTeamId] = (counts[m.blueTeamId]||0)+1;
        });
        var allMatch = Object.keys(counts).length === n && Object.keys(counts).every(function(k){return counts[k]===expectedPerTeam;});
        assert('T2 资格赛 N=' + n + ' 每队恰好 ' + expectedPerTeam + ' 场', allMatch);
      });
    }
    // T3: 排名规则 - 8 级
    {
      var db = makeDb();
      var gid = makeGroupWithTeams(db, 4);
      var order = runDraw(db, gid, 1);
      // 创建 4 场比赛：1-2, 2-3, 3-4, 4-1
      var matches = XCEM.Algorithm.genQualifyingMatches(db, gid);
      matches.forEach(function(p, idx){
        db.matches.push({
          id:'m'+idx, groupId:gid, stage:'qualifying', round:1, matchIndex:idx+1,
          redTeamId:p.redTeamId, blueTeamId:p.blueTeamId,
          status:'locked', result:'red_win', score:{red:3,blue:0},
          manualLock:false, goldenGoal:false, deathPenalty:false,
          winnerTeamId:p.redTeamId, confirmedAt:new Date().toISOString()
        });
      });
      var r = XCEM.Algorithm.computeRanking(db, gid);
      assert('T3 排名生成 4 条', r.order.length === 4);
      // 验证第 1 名 1 胜 1 负 3 分（N=4 队时环形每队实际只打 2 场：1胜1负=3分）
      var topTeamId = r.order[0].teamId;
      var topStat = r.stats[topTeamId];
      assert('T3 第 1 名积分=3、胜 1 负 1（环形 N=4）', topStat.pts === 3 && topStat.won === 1 && topStat.lost === 1, JSON.stringify(topStat));
    }
    // T-R1: 排名稳定性 - 4 队，pts 各异但第一的净胜球一定最大
    {
      var db = makeDb();
      var gid = makeGroupWithTeams(db, 4);
      var order = runDraw(db, gid, 1);
      var teams = db.teams.filter(function(t){return t.groupId===gid;}).sort(function(a,b){return (a.name||'').localeCompare(b.name||'');});
      var A = teams[0].id, B = teams[1].id, C = teams[2].id, D = teams[3].id;
      // 6 场比赛，A 赢所有，B 赢 C D，C 赢 D，D 全输
      // A vs B: 3:1 A胜; B vs C: 3:1 B胜; C vs D: 3:1 C胜
      // A vs C: 2:1 A胜; B vs D: 2:1 B胜
      // A vs D: 5:0 A胜
      var ms = [
        [A,B,3,1],[B,C,3,1],[C,D,3,1],
        [A,C,2,1],[B,D,2,1],
        [A,D,5,0]
      ];
      ms.forEach(function(p, idx){
        db.matches.push({
          id:'mr'+idx, groupId:gid, stage:'qualifying', round:1, matchIndex:idx+1,
          redTeamId:p[0], blueTeamId:p[1], status:'locked',
          result:p[2]>p[3]?'red_win':'blue_win',
          score:{red:p[2], blue:p[3]}, manualLock:false,
          goldenGoal:false, deathPenalty:false,
          winnerTeamId:p[2]>p[3]?p[0]:p[1],
          confirmedAt:new Date().toISOString()
        });
      });
      var rr = XCEM.Algorithm.computeRanking(db, gid);
      assert('T-R1 ranking 4 队全部排名', rr.order.length === 4, JSON.stringify(rr.order.map(function(o){return o.teamId+'#'+o.rank;})));
      // A 全胜 9 分 pts 最高，净胜球也应最大
      var allStats = rr.stats;
      var maxGd = Object.keys(allStats).map(function(id){return allStats[id].gd;}).reduce(function(a,b){return Math.max(a,b);});
      assert('T-R1 第一名净胜球为该组最大', allStats[rr.order[0].teamId].gd === maxGd, 'max='+maxGd+' top='+allStats[rr.order[0].teamId].gd);
      // 第一名应该是 A
      assert('T-R1 第一名 = 全胜 A', rr.order[0].teamId === A, 'top='+rr.order[0].teamId+' expected='+A);
    }
    // T-R2: 排名修复回归 —— 积分不同但净胜球相同，低分队后续标准更优也不能超越高分队（BUG-3）
    {
      var db = makeDb();
      var gid = makeGroupWithTeams(db, 4);
      runDraw(db, gid, 1);
      var teams = db.teams.filter(function(t){return t.groupId===gid;}).sort(function(a,b){return a.drawNumber-b.drawNumber;});
      var A = teams[0].id, B = teams[1].id, C = teams[2].id, D = teams[3].id;
      // 环形 4 场：A-B, B-C, C-D, D-A
      // A: 4分 gd+1 gf1；B: 3分 gd+1 gf11；C: 3分 gd0；D: 1分 gd-1
      // 旧算法按净胜球分组会把 A(4分) 与 B(3分) 混组，再按总进球把 B 排到 A 前面 → 违反积分优先
      var ms = [
        [A,B,1,0,'red_win'],
        [B,C,11,9,'red_win'],
        [C,D,2,1,'red_win'],
        [D,A,0,0,'draw']
      ];
      ms.forEach(function(p, idx){
        db.matches.push({
          id:'mr2'+idx, groupId:gid, stage:'qualifying', round:1, matchIndex:idx+1,
          redTeamId:p[0], blueTeamId:p[1], status:'locked',
          result:p[4], score:{red:p[2], blue:p[3]}, manualLock:false,
          goldenGoal:false, deathPenalty:false,
          winnerTeamId:(p[4]==='red_win'?p[0]:(p[4]==='blue_win'?p[1]:null)),
          confirmedAt:new Date().toISOString()
        });
      });
      var rr = XCEM.Algorithm.computeRanking(db, gid);
      var ids = rr.order.map(function(o){return o.teamId;});
      assert('T-R2 积分优先：4 分的 A 排在 3 分的 B 之前', ids[0] === A, 'top=' + ids[0] + ' expected=' + A + ' order=' + ids.join(','));
      assert('T-R2 同分 B/C 按净胜球细分：B(gd+1) 在 C(gd0) 前', ids.indexOf(B) < ids.indexOf(C), 'order=' + ids.join(','));
    }
    // T-R3: 第 3 级总进球细分 —— pts/gd 相同的两队按 gf 区分
    {
      var db = makeDb();
      var gid = makeGroupWithTeams(db, 4);
      runDraw(db, gid, 1);
      var teams = db.teams.filter(function(t){return t.groupId===gid;}).sort(function(a,b){return a.drawNumber-b.drawNumber;});
      var A = teams[0].id, B = teams[1].id, C = teams[2].id, D = teams[3].id;
      // A: 4分 gd+1 gf4；B: 4分 gd+1 gf3；h2h A-B 1:1 平 → 只能靠 gf 区分
      var ms = [
        [A,B,1,1,'draw'],
        [B,C,2,1,'red_win'],
        [C,D,2,1,'red_win'],
        [D,A,2,3,'blue_win']
      ];
      ms.forEach(function(p, idx){
        db.matches.push({
          id:'mr3'+idx, groupId:gid, stage:'qualifying', round:1, matchIndex:idx+1,
          redTeamId:p[0], blueTeamId:p[1], status:'locked',
          result:p[4], score:{red:p[2], blue:p[3]}, manualLock:false,
          goldenGoal:false, deathPenalty:false,
          winnerTeamId:(p[4]==='red_win'?p[0]:(p[4]==='blue_win'?p[1]:null)),
          confirmedAt:new Date().toISOString()
        });
      });
      var rr = XCEM.Algorithm.computeRanking(db, gid);
      var ids = rr.order.map(function(o){return o.teamId;});
      assert('T-R3 总进球细分：gf4 的 A 在 gf3 的 B 前', ids[0] === A && ids[1] === B, 'order=' + ids.join(','));
    }
    // T-R4: 第 4 级相互比赛生效 —— pts/gd/gf/ga 全同的两队，相互交手战绩决定名次（BUG-4）
    {
      var db = makeDb();
      var gid = makeGroupWithTeams(db, 6);
      runDraw(db, gid, 1);
      var teams = db.teams.filter(function(t){return t.groupId===gid;}).sort(function(a,b){return a.drawNumber-b.drawNumber;});
      var A = teams[0].id, B = teams[1].id, C = teams[2].id, D = teams[3].id, E = teams[4].id, F = teams[5].id;
      // 环形 6 场。D 与 E 战绩全同（3分 gd0 gf3 ga3），但 D 2:1 胜 E → 相互比赛 D 应在前
      // 人为让 E 抽签号 < D，若 h2h 失效而靠抽签，会错把 E 排在前面
      db.teams.find(function(x){return x.id===E;}).drawNumber = 1;
      db.teams.find(function(x){return x.id===D;}).drawNumber = 2;
      var ms = [
        [A,B,3,0,'red_win'],
        [B,C,3,2,'red_win'],
        [C,D,2,1,'red_win'],
        [D,E,2,1,'red_win'],
        [E,F,2,1,'red_win'],
        [F,A,3,2,'red_win']
      ];
      ms.forEach(function(p, idx){
        db.matches.push({
          id:'mr4'+idx, groupId:gid, stage:'qualifying', round:1, matchIndex:idx+1,
          redTeamId:p[0], blueTeamId:p[1], status:'locked',
          result:p[4], score:{red:p[2], blue:p[3]}, manualLock:false,
          goldenGoal:false, deathPenalty:false,
          winnerTeamId:(p[4]==='red_win'?p[0]:(p[4]==='blue_win'?p[1]:null)),
          confirmedAt:new Date().toISOString()
        });
      });
      var rr = XCEM.Algorithm.computeRanking(db, gid);
      var ids = rr.order.map(function(o){return o.teamId;});
      assert('T-R4 相互比赛生效：D(2:1 胜 E) 在 E 之前', ids.indexOf(D) < ids.indexOf(E), 'order=' + ids.join(','));
    }
    // T4: 抽签破同分
    {
      var db = makeDb();
      var gid = makeGroupWithTeams(db, 4);
      runDraw(db, gid, 1);
      // 4 场全部 1:1 平
      var teams = db.teams.filter(function(t){return t.groupId===gid;}).sort(function(a,b){return a.drawNumber-b.drawNumber;});
      var matches = [
        { redTeamId:teams[0].id, blueTeamId:teams[1].id },
        { redTeamId:teams[1].id, blueTeamId:teams[2].id },
        { redTeamId:teams[2].id, blueTeamId:teams[3].id },
        { redTeamId:teams[3].id, blueTeamId:teams[0].id }
      ];
      matches.forEach(function(p, idx){
        db.matches.push({
          id:'m'+idx, groupId:gid, stage:'qualifying', round:1, matchIndex:idx+1,
          redTeamId:p.redTeamId, blueTeamId:p.blueTeamId,
          status:'locked', result:'draw', score:{red:1,blue:1},
          manualLock:false, goldenGoal:false, deathPenalty:false,
          confirmedAt:new Date().toISOString()
        });
      });
      var r = XCEM.Algorithm.computeRanking(db, gid);
      assert('T4 全平局 → 抽签破同分生效', r.hasLot === true);
      // 验证排名是按抽签号
      var correctOrder = teams.map(function(t){return t.id;});
      var gotOrder = r.order.map(function(o){return o.teamId;});
      assert('T4 全平局后顺序按抽签号升序', JSON.stringify(correctOrder)===JSON.stringify(gotOrder));
    }
    // T5: 特邀名额释放 - K=0/1/2/4
    {
      // N=16, M=4, R0=12
      // K=0: R=12, E=4
      // K=1: R=13, E=3
      // K=2: R=14, E=2
      // K=4: R=16, E=0
      [0,1,2,4].forEach(function(K){
        var db = makeDb();
        var gid = makeGroupWithTeams(db, 16);
        db.groups.find(function(g){return g.id===gid;}).invitedQuota = 4;
        // 让前 K 名是特邀
        for(var i=0; i<K; i++) db.teams[i].isInvited = true;
        // 给所有队同样的 0:0 平局（这样排名完全靠抽签号），但保证前 K 名内的队伍获胜不实际 - 让我们做更精细：
        // 我们用完全平局的抽签顺序，但把"自然晋级"的特邀设为前 K 名
        // 但若全平局，rank 取决于 drawNumber；我们想测的是"前 R0 中有 K 个特邀"
        // 构造：让前 K 名赢 2 场、其他队平局，确保前 R0 名（前 K+其余队伍）按战绩确定
        // 简化：让全部 16 队打平 → 排名完全按抽签号 → 前 K 名是特邀 iff K <= R0
        runDraw(db, gid, 99);
        var teams = db.teams.filter(function(t){return t.groupId===gid;}).sort(function(a,b){return a.drawNumber-b.drawNumber;});
        // 创建 16 场比赛（环形）
        for(var i=0; i<16; i++){
          var a = teams[i].id, b = teams[(i+1)%16].id;
          db.matches.push({
            id:'m'+i, groupId:gid, stage:'qualifying', round:1, matchIndex:i+1,
            redTeamId:a, blueTeamId:b, status:'locked', result:'draw', score:{red:1,blue:1},
            manualLock:false, goldenGoal:false, deathPenalty:false,
            confirmedAt:new Date().toISOString()
          });
        }
        var adv = XCEM.Algorithm.computeAdvancement(db, gid);
        var expectedK = K;
        assert('T5 K='+K+' adv.ok', adv.ok === true);
        assert('T5 K='+K+' K=' + expectedK + ' 计算正确', adv.K === expectedK, 'got=' + adv.K);
        var expectedE = 4 - K;
        assert('T5 K='+K+' E=' + expectedE + ' 计算正确', adv.E === expectedE, 'got=' + adv.E);
        var expectedR = 12 + K;
        assert('T5 K='+K+' R=' + expectedR, adv.R === expectedR, 'got=' + adv.R);
        assert('T5 K='+K+' final 16 队', adv.final.length === 16);
        // 验证无重复
        var seen = {};
        var dup = adv.final.some(function(id){ if(seen[id]) return true; seen[id]=1; return false; });
        assert('T5 K='+K+' final 无重复', !dup);
      });
    }
    // T6: 淘汰赛对阵
    {
      [4,8,16].forEach(function(N){
        var db = makeDb();
        var gid = makeGroupWithTeams(db, N);
        var r = runDraw(db, gid, 1);
        // 创建一个模拟晋级结果
        var seq = [];
        for(var i=0; i<N; i++) seq.push({ seed:i+1, teamId:db.teams[i].id });
        var matches = XCEM.Algorithm.genKnockoutFirstRound(db, gid, { ok:true, seq:seq, N:N });
        assert('T6 N='+N+' 首轮 N/2 场', matches.length === N/2);
        // 第一场 vs 最后一场
        var first = matches[0];
        assert('T6 N='+N+' 首场：种子 1 vs N', (first.redSeed===1 && first.blueSeed===N) || (first.redSeed===N && first.blueSeed===1));
      });
    }
    // T-KO1: 决赛填充已有占位场（BUG-5 回归）——半决赛锁定后生成决赛，不得新建第二个决赛
    {
      var db = makeDb();
      var gid = makeGroupWithTeams(db, 4);
      db.groups.find(function(g){return g.id===gid;}).knockoutSize = 4;
      runDraw(db, gid, 1);
      // 构造 4 场全平资格赛 → 排名按抽签号 → 晋级算法可运行
      var teams = db.teams.filter(function(t){return t.groupId===gid;}).sort(function(a,b){return a.drawNumber-b.drawNumber;});
      for(var i=0; i<4; i++){
        var a = teams[i].id, b = teams[(i+1)%4].id;
        db.matches.push({
          id:'mkq'+i, groupId:gid, stage:'qualifying', round:1, matchIndex:i+1,
          redTeamId:a, blueTeamId:b, status:'locked', result:'draw', score:{red:1,blue:1},
          manualLock:false, goldenGoal:false, deathPenalty:false,
          confirmedAt:new Date().toISOString()
        });
      }
      XCEM.Engine.setDb(db);
      var gk = XCEM.Engine.generateKnockout(gid);
      assert('T-KO1 生成淘汰赛成功', gk.ok, JSON.stringify(gk));
      var finalSlots = db.matches.filter(function(m){return m.groupId===gid && m.stage==='final' && !m.archived;});
      assert('T-KO1 初始仅 1 个决赛占位场', finalSlots.length === 1, 'finals=' + finalSlots.length);
      // 锁定两场半决赛并设胜者
      var koR1 = db.matches.filter(function(m){return m.groupId===gid && m.stage==='knockout' && !m.archived;});
      koR1.forEach(function(m){
        m.status = 'locked';
        m.winnerTeamId = m.redTeamId;
        m.result = 'red_win';
        m.score = { red:2, blue:0 };
        m.confirmedAt = new Date().toISOString();
      });
      var nr = XCEM.Engine.generateNextRound(gid);
      assert('T-KO1 生成决赛成功', nr.ok, JSON.stringify(nr));
      finalSlots = db.matches.filter(function(m){return m.groupId===gid && m.stage==='final' && !m.archived;});
      assert('T-KO1 决赛仍只有 1 场（填充占位而非新建）', finalSlots.length === 1, 'finals=' + finalSlots.length);
      assert('T-KO1 决赛已填入双方队伍', !!finalSlots[0].redTeamId && !!finalSlots[0].blueTeamId, JSON.stringify(finalSlots[0]));
      var thirdSlots = db.matches.filter(function(m){return m.groupId===gid && m.stage==='third' && !m.archived;});
      assert('T-KO1 季军赛已填入双方队伍', !!thirdSlots[0].redTeamId && !!thirdSlots[0].blueTeamId, JSON.stringify(thirdSlots[0]));
      XCEM.Engine.setDb(realDb);
    }
    // T7: 场地排程 - 每队最小休息
    {
      var db = makeDb();
      db.settings.venuesCount = 2;
      db.settings.restGap = 1;
      var gid = makeGroupWithTeams(db, 4);
      runDraw(db, gid, 1);
      // 生成 4 场
      var matches = XCEM.Algorithm.genQualifyingMatches(db, gid);
      matches.forEach(function(p, idx){
        db.matches.push({
          id:'m'+idx, groupId:gid, stage:'qualifying', round:1, matchIndex:idx+1,
          redTeamId:p.redTeamId, blueTeamId:p.blueTeamId,
          status:'pending', score:{red:0,blue:0}, result:null,
          manualLock:false, goldenGoal:false, deathPenalty:false
        });
      });
      XCEM.Algorithm.autoSchedule(db, gid);
      // 检查每队相邻比赛间隔：队伍的下一次比赛slot必须 >= 上一次slot + 1 + restGap
      var teamLast = {};
      var ok = true;
      var sorted = db.matches.filter(function(m){return m.groupId===gid;}).slice().sort(function(a,b){
        return (parseInt(String(a.scheduledTime).replace(/[^\d]/g,''))||0) - (parseInt(String(b.scheduledTime).replace(/[^\d]/g,''))||0);
      });
      sorted.forEach(function(m){
        var t1 = parseInt(String(m.scheduledTime).replace(/[^\d]/g,''))||0;
        var lt1 = teamLast[m.redTeamId];
        var lt2 = teamLast[m.blueTeamId];
        var minSlot = 1 + db.settings.restGap; // 至少空 restGap 场
        if(lt1 !== undefined && t1 - lt1 < minSlot) ok = false;
        if(lt2 !== undefined && t1 - lt2 < minSlot) ok = false;
        teamLast[m.redTeamId] = t1;
        teamLast[m.blueTeamId] = t1;
      });
      assert('T7 场地排程遵守最小休息间隔（每队间隔 ≥ restGap+1 个时间槽）', ok);
    }
    // T8: 状态机 - 已锁定比赛修改需原因
    {
      var db = makeDb();
      var gid = makeGroupWithTeams(db, 2);
      runDraw(db, gid, 1);
      db.matches.push({
        id:'m1', groupId:gid, stage:'qualifying', round:1, matchIndex:1,
        redTeamId:db.teams[0].id, blueTeamId:db.teams[1].id,
        status:'locked', result:'red_win', score:{red:3,blue:0},
        manualLock:false, goldenGoal:false, deathPenalty:false,
        winnerTeamId:db.teams[0].id, confirmedAt:new Date().toISOString()
      });
      XCEM.Log.add(db, 'match.confirm', { groupId:gid, target:'m1' });
      // 无原因时 updateMatch 应失败
      var r1 = XCEM.Algorithm.updateMatchLocked(db, 'm1', { score:{red:5,blue:0} }, '');
      assert('T8 锁定比赛无原因修改被拒绝', !r1.ok && r1.reason === 'reason_required');
      // 有原因时通过
      var r2 = XCEM.Algorithm.updateMatchLocked(db, 'm1', { score:{red:5,blue:0} }, '裁判判定');
      assert('T8 锁定比赛有原因修改成功', r2.ok);
    }
    // T9: 赛中弃权 - 取消后续资格
    {
      var db = makeDb();
      var gid = makeGroupWithTeams(db, 4);
      runDraw(db, gid, 1);
      XCEM.Algorithm.genQualifyingMatches(db, gid).forEach(function(p, idx){
        db.matches.push({
          id:'m'+idx, groupId:gid, stage:'qualifying', round:1, matchIndex:idx+1,
          redTeamId:p.redTeamId, blueTeamId:p.blueTeamId,
          status:'pending', score:{red:0,blue:0}, result:null,
          manualLock:false, goldenGoal:false, deathPenalty:false
        });
      });
      var target = db.teams[0];
      XCEM.Engine.setDb(db);
      XCEM.Engine.disqualifyTeam(target.id, '赛中弃权');
      var after = db.matches.filter(function(m){return m.groupId===gid;});
      var cancelled = after.filter(function(m){return m.status==='cancelled';}).length;
      assert('T9 赛中弃权 → 后续比赛取消', cancelled > 0, 'cancelled=' + cancelled);
      assert('T9 队伍状态=disqualified', target.status === 'disqualified_after_play');
    }
    // T10: 密码验证
    {
      var db = makeDb();
      // 该 db 已设置 passwordHash = test123 的 hash
      XCEM.Engine.setDb(db);
      var r1 = XCEM.Engine.unlock('wrong');
      assert('T10 错误密码拒绝', !r1.ok && r1.reason === 'wrong_pwd');
      var r2 = XCEM.Engine.unlock('test123');
      assert('T10 正确密码通过', r2.ok);
      // 恢复 Engine 默认 db，避免污染后续
      var fresh = makeDb();
      XCEM.Engine.setDb(fresh);
    }
    // T-V1: 1.1+2.1 validateGroup 校验组别配置
    {
      var db = makeDb();
      var gid = makeGroupWithTeams(db, 4);
      // 加 4 支普通队（默认 isInvited=false），设 M=2 触发不一致
      var grp = db.groups.find(function(g){return g.id===gid;});
      grp.invitedQuota = 2;
      XCEM.Engine.setDb(db);
      var r = XCEM.Engine.validateGroup(gid);
      assert('T-V1 特邀 M!=实际 → 不通过', !r.ok && r.errors.some(function(e){return e.code==='invited_mismatch';}));
      // 改 M=0，应通过
      grp.invitedQuota = 0;
      var r2 = XCEM.Engine.validateGroup(gid);
      assert('T-V1 特邀 M=实际 → 通过', r2.ok, JSON.stringify(r2.errors));
      // 加 1 支特邀复测不通过
      db.teams[0].isInvited = true;
      var r3 = XCEM.Engine.validateGroup(gid);
      assert('T-V1 特邀 M=0 但实际=1 → 不通过', !r3.ok && r3.errors.some(function(e){return e.code==='invited_mismatch';}));
      var fresh = makeDb();
      XCEM.Engine.setDb(fresh);
    }
    // T-V2: validateGroup 重名检测
    {
      var db = makeDb();
      var gid = makeGroupWithTeams(db, 4);
      db.teams[1].name = db.teams[0].name;
      db.teams[1].organization = db.teams[0].organization || '';
      XCEM.Engine.setDb(db);
      var r = XCEM.Engine.validateGroup(gid);
      assert('T-V2 同组重名 → 不通过', !r.ok && r.errors.some(function(e){return e.code==='dup_team';}));
      var fresh = makeDb();
      XCEM.Engine.setDb(fresh);
    }
    // T-EXP1: 5.1 exportTeamsTemplate 导出可解析
    {
      var db = makeDb();
      var gid = makeGroupWithTeams(db, 4);
      XCEM.Engine.setDb(db);
      var csv = XCEM.Engine.exportTeamsTemplate(gid);
      assert('T-EXP1 导出含 BOM 且含表头', csv.indexOf('\ufeff') === 0 && csv.indexOf('抽签号') >= 0, 'csv head=' + csv.substring(0, 40));
      var lines = csv.split('\r\n');
      assert('T-EXP1 导出 1 表头 + 4 队伍', lines.length === 5, 'lines=' + lines.length);
      var fresh = makeDb();
      XCEM.Engine.setDb(fresh);
    }
    // T-IMP1: 5.1 importDrawResult 硬校验
    {
      var db = makeDb();
      var gid = makeGroupWithTeams(db, 4);
      // 用队名拼一份正确的抽签结果
      var teams = db.teams.filter(function(t){return t.groupId===gid;});
      var lines = ['抽签号\t队名\t单位\t组别\t特邀'];
      teams.forEach(function(t, i){ lines.push([i+1, t.name, t.organization||'', db.groups[0].name, ''].join('\t')); });
      XCEM.Engine.setDb(db);
      var r = XCEM.Engine.importDrawResult(gid, lines.join('\n'), '测试员', '');
      assert('T-IMP1 正确导入成功', r.ok, JSON.stringify(r));
      assert('T-IMP1 order 长度=队伍数', r.order.length === 4);
      // BUG-2 回归：导入后必须真正生成资格赛
      var qualCount = db.matches.filter(function(m){return m.groupId===gid && m.stage==='qualifying';}).length;
      assert('T-IMP1 导入后自动生成资格赛（' + qualCount + ' 场 > 0）', qualCount > 0, 'qualCount=' + qualCount);
      // 缺抽签号
      var bad = lines.slice(0,3).join('\n');
      var r2 = XCEM.Engine.importDrawResult(gid, bad, '测试员', '');
      assert('T-IMP1 缺抽签号 → 失败', !r2.ok && (r2.reason === 'missing_numbers' || r2.reason === 'parse_errors'));
      var fresh = makeDb();
      XCEM.Engine.setDb(fresh);
    }
    // T11: 算法幂等
    {
      var db = makeDb();
      var gid = makeGroupWithTeams(db, 6);
      runDraw(db, gid, 42);
      XCEM.Algorithm.genQualifyingMatches(db, gid).forEach(function(p, idx){
        db.matches.push({
          id:'m'+idx, groupId:gid, stage:'qualifying', round:1, matchIndex:idx+1,
          redTeamId:p.redTeamId, blueTeamId:p.blueTeamId,
          status:'locked', result: idx%3===0?'red_win':(idx%3===1?'blue_win':'draw'),
          score: idx%3===0?{red:3,blue:0}:(idx%3===1?{red:0,blue:3}:{red:1,blue:1}),
          manualLock:false, goldenGoal:false, deathPenalty:false,
          winnerTeamId: idx%3===0? p.redTeamId : (idx%3===1? p.blueTeamId : null),
          confirmedAt:new Date().toISOString()
        });
      });
      var r1 = XCEM.Algorithm.computeRanking(db, gid);
      var r2 = XCEM.Algorithm.computeRanking(db, gid);
      var a1 = r1.order.map(function(o){return o.teamId + '#' + o.rank;});
      var a2 = r2.order.map(function(o){return o.teamId + '#' + o.rank;});
      assert('T11 排名算法幂等性', JSON.stringify(a1)===JSON.stringify(a2));
    }

    // 恢复真实库，避免测试数据污染页面与 localStorage
    XCEM.Engine.setDb(realDb);
    try { XCEM.Storage.save(realDb); } catch(e) {}
    var html = ''
      + '<div class="alert ' + (fail===0?'success':'danger') + '">'
      +   '<b>结果：</b>' + pass + ' 通过 / ' + fail + ' 失败'
      + '</div>'
      + '<div class="table-wrap"><table class="tbl"><thead><tr><th>#</th><th>状态</th><th>测试</th><th>详情</th></tr></thead><tbody>'
      + log.map(function(l,i){
        return '<tr><td class="center">'+(i+1)+'</td><td class="center">' + (l.ok?'<span class="pill green">通过</span>':'<span class="pill danger">失败</span>') + '</td><td>' + esc(l.name) + '</td><td>' + esc(l.detail) + '</td></tr>';
      }).join('')
      + '</tbody></table></div>';
    var root = document.getElementById('diag-results');
    if(root) root.innerHTML = html;
    return { pass:pass, fail:fail, log:log.slice() };
  }

  function reset(){
    // 测试数据使用 makeDb 不会修改真实 db，因此无需特殊清理
  }

  return { run:run, reset:reset };
})();

/* =============================================================
   XCEM.App — 应用入口与初始化
   ============================================================= */
XCEM.App = (function(){
  var currentPage = 'dashboard';
  function init(){
    // 版本号（侧边栏底部）
    var sv = document.getElementById('side-version');
    if(sv) sv.textContent = 'v' + (XCEM.APP_VERSION || '6.0');
    // 9.1 popup 模式：自动跳到大屏
    if(location.search.indexOf('popup=bigscreen') >= 0){
      location.hash = '#bigscreen';
      // popup 模式隐藏侧栏/顶栏
      document.body.classList.add('popup-mode');
    }
    var db = XCEM.Storage.load();
    XCEM.Engine.setDb(db);
    // 顶栏事件
    document.getElementById('event-name-pill').textContent = db.event.name || '未命名赛事';
    document.getElementById('btn-lock-now').onclick = function(){
      XCEM.Engine.lock();
      applyLockState();
      toast('系统已锁定', 'success');
    };
    // 锁屏输入
    document.getElementById('btn-unlock').onclick = function(){
      var p = document.getElementById('lock-password').value;
      var r = XCEM.Engine.unlock(p);
      if(!r.ok){ document.getElementById('lock-msg').textContent = '密码错误'; return; }
      document.getElementById('lock-password').value='';
      document.getElementById('lock-msg').textContent='';
      applyLockState();
      toast('已解锁', 'success');
    };
    document.getElementById('lock-password').onkeydown = function(e){ if(e.key==='Enter') document.getElementById('btn-unlock').click(); };
    // 路由
    window.addEventListener('hashchange', route);
    route();
    // 自动锁屏
    setInterval(function(){
      var db = XCEM.Engine.getDb();
      if(!db.settings.autoLockMinutes) return;
      if(db.lock.locked) return;
      var lastActive = window.__xcemLastActive || Date.now();
      if(Date.now() - lastActive > db.settings.autoLockMinutes * 60 * 1000){
        XCEM.Engine.lock();
        applyLockState();
        toast('系统已自动锁定', 'warn');
      }
    }, 30000);
    ['click','keydown','mousemove'].forEach(function(ev){
      document.addEventListener(ev, function(){ window.__xcemLastActive = Date.now(); });
    });
    applyLockState();
  }

  function applyLockState(){
    var db = XCEM.Engine.getDb();
    var overlay = document.getElementById('lock-overlay');
    var pill = document.getElementById('lock-state-pill');
    if(db.lock.locked){
      overlay.classList.remove('hidden');
      pill.textContent = '🔒 已锁定';
      pill.style.background = 'rgba(220,38,38,.7)';
      document.getElementById('lock-password').focus();
    } else {
      overlay.classList.add('hidden');
      pill.textContent = '🔓 未锁定';
      pill.style.background = 'rgba(255,255,255,.12)';
    }
    // 顶栏赛事名实时刷新
    document.getElementById('event-name-pill').textContent = db.event.name || '未命名赛事';
  }

  function route(){
    var hash = (location.hash || '#dashboard').replace('#','');
    var page = hash || 'dashboard';
    currentPage = page;
    var db = XCEM.Engine.getDb();
    if(db.lock.locked){
      // 锁屏时不响应路由
      applyLockState();
      return;
    }
    XCEM.UI.renderNav(page);
    var fn = XCEM.UI.pages[page];
    if(fn){
      try{ fn(); }
      catch(e){ console.error('Render failed', e); XCEM.UI.setMain('<h1>页面错误</h1><div class="alert danger">' + esc(e.message) + '</div><pre>' + esc(e.stack||'') + '</pre>'); }
    } else {
      XCEM.UI.setMain('<h1>页面不存在</h1><div class="alert warn">未找到页面：' + esc(page) + '</div>');
    }
  }

  function reload(){
    // 【6.14.1】顶栏赛事名称随 reload 同步刷新（原仅 init/applyLockState 更新，保存赛事信息后顶栏仍显示旧名称）
    var db = XCEM.Engine.getDb();
    var pill = document.getElementById('event-name-pill');
    if(pill) pill.textContent = db.event.name || '未命名赛事';
    route();
  }
  function getCurrentPage(){ return currentPage; }

  function esc(s){
    if(s === undefined || s === null) return '';
    return String(s).replace(/[&<>"']/g, function(c){
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }

  return { init:init, route:route, reload:reload, getCurrentPage:getCurrentPage };
})();

// 启动
document.addEventListener('DOMContentLoaded', XCEM.App.init);
</script>
